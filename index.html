mian (Baal, El, Anu, Enki)", "Skeletal ancient DNA from excavations at Tell Halula, Tell Ramad, and PPNB Levant sites confirms haplogroup J2/J1 dominance. This serves as the direct genetic baseline for the Semitic and Hamitic agricultural populations of the Fertile Crescent, correlating with the localized emergence of the early Near Eastern pantheons at Ground Zero."], ["E1b1b (Paternal)", "Pre-dynastic & Old Kingdom Egyptians", "~4000–2000 BCE, Nile Valley & Horn of Africa", "Egyptian / Hamitic (Amun-Ra, Osiris, Apedemak)", "aDNA from pre-dynastic Nile Valley skeletons shows haplogroup E1b1b predominance, demonstrating localized population continuity in Mizraim (Egypt) and Cush (Sudan), correlating directly with the early emergence of the complex Hamitic solar and agricultural pantheons."], ["L3 (Maternal Mitochondrial)", "Mota Cave Skeleton (Ethiopia)", "~2500 BCE (~4500 BP), Gamo High lands", "All Non-African Lineages (Out of East Africa/Levant)", "The 4,500-year-old Mota Cave skeleton in Ethiopia is the first ancient African genome sequenced, confirming a massive back-migration of West Eurasians carrying Levant-related ancestry. In matrilineal genetics, haplogroup L3 is the sole ancestral node for all non-African maternal lineages (macro-haplogroups M and N). This is a precise genographic mirror of the post-flood and post-Babel dispersion, showing physical radiating waves out of the Near Eastern/East African hub."]]}, {"t": "h2", "x": "Related notes"}, {"t": "li", "x": "[[23 The 310 Traditions Matrix]]"}], "words": 8296}, "master-voynich": {"title": "Voynich Manuscript Research", "section": "Master Matrix", "sub": "EVA transliterations, folios, the Sherwood Leonardo line", "body": [{"t": "h2", "x": "Text analysis"}, {"t": "table", "x": "Char / Bennett / FSG / Currier", "head": ["Bennett", "FSG", "Currier"], "rows": [["D", "4", "4"], ["O", "O", "O"], ["S", "8", "8"], ["G", "G", "9"], ["Z", "2", "2"], ["L", "E", "E"], ["Q", "R", "R"], ["CT", "T", "S"], ["ET", "S", "Z"], ["H", "H", "P"], ["P", "P", "B"], ["F", "F", "V"], ["CHT", "HZ", "Q"], ["CPT", "PZ", "W"], ["CKT", "DZ", "X"], ["CFT", "FZ", "Y"], ["C", "C", "C"], ["\u0000Table 1: definition of the main historic alphabets"]]}, {"t": "p", "x": "Showing the first 70 of 237 rows; full sheet VM_Text_Analysis.", "sub": true}, {"t": "table", "x": "FSG / Currier", "head": ["FSG", "Currier"], "rows": [["I", "I"], ["IE", "G"], ["IIE", "H"], ["IIIE", "1"], ["IR", "T"], ["IIR", "U"], ["IIIR", "0"], ["L", "D"], ["N (*)", "N"], ["M (*)", "M"], ["IIIL", "3"], ["IK", "K"], ["IIK", "L"], ["IIIK", "5"], ["-6", "6"], ["-7", "7"], ["V", "(v)"]]}, {"t": "p", "x": "Showing the first 50 of 137 rows; full sheet Voynich_Decoding.", "sub": true}, {"t": "p", "x": "(*) Note: Tiltman used the FSG alphabet, but instead of N and M wrote IL and IIL."}, {"t": "p", "x": "One thing that immediately appears from this table is that the various researchers did not agree on what constitutes a single character in the Voynich MS text."}, {"t": "p", "x": "Later, Jim Reeds showed that many characters in the Voynich MS cannot be represented exactly by any of the existing alphabets. There are some 'rare' characters, and in addition there are what appear to be ligatures of several characters. These characters have traditionally been called 'weirdoes', though here I will use the term 'rare characters'. Jim Reeds produced a document with an overview of these rare characters, calling them 'X1' to 'X128'. An excerpt of this little known document is shown below."}, {"t": "h3", "x": "Table 2: early identification of rare characters in the MS"}, {"t": "p", "x": "Transliteration in the age of the WWW"}, {"t": "p", "x": "With the emergence of the \"World Wide Web\" and the start of the Voynich mailing list, transliteration of the parts that were still missing from Currier's and D'Imperio's efforts was continued using Currier's alphabet. A number of characters using lowercase were added to this alphabet. These are already included (in parentheses) in Table 1. As part of this effort, a file format for this transliteration file was adopted, about which more will be said further below."}, {"t": "p", "x": "In parellel to this, a completely new type of transliteration alphabet was designed:"}, {"t": "p", "x": "Frogguy"}, {"t": "p", "x": "The 'Frogguy' transliteration alphabet was designed by Jacques Guy in 1991. It uses lower-case characters, numbers and diacritical marks. Rather than representing complete characters, it represents the 'strokes' or minims of the script of the Voynich MS. As a result of this approach, it creates a reasonably close similarity between the script and the transliterated text. At the same time, some characters in the MS which may be assumed to be a single character are represented by several using this alphabet."}, {"t": "p", "x": "By its nature, it is the first alphabet that allows to properly represent many of the ligatured characters that were mentioned above. Jacques Guy also introduced the so-called 'capitalisation rule' which means that a character that is connected to the following one should be represented by a capital letter. The Frogguy transliteration alphabet and its use are explained in great in a locally preserved copy of Jacques' tuturial or alternatively in a shorter set of linked images. It may be of interest to show an example of this alphabet:"}, {"t": "p", "x": "8aiiv 4oqpc89 8a2 octox osa2o2"}, {"t": "p", "x": "An additional important contribution from Jacques Guy was a tool that allowed translation of transliteration files from one alphabet to another. This tool was called 'bitrans', was written in Pascal and ran in DOS. It could handle complex translation rules, such as needed for the Currier alphabet, where, for example, the translation of the character depends on context."}, {"t": "p", "x": "The Frogguy alphabet is the closest in appearance to the Voynich MS text, and it solves the main inconsistency of the Currier alphabet, namely that Currier synthesised strings of consecutive characters into single characters, while this was not done for strings of consecutive characters (8). However, it has a distinct disadvantage in that it is not very well suited for the type of numerical analysis mentioned at the top of this page, primarily because of its frequent use of the apostrophe, and to a lesser extent the mixture of letters and numbers. No signficant transliterations have been made using this alphabet."}, {"t": "p", "x": "When Gabriel Landini and myself embarked on a new transliteration of the MS, a project that we named \"EVMT\" at the time, we decided that a new alphabet, but one based on the principles of Frogguy, would be needed."}, {"t": "h3", "x": "Landini-Zandbergen: Eva"}, {"t": "p", "x": "EVA originally stood for European Voynich Alphabet, but later became 'Extensible Voynich Alphabet'. It was designed to be similar to Frogguy, but to use only alphabetical characters. It was designed by Gabriel Landini and myself with important contributions and suggestions from Jacques Guy.", "sub": false}, {"t": "p", "x": "Its design was part of a larger scheme which included:"}, {"t": "p", "x": "The need to be able to represent the entire text of the Voynich MS, including previously missing parts, e.g. some of the text outside the standard paragraphs."}, {"t": "p", "x": "The alphabet had to be a superset of FSG, Currier and Frogguy, such that a conversion of all existing transliteration to Eva would be possible and reversible (9)."}, {"t": "p", "x": "A clearway to idenfity rare characters, inspired by the list of Reeds shown in Table 2."}, {"t": "p", "x": "Standardisation of the transliteration file format, including a standard way to identify the location of all text items in the MS (called loci in the following)."}, {"t": "p", "x": "The capability to design a True Type Font that accurately represents the Voynich MS text (10)."}, {"t": "p", "x": "To achieve this, we heavily relied on the above-mentioned 'bitrans'."}, {"t": "p", "x": "Basic Eva' is the set of lowercase characters that was identified, and 'Extended Eva' includes the representation of all types of rare characters. The basic Eva alphabet was chosen such that the transliterated text is almost pronouncible. This excellent idea from Gabriel was not to be able to 'speak Voynichese', but to make it very easy for the human brain to recognise and remember transliterated words."}, {"t": "p", "x": "The rare characters can be classified into three categories:"}, {"t": "table", "x": "VM Text Analysis", "head": ["Char", "Bennett"], "rows": [["2", "Ligatures of only 'Basic Eva' characters"], ["3", "Ligatures including rare single characters"]]}, {"t": "p", "x": "Showing the first 40 of 734 rows; full sheet VM_Astronomy_Folios.", "sub": true}, {"t": "p", "x": "These were all identified in the course of the transliteration exercise, which was based on two documents: the Petersen handwritten copy of the MS already mentioned above (see note 3), and the Yale \"copyflo\" (11). As it turned out, there were three single characters that might be called unusual because they did not appear in any of the previously defined transliteration alphabets, but which occurred several times in the MS. These three characters:, and were assigned their own 'Basic Eva' letter (b, u and z respectively). The table of Basic Eva is included here:"}, {"t": "h3", "x": "Table 3: definition of 'Basic Eva'"}, {"t": "p", "x": "What appears from this table is that the characters and that have typically been considered units, and transliterated as N and M in both FSG and Currier, are transliterated in Eva as \"in\" and \"iin\". It is very important to point out that Eva is not attempting to identify semantic units in the text. It simply represents in an electronic form the shapes that are seen in the MS. It is left to a later step by analysts to decide which combinations should be seen as units. There is probably no right answer to this question, and the problems how to transliterate these strings of minims is addressed in a dedicated area."}, {"t": "p", "x": "Strings of i's"}, {"t": "p", "x": "While defining the alphabet, individual rare characters, or rare parts of ligatures, were assigned a 'high ASCII' code, and the way to include them into transliteration files is defined as follows: @185; for ascii code 185 (12). Table 4 shows all such rare characters addording to the latest version of the complete definition (13)."}, {"t": "h3", "x": "Table 4: the 'Extended Eva' character set"}, {"t": "p", "x": "This table has been re-drawn using the latest Eva-2 font. A full explanation by Gabriel Landini may be found here: link to Eva-2 reference (2025)."}, {"t": "p", "x": "Ligatures of characters may be represented in two ways. The first is the previously mentioned capitalisation rule introduced already by Jacques Guy. As Table 3 with the definition of basic Eva shows, this method allows an accurate representation of the text using the Eva True Type font. A capitalised character always connects to the next one. In addition, there are the following special cases:"}, {"t": "p", "x": "c / and q / already connect to the right, so there is no need to capitalise them h / and H / additionally connect to the left"}, {"t": "p", "x": "E / connects at the bottom."}, {"t": "p", "x": "Often, the characters Sh, cTh, cKh, cPh and cFh are simply written as sh, cth, ckh, sph and cfh respectively. This is more convenient, but it has the result that their rendition in the True Type Font is sub-optimal."}, {"t": "p", "x": "The second way to indicate ligatures in transliteration files, which is more intuitive for the human reader, is to enclose the connected characters in curly brackets (14). Table 5 shows examples of this."}, {"t": "h4", "x": "Capitalised EVA: Using TTF"}, {"t": "table", "x": "", "head": ["Char", "Bennett"], "rows": [["{cthh}ey", "cTHhey"], ["{yk}", "Yk"], ["{c@245;h}y", "c@245;hy"], ["\u0000Table 5: use of ligatures and the capitalisation rule"], ["\u0000Takeshi Takahashi"]]}, {"t": "p", "x": "Showing the first 40 of 587 rows; full sheet VM_Botanical_Complete.", "sub": true}, {"t": "p", "x": "It is published by Takeshi at his web site (for which see the table with links near the bottom of this page. Alternative forms derived from this are available in several places, see for example the following section."}, {"t": "p", "x": "The interlinear transliteration file"}, {"t": "p", "x": "Based on an initial effort by Jim Reeds, Gabriel Landini collected the important older transliterations mentioned above into a single interlinear file, meaning that they were presented together line by line. They were all converted into Eva, since this conversion is consistent and reversible, as mentioned above."}, {"t": "p", "x": "The brazilian Jorge Stolfi took this interlinear file and put a very significant effort into improving it, adding further transliterations. This included the complete transliteration of Takeshi Takahashi (status of 1999), where he converted the capitalised Eva to lowercase. He also added his own transliterations and partial transliterations from several others, for example John Grove. As a result, this interlinear file has become the defacto source for transliteration data. In the following, it will be referred to as the Landini-Stolfi Interlinear file, with the abbreviation LSI."}, {"t": "p", "x": "Text Analysis - Transliteration of the Text Introduction The main mystery of the Voynich MS is clearly its unknown writing. This topic is addressed from three different aspects, on three (sets of) pages: A look at the writing system, describing its main properties, and similarities and differences with other known writing systems; Transliteration of the text; Statistical analysis of the text of the MS (further subdivided into five areas)."}, {"t": "h3", "x": "DR. SHERWOOD'S AVA CIPHER KEY"}, {"t": "h4", "x": "VOYNICH DECODING WORK SPACE"}, {"t": "table", "x": "Voynich Decoding", "head": ymbols from Table 1, additional symbols that also resemble lowercase Roman letters and a few symbols whose identity was determined by trial and error. The AVA alphabet was basically derived as follows:"}, {"t": "table", "x": "VM Plant Anagrams", "head": ["a", "e", "o", "ch", "i"], "rows": [["Voynich", "0.087", "0.094", "0.05", "0.158"], ["Italian", "0.109", "0.115", "0.102", "0.1"], ["English", "0.082", "0.127", "0.075", "0.07"], ["German", "0.063", "0.16", "0.028", "0.076"], ["\u0000Table 2"]]}, {"t": "p", "x": "Table 2 shows the percentages for the vowels “a”, “e”, “i” and “o” calculated by combining the values given for Currier's A and B botanical folios(vii). These values are compared to the percentages of the same vowels for Italian, English and German. The percentages are closer to Italian than English or German where “e” has a higher percentage than the other vowels."}, {"t": "h3", "x": "Voynich Words"}, {"t": "table", "x": "", "head": ["Anagram", "ab", "abba", "Detail", "Detail (2)", "Detail (3)", "Detail (4)", "Detail (5)", "Detail (6)", "Detail (7)"], "rows": [["“ab” “abba” Florio’s 1611 Italian dictionary", "", "", "", "", "", "", "", "", ""], ["\u0000Table 3"], ["a", "a1", "b", "c2", "d3", "e", "e4", "f", "g1", "h"], ["m", "n", "o", "p", "p", "r", "s", "t3", "u", "v7"], ["\u0000Table 4, The AVA Alphabet"], ["2", "The symbol for “c” may also represent “ch”", "", "", "", "", "", "", "", ""], ["3", "“d” and “t” are also similar, except the “d” lacks a line through the middle", "", "", "", "", "", "", "", ""], ["4", "Alternate symbol for “e”", "", "", "", "", "", "", "", ""], ["5", "A normal “i” is occasionally used (folio 50r, 2nd word)", "", "", "", "", "", "", "", ""], ["6", "This symbol for “l” may also represent two “l”s.", "", "", "", "", "", "", "", ""], ["7", "A “v” may replace a “u”, particularly at the beginning of a word (see Florio’s 1611 dictionary)", "", "", "", "", "", "", "", ""], ["8", "Many of the embelishments make the VM’s alphabet appear ivory pieces."], ["Voynich Science", "Analysis of Radiocarbon Dating Statistics in Reference to the Voynich Manuscript", "Analysis of Radiocarbon Dating Statistics in Reference to the Voynich Manuscript", "Explores the statistical margin of error in C14 dating, suggesting uncertain ties in the calibration curve could shift the calendar year estimate significantly."], ["Voynich Science", "Analysis of Radiocarbon Dating Statistics in Reference to the Voynich Manuscript – Part II", "Analysis of Radiocarbon Dating Statistics in Reference to the Voynich Manuscript – Part II", "Argues that standard error reporting for radiocarbon dating is over-simplified, justifying an expanded margin of error for the VM's calendar age."]]}, {"t": "h2", "x": "Figures index"}, {"t": "table", "x": "", "head": ["Tab/Origin Article", "Figure ID/Reference", "Title/Decoded Item", "Subject/Details"], "rows": [["Leonardo & VM Manuscript", "Figure 1", "Birthing Tubs", "Astrological/biological baths comparison"], ["Leonardo & VM Manuscript", "Figure 2", "Signature", "Hidden signature marks in VM text"], ["Leonardo & VM Manuscript", "Figure 3", "Signature Comparison", "Comparison with Leonardo's standard signatures"], ["Leonardo & VM Manuscript", "Figure 4", "Birthday", "Astrological chart matching Leonardo's birth details"], ["Leonardo & VM Manuscript", "Figure 5", "Child like Drawings", "Analysis of drawing style indicating a precocious child"], ["Leonardo & VM Manuscript", "Figure 6", "Signs of the Zodiac", "Zodiac signs compared to Italian style"], ["Leonardo & VM Manuscript", "Figure 7", "Clock wise Astronomical Drawing", "Clock wise rotational markings"], ["Leonardo & VM Manuscript", "Figure 8", "The Cipher", "Introduction to the AVA phonetic symbols"], ["Voynich Manuscript Decoded?", "Words f99r/f88r", "Decoded Words", "Italian words decoded from botanical folios 99r and 88r"], ["Voynich Manuscript Decoded?", "Words f88v", "Decoded Words", "Italian words decoded from botanical folio 88v"], [ wer case letters 'p', 'l', and 'tl'."], ["Letters 'c', 'p', 'v'", "Anagrams", "Decoded from Italian anagrams like \"ccamus\" (sumac, f.4r), \"apio\" (parsley, f.65r), and \"viola\" (viola, f.9v)."], ["Orthography", "Phonetic Spelling", "Words are phonetically spelled, with prepositions/articles amalgamated into long anagrams (identical to Leonardo da Vinci's unique writing peculiarities)."]]}, {"t": "p", "x": "Web site Archive & Directory Biography & Academic Background's major research theories encompass the Leonardo da Vinci authorship of the Voynich Manuscript, the AVA alphabet, botanical plant identifications, and astronomical folios showing heliocentrism 100 years before Galileo. Table of Contents Articles Catalog A catalog of 25 main research papers, including summaries and URLs. Voynich Botanical Plants A database of 124 visual and cryptographic plant identifications."}, {"t": "h2", "x": "Leonardo connection"}, {"t": "table", "x": "Leonardo VM Connection", "head": ["Section", "Content", "Starting Row"], "rows": [["1", "Leonardo Quotes & Philosophy", "12"], ["2", "Bartolomeo the Turk: Leonardo's Notebooks", "31"], ["3", "VM History & Leonardo Authorship Evidence", "100"], ["\u0000§1. LEONARDO QUOTES & PHILOSOPHY"], ["\u0000There are three classes of people, those who see"], ["those who see when they are shown, and those who do not see.", "", ""], ["\u0000: Leonardo da Vinci"]]}, {"t": "p", "x": "Iwas introduced to the Voynich Manuscript about thirteen years ago. My immediate reaction on viewing selected folios from the VM was that the script closely resembled the handwriting of Leonardo da Vinci, an observation also noted by the son of Robert S. Brumbaugh (The Most Mysterious Manuscript, ed R.S. Brumbaugh, Southern Illinois University Press 1978, p 117). This and other factors led me to te the hypothesis that the VM was written by a young Leonardo da Vinci. Over the following years I wrote a number of articles supporting this hypothesis."}, {"t": "p", "x": "Recently, I received an email from Tania Ocampo, who wrote that she considered that Leonardo and the author of the VM have very similar handwriting. She sent me a sample of Leonardo’s writing that provides additional proof that my hypothesis that Leonardo wrote the VM may be correct. I emailed Tania, suggesting that she either put this sample of Leonardo’s writing up on the internet or, if this was difficult for her to do, I would do it for her, giving her the credit for a very useful observation. This is the reason I am writing this article."}, {"t": "p", "x": "The VM is written from left to right and from top to bottom by an individual writing with their right hand. It is very well known that Leonardo was left handed. His notebooks were written from right to left using mirror image script. These books were private, written for his eyes only. He wrote in a conventional manner, from left to right, when he wished to communicate with other people. Leonardo celebrated the fact that he defied public convention, declaring ‘I o mancino’, I am left handed. Left-handed people were called southpaws and accused of practicing witchcraft."}, {"t": "p", "x": "The Devil himself was considered to be a leftie. People writing from left to right, when using their left hand, tend to smudge the ink as their hand moves across the page. Left-handed children were forced to write with their right hand, a practice that continued until the beginning of the 20th century. Leonardo would have been taught to write with his right hand and probably only rebelled against this convention when he became an adult."}, {"t": "p", "x": "If you read my article ‘Was the Author of the Voynich Manuscript Left-handed’, I show that although the script is right-handed, the hatching in the drawings was done by a individual using his left hand."}, {"t": "p", "x": "If Leonardo is to be accepted as the author of the VM, a comparison of his handwriting with the VM script is desirable. A comparison of the two scripts must be judged, taking into account the following observations:"}, {"t": "p", "x": "The VM uses a unique alphabet with over 30 different symbols, most of them unlike any other alphabet. A number of attempts have been made to transcribe of the VM alphabet, the one generally accepted is known as ‘The European Voynich Alphabet’ EVA."}, {"t": "p", "x": "An individual’s handwriting matures with age. There are no examples of Leonardo’s childhood handwriting. The earliest known example of his script is from 1473, when he was 21 years old. It was decorated with exaggerated curlicues and flourishes, similar to the embellishments found in the VM script. As he matured, these embellishments disappeared and his handwriting became utilitarian."}, {"t": "p", "x": "Plate 1 is a comparison of a sample of Leonardo’s writing provided by Tania, with text from VM plant folio No. 87r."}, {"t": "p", "x": "Plate 2 is a comparison of the mirror image of this sample with the same text. The scripts appear to be very similar. I am not a handwriting expert, but I have no difficulty in believing that Leonardo’s left hand wrote the example that Tania sent me and his right hand wrote the VM example."}, {"t": "p", "x": "Ihave been unable to determine the notebook Tania’s script came from, but it may be found on several web sites relating to Leonardo’s handwriting."}, {"t": "p", "x": "I dedicate this article to my 10 year old grandson. One day recently, he was looking over my shoulder while I was reading an article on the VM. He exclaimed, “I didn’t know that you knew about the Voynich Manuscript.” and proceeded to tell me all about the manuscript, including naming the missing folios. He had read the children’s book ‘Trust No One’ by Linda Sue Parks, book 5 from the series, 39 Clues. Perhaps this book should be added to the inventory of books about the VM."}, {"t": "h3", "x": "§2. BARTOLOMEO THE TURK: LEONARDO'S notebooks"}, {"t": "p", "x": "Leonardo da Vinci jotted down in one of his notebooks the following reminder: “Write to Bartolomeo the Turk as to the flow and ebb of the Black Sea, and whether he is aware if there is such a flow and ebb in the Hyreanean or Caspian Sea.”(i) According to Ritter, who was the original translator of Leonardo’s notebooks, the handwriting indicates that the note was written during the latter years of his life. I have checked many publications including recent ones relating to Leonardo and his life but no one appears to have identified Bartolomeo the Turk. Leonardo’s comment indicates that:"}, {"t": "p", "x": "Bartolomeo the Turk and Leonardo da Vinci lived in different towns."}, {"t": "p", "x": "Bartolomeo the Turk was familiar with the Black Sea but not necessarily the Caspian Sea."}, {"t": "p", "x": "The name Bartolomeo is a fairly common Latin name, but Leonardo’s spelling of the name is Italian. The name is spelt Bartolome in Spanish and Bartolomeu in Portuguese. Although Leonardo did not pay too much attention to spelling, it is likely that the person he was referring to was Italian."}, {"t": "p", "x": "Iwould like to propose, for the reasons given above, that Bartolomeo di Domenico Marchionni, scion of the Marchionni family,(ii) was Bartolomeo the Turk. Bartolomeo Marchionni had the patronym Domenico. Another of Leonardo’s friends, “Fioravante di Domenico at Florence is my most beloved friend, as though he were my brother”(iii) had the same patronym. Is this a coincidence or were Bartolomeo and Fiorvante brothers? This observation could possibly be confirmed by consulting the archives in Florence for a frame around 1470, to determine whether two brothers in the Mardhionni family had the names, Bartolomeo and Fiorvante."}, {"t": "p", "x": "Bartolomeo Marchionni, who became the wealthiest banker in Lisbon, was a major trader in West African slaves and was known in Lisbon as Bartholomeu Florentim.(iv) From around 1360 his family were prominent traders in Kaffa (now known as Feodosia), the Genoese dominated city, on the Crimean peninsula on the Black Sea.(v) The economy of Kaffa was based on trading of slaves, musk, gold, ivory and spices. The Marchionni family imported slaves, mainly females, into northern Italy to work as domestic servants."}, {"t": "p", "x": "In this connection it is interesting to note that Alessandro Vezzosi, the director of the Museo Ideale Leonardo da Vinci, has concluded that da Vinci’s father was a minor nobleman or craftsman named Ser Piero da Vinci, while the artist’smother was a Middle Eastern slave, known by the name Caterina. Leonardo was left-handed, but began all of his notebooks on the last page, which was customary for Arabs and Jews.(vi) Is it possible that the Marchionni family sold Caterina to Leonardo’s father?"}, {"t": "p", "x": "Constantinople fell to the Ottoman Turks in 1453. This did not prevent the Marchionni family from continuing their slave trading operations in Kaffa, as they still had at least one representative there in 1462.(vii) Kaffa came under Turkish rule in 1475, ending all European trade in the region. This association with the Turkish conquest of Constantinople and the Black Sea and the slave trading activities of the Marchionni family in Kaffa could have earned Bartolomeo Marchionni the nickname “Bartolomeo the Turk.”"}, {"t": "p", "x": "Sergio Tognetti, a contributor to the book Black Africans in Renaissance Europe, has stated that prior to 1470, Bartolomeo Marchionni lived in Florence with his family who owned an apothecary shop that overlooked Brunelleschi’s Basilica of San Lorenzo (location #1).(viii) Spices were a valuable commodity in the 15th century, often worth their weight in gold, and were among the items obtainable from Kaffa on the Black Sea. Owning an apothecary shop/spice shop would be a logical addition to the slave trading activities of the Marchionni firm."}, {"t": "p", "x": "At the same time, Leonardo’s father was living on the Plaza Signoria (location #5) and had an office opposite the Bargello (location #4), both within a few blocks of the apothecary shop owned by the Marchionni family. Verrocchio’s bottegha, where Leonardo was an apprentice, was also close by.(ix) In 1470 Bartolomeo Marchionni was fifteen years old, two to three years younger than Leonardo da Vinci. The two teenage boys may have known each other. Judging by their addresses, both families were among the Florentine elite."}, {"t": "p", "x": "The occupation of Kaffa by the Ottoman Turks ended the slave trading activities of the Marchionni family. Bartolomeo Marchionni left Florence in 1470 and went to Lisbon as an office boy to the Cambini family of merchant bankers and West African slave traders. He probably intended to transfer the family business to Portugal where the West African slave trade was in its infancy. By 1482, about the same time as the bankruptcy of the Cambini Bank, Marchionni was well established as a merchant banker in Lisbon, with sugar plantations in Madeira. He was also becoming a major player in the West African slave trade.(x)"}, {"t": "p", "x": "The possible association of Bartolomeo Marchionni with Leonardo da Vinci extended to having mutual friends and colleagues in common. Marchionni worked with Benedetto Portinari in Lisbon and had a business relationship with Tommaso Portinari who managed a branch of the Medici bank in Bruge from 1473-1481. In 1474 or 1475 Marchionni and the Portinari brothers used money from this bank to finance an unsuccessful voyage to obtain gold from West Africa.(xi) This was probably the ill-fated Flemish ship that in 1475 was wrecked off the West African coast on its return voyage to Bruge."}, {"t": "p", "x": "The local inhabitants ate the crew and sold the gold to Portuguese traders the following year.(xii) Lorenzo de Medici and his bank absorbed all the financial losses resulting from the sinking of this ship. When the Medici Bank in Bruge went bankrupt in 1479, an audit of the books listed Bartolomeo Marchionni and Benedetto Portinari among its debtors. The bank was closed and Tommasso went to live in Milan.(xiii)"}, {"t": "p", "x": "Leonardo’s life in Florence in the 1470’s was fraught with difficulties. He was twice accused of sodomy, and in 1481 he was not included among the painters selected to go the Vatican to assist in decorating the recently built Sistine chapel. Sometime around 1482 to 1483 Leonardo left Florence for Milan. Here he met Tommasso and Benedetto Portinari who were both interested in painting, having had their portraits painted by Hans Memling, the Flemish painter. In his journal, Leonardo made the following notation:"}, {"t": "p", "x": "“Ask Benedetto Portinari how the people go on the ice in Flanders?”(xiv) Bruge was at that time part of Flanders. In 1487, Tommasso Portinari became an ambassador to Ludovico Sforza of Milan, representing Maximillian I of Austria. He may have helped Leonardo obtain work at the Sforza court."}, {"t": "p", "x": "Leonardo also had a close relationship with Benedetto Dei, a representative of the Portinari family, who in 1470 was the first white man to visit Timbukto."}, {"t": "p", "x": "Leonardo wrote Benedetto Dei a lengthy letter about bringing him “news from the East” and of “a giant appearing from the Syrian Desert.”(xv) Dei is known to have been in Milan between 1484-87, but Leonardo may have met him earlier in Florence through his association with Paolo Toscanelli with whom Dei was very friendly.(xvi) Leonardo referred to Toscanelli as Maestro Paolo the physician.(xvii) It can also be shown that Marchionni knew Toscanelli, the renowned astronomer, physician, geographer."}, {"t": "p", "x": "The eulogy Marchionni gave to King Manual of Portugal credited Toscanelli with influencing Portugal’s nautical activities.(xviii) These mutual acquaintances may have helped maintain Leonardo’sand Bartolomeo Marchionni’s boyhood association, assuming they had one."}, {"t": "p", "x": "With the impending invasion of Milan by the French and the subsequent downfall of Ludvico Sforza, Leonardo was forced to leave Milan during the last days of 1499. He was again confronted with adversity. Meanwhile Marchionni was going from strength to strength. He helped finance the Portuguese voyages to India and the Orient. His caravel, the Santiago, sailed for India with Vasco da Gama’s fleet in 1497, returning in September 1499 with a cargo of spices.(xix) Isabella d’Este was aware of a letter Marchionni wrote to friends in Italy concerning this expedition."}, {"t": "p", "x": "Around this time Leonardo visited Isabella d’Este in Mantua and made a half-length portrait drawing of her that now hangs in the Louvre. Perhaps he was present when this nautical triumph of da Gama was being discussed.(xx)"}, {"t": "p", "x": "In 1502, while in the services of Cesare Borgia, Leonardo apparently offered his services to Sultan Bejazer II to build a bridge at Constantinople over the Golden Horn. Needless to say the bridge was never built. The note relating to Bartolomeo the Turk was apparently written during Leonardo’slater years and probably had nothing to do with Leonardo’s contact with the sultan.(xxi)"}, {"t": "p", "x": "Marchionni owned one of the ships that sailed with Cabral in 1501 that resulted in the accidental discovery of Brazil.(xxii) He probably engineered and financed the subsequent expedition to Brazil that included his friend and fellow Florentine trader and explorer, Amerigo Vespucci. Vespucci’s letters to his patrons, Lorenzo di Pierfrancesco de’ Medici (Lorenzo de’Medici’s cousin) and Piero Soderini (the governor of Florence) described his voyages to this New World. These letters convinced the Europeans that a new continent had been discovered. Leonardo was acquainted with Amerigo Vespucci.(xxiii) and Vasari claims that there was a sketch of Amerigo Vespucci in Leonardo’s book of drawings.(xxiv)"}, {"t": "p", "x": "Leonardo returned to Milan in 1506, where he worked until the unrest in Milan again forced him to leave in 1511. From 1513 to 1516, Leonardo, now over sixty, worked for the first time in Rome under the patronage of Guliano de Medici, the youngest son of Lorenzo de Medici. While in Rome, Leonardo lived in an apartment at the Belvedere, a summer palace outside the Vatican and near the papal palace.(xxv) Hanno, the albino elephant from India, was living in the courtyard of this palace during Leonardo’s stay."}, {"t": "p", "x": "This elephant was a present to Pope Leo X (Giovanni de Medici, the middle son of Lorenzo) from King Manuel of Portugal. There appears to have been a good relationship between the two younger sons of Lorenzo and the Portuguese throne. Bartolomeo Marchionni was still sending representatives, generally Florentine associates, with the Portuguese on voyages to India.(xxvi) In 1515-16, Giovanni of Empoli, an employee of Marchionni and Andrea Corsali, a Florentine merchant and explorer, both sent letters to Guliano de Medici in Rome describing their travels. In a letter dated 1515, Corsali wrote the following:"}, {"t": "p", "x": "“a gentile people called Guzzarati who do not feed on anything that has blood, nor will they allow anyone to hurt any living thing, like our Leonardo da Vinci, they live on rice, milk and other inanimate foods.”(xxvii)(xxviii) Guliano de Medici died early in 1516 and Leonardo left Rome later that year, so it is not clear whether either of them actually saw these letters."}, {"t": "p", "x": "Amap showing details of the Northern hemisphere, was found among Leonardo’s papers in the Windsor collection.(xxix) It was obviously drawn shortly after Ponce de Leon discovered the southeast side of Florida in 1513. Florida was initially, as this map indicates, assumed to be an island and only later was it realized that Florida was part of the North American continent. Of particular interest are the details given on this map of the West African coastline, including the position of the fort at Elmina, or Mina, where the Portuguese had located gold."}, {"t": "p", "x": "It has been established that someone other than Leonardo drew this map, someone familiar with Portuguese activities in Africa, India and the Orient. Richter comments: “Leonardo’s researches as to the structure of the earth and the sea were made at a time, when the extended voyages of the Spaniards and Portuguese had also excited a special interest in Italy.”(xxx) Leonardo was very interested in countries in the East, but never mentions the discovery of America.(xxxi) If he saw the letters from Giovanni of Empoli and Andrea Corsali then this map may have been used to illustrate their travels."}, {"t": "p", "x": "The above discussion indicates the following:"}, {"t": "p", "x": "The Marchionni family who ran a slave trading organization in Kaffa on the Black sea, may have sold Leonardo’smother to his father."}, {"t": "p", "x": "Bartolomeo Marchionni was a couple of years younger than Leonardo."}, {"t": "p", "x": "Prior to 1470, Bartolomeo Marchionni lived in Florence close to where Leonardo was an apprentice to Verrocchio. The two teenaged boys may have known each other."}, {"t": "p", "x": "Bartolomeo Marchionni may have visited Kaffa during his youth thus earning him the nickname Bartolomeo the Turk."}, {"t": "p", "x": "From about 1480 until 1516, Leonardo and Bartolomeo Marchionni had many friends and associates in common so it is difficult to imagine that the two men did not know of each other."}, {"t": "p", "x": "Consolidated research from Dr. Edith Sherwood Leonardo's authorship of the Voynich Manuscript"}, {"t": "h2", "x": "African art and Portuguese trade"}, {"t": "p", "x": "Section: Content"}, {"t": "p", "x": "§1. IFE BRASS SCULPTURES & AFRICAN RENAISSANCE ART"}, {"t": "p", "x": "Among the most famous of the West African brass sculptures are the eighteen naturalistic portrait heads discovered in Ife Nigeria, in 1938. Recently, an exhibit of these heads together with other brass, terracotta and stone artifacts from Ife, toured selected museums in the UK and USA(I). This exhibit caused many viewers to reconsider their opinion that African art is the work of a primitive people. These remarkable artifacts are equal in workmanship and artistry to sculpture made during the European Renaissance."}, {"t": "p", "x": "Ife tradition claims that brass casting began during the reign of the Oni Obalufon and that his craftsmen made the Obalufon mask(II). Archaeological excavations in Ife have not revealed any evidence of metal casting, not even the most primitive of metal objects. This has led to speculation among the African art historians as to the origin of the Ife heads. A number of theories have been advanced:"}, {"t": "p", "x": "Leo Frobenius, during an expedition to Nigeria from 1910-12, was shown the brass Olokun head, the Obalufon mask and various terracotta heads. He was astonished by the quality and artistry of the objects and questioned their African origin. He wondered whether he had found evidence of an African Atlantis(III)."}, {"t": "p", "x": "Frank Willett proposed that the Ife heads were used as funeral effigies for various deceased Onis of Ife, and were the product of different sculptors working over several centuries. This hypothesis is still accepted by many African art historians(IV)."}, {"t": "p", "x": "Kenneth Murray, suggested that “only one artist, working for a couple of years, made the majority of the heads.” His reason for this conclusion was based on the heads’ stylistic similarities(V)."}, {"t": "p", "x": "William Fagg pointed out that all the Ife heads had a couple of features in common; the mouth was displaced by about 6 millimeters from the midline of the face and the corners of each mouth ended in a depression or dimple. He considered that these “two artistic peculiarities are a mannerism of the artist rather than fidelity in portraiture.” Portraits painted by some Renaissance artists have the same artistic peculiarities(VI)."}, {"t": "p", "x": "Stefan Eisenhofer is of the opinion that the Ife heads can only be dated to some period before 1700 AD(VII). Thermoluminescent analysis of core samples taken from the interior of two of the heads gave the following approximate dates: 1440 +/-65 A.D and 1490 +/-85 A. D. possibly dating the Ife heads to the latter part of the 15th century(VIII)."}, {"t": "p", "x": "The Composition of the Heads"}, {"t": "p", "x": "The Ife heads fall into two groups; six were cast from almost pure copper (data not given), the remaining twelve from brass. Chemical analysis of the brass is presented in Table I(IX). The sample numbers are assigned by Underwood(X)."}, {"t": "h3", "x": "Table I Composition of the Ife Brass Heads. (Baker 1965)"}, {"t": "table", "x": "African Art Trade", "head": [], "rows": [["Head No.", "% Copper", "% Zinc", "% Lead", "% Tin", "% Iron", "Total"], ["1", "68.8", "11.6", "15.9", "0.9", "0.9", "98.1"], ["2", "71.2", "13.3", "11.8", "0.6", "0.7", "99.6"], ["7", "74", "15.3", "5.6", "1.2", "0.2", "96.3"], ["8", "71.8", "15", "11.1", "0.7", "0.6", "99.2"], ["9", "74.3", "9.6", "11.6", "1.3", "0.6", "99.2"], ["11", "74.1", "11.9", "11.3", "1.3", "0.8", "98.4"], ["12", "77.5", "9.3", "9.9", "1.1", "0.6", "98.4"], ["13", "73.4", "9.7", "14.5", "0", "0.9", "98.5"], ["14", "76.2", "11", "6.4", "1.7", "0.4", "98.6"], ["15", "79.8", "11.8", "4.4", "0.9", "0.6", "97.5"], ["16", "74.2", "12.3", "11", "1", "0.6", "99.1"], ["18", "73.4", "13.1", "11.4", "0.8", "0.6", "99.3"], ["1", "The analytical results do not add up to exactly 100%, indicating that some oxidation of the metal surface may have taken place.", "", "", "", "", ""], ["2", "Head 7 contains 2.6% gold in addition to the other metals.", "", "", "", "", ""]]}, {"t": "h4", "x": "Table II Physical Properties of the Metals"}, {"t": "table", "x": "", "head": ["Head No.", "% Copper", "% Zinc", "% Lead", "% Tin", "% Iron", "Total"], "rows": [["Section", "Content", "Starting Row", "Share", "Detail", "Detail (2)", "Detail (3)"], ["1", "Ife Brass Sculptures & African Renaissance Art", "11", "", "", "", ""], ["2", "Afro-Portuguese Ivory Trade", "128", "", "", "", ""], ["Metal", "m.p. °C", "b.p. °C", "Density gm/cm3", "Source in Nature", "", ""], ["Copper", "1083", "2562", "8.92", "Free metal", "", ""], ["Zinc", "419.5", "907", "7.1", "Salts only", "", ""], ["Lead", "327.5", "1718", "11.3", "Free metal", "", ""], ["Brass", "900-940", "", "8.4-8.75", "", "", ""], ["1", "Zinc, due to its low boiling point, is volatile and is readily oxidized to zinc oxide. The density of brass varies according to its composition.", "", "", "", "", ""], ["2", "Zinc ores, although abundant in nature, only occur in the form of a salt like calamine (zinc carbonate). The free metal was isolated in Europe in the 18th century, but may have been made in India at an earlier date.", "", "", "", "", ""], ["3", "Brass was first produced during Roman times using a cementation process.", "", "", "", "", ""], ["4", "When molten brass containing less than 35% zinc solidifies, the zinc and copper atoms bond in a face centered cubic lattice structure known as alpha brass.", "", "", "", "", ""], ["5", "Brass loses approximately 10% of its weight when re-melted due to some of the zinc atoms vaporizing(XI).", "", "", "", "", ""], ["6", "About 2% by weight of lead is added to molten brass to make it easier to pour. As the brass cools, the lead separates into small droplets. The size of the droplets depends on the rate of cooling. A slow rate produces larger droplets. Metallographical examination of the micro-structure of Head 7 indicated a slow rate of cooling(XII).", "", "", "", "", ""]]}, {"t": "p", "x": "Dr. Edith Sherwood's research on Ife brass sculptures, Afro-Portuguese ivories, and Renaissance connections"}, {"t": "h2", "x": "Summary: Voynich and Leonardo"}, {"t": "h3", "x": "VOYNICH MANUSCRIPT: LEONARDO DA VINCI CONNECTION"}, {"t": "table", "x": "Summary Voynich Leonardo", "head": ["THE SHERWOOD BREAK THROUGH", "LEONARDO DA VINCI EVIDENCE", "WHY WAS IT ENCODED?"], "rows": [[  is strictly geographic. It is named after the subcontinent of India (which in turn gets its name from the Indus River) because the ocean heavily surrounds and borders it. Arctic Ocean: This name comes from the ancient Greek word arktikos, which means \"near the bear.\" The \"bear\" in question isn't a polar bear, but rather the northern constellation Ursa Major (the Great Bear). Explorers used this constellation to locate Polaris, the North Star, to help them navigate the northern hemisphere. Ursa Major (The Great Bear)."}, {"t": "p", "x": "Southern Ocean: The newest ocean to be officially recognized (in 1999) has the most straightforward name. It is named simply for its geographic location, completely surrounding the South Pole and Antarctica. The \"Dry Sea\" of the Lost Ocean The dry sea you are thinking of is the Aral Sea, which has now largely become a newly formed desert known as the Aralkum Desert. westwards.de Where it is: It is located in Central Asia, situated directly across the border between Kazakhstan to the north and Uzbekistan to the south. Shipwrecks in the Aralkum Desert."}, {"t": "h2", "x": "Extinct oceans research"}, {"t": "p", "x": "What ocean no longer exist and why is it called what it’scalled Throughout Earth's history, the continuous movement of tectonic plates has drastically reshaped the planet's surface, opening up new oceans and completely destroying old ones. Because of this, there are actually a few famous \"extinct\" oceans. Here are the three most well-known lost oceans, what happened to them, and how they got their names. The Tethys Ocean What it was:"}, {"t": "p", "x": "A massive body of water that existed during much of the Mesozoic Era (about 250 to 65 million years ago). It separated the ancient super continents of Laurasia in the north and Gondwana in the south. Why it no longer exists: As tectonic plates shifted, the African and Indian plates drifted northward and smashed into the Eurasian plate. This massive, slow-motion collision essentially squeezed the ocean out of existence. The impact pushed the ancient seafloor up into the sky, creating the Himalayas and the Alps. Today, the Mediterranean, Black, and Caspian seas are the last remaining fragments of the Tethys."}, {"t": "p", "x": "The name: In 1893, Austrian geologist Eduard Suess discovered evidence of this ancient sea and named it after Tethys, a sea goddess in Greek mythology. She was an aquatic Titan who was both the sister and wife of Oceanus (the god of the earth-encircling river). Panthalassa Supercontinent Pangaea with modern continental borders, Super ocean Panthalassa, and Paleo-Tethys Ocean.: The vast, global \"super ocean\" that completely surrounded the famous supercontinent Pangaea around 300 to 200 million years ago. Why it no longer exists:"}, {"t": "p", "x": "When Pangaea eventually broke apart, the newly formed continents drifted outward into Panthalassa, dividing it up and reshaping the globe. The modern Pacific Ocean is the central remnant of Panthalassa, while the Atlantic and Indian Oceans were formed in the new gaps created by the splitting landmasses. The name: The name is derived directly from ancient Greek. Pan means \"all,\" and thalassa means \"sea\" or \"ocean.\" It literally translates to \"all-sea,\" a perfect description for a single body of water that covered nearly 70% of the Earth's surface. The Iapetus Ocean What it was:"}, {"t": "p", "x": "An even older ocean that existed between 600 and 400 million years ago, situated between the ancient landmasses that would eventually become North America, Europe, and parts of Africa. Why it no longer exists: It closed up when these landmasses crashed together to form a new supercontinent, pushing up the Appalachian Mountains in the process. Millions of years later, when those landmasses split apart again, the rift created the modern Atlantic Ocean. The name:"}, {"t": "p", "x": "Because the Iapetus Ocean was situated geographically in the exact same place that the Atlantic Ocean is today, scientists looked to Greek mythology for a clever name. The Atlantic Ocean is named after the titan Atlas. In mythology, Iapetus was another Titan and the father of Atlas. Therefore, the ancient \"father\" of the Atlantic Ocean was named after the father of Atlas. Interesting so what are all the oceans named after? I heard as a result of the lost ocean we also have a dry sea now. Where is that and what’sit called?"}, {"t": "p", "x": "The origins of our current ocean names are a mix of mythology, geography, and the personal experiences of early explorers. Here is how the five modern oceans got their names: Pacific Ocean: In 1520, Portuguese explorer Ferdinand Magellan navigated his fleet through the treacherous waters at the tip of South America. When he finally reached the vast ocean beyond, he found the waters incredibly calm and the winds favorable. He named it Mar Pacífico (Latin for \"peaceful sea\"). Atlantic Ocean:"}, {"t": "p", "x": "The ancient Tethys Ocean had a massive northern branch known as the Paratethys Sea. As the Earth's tectonic plates shifted and mountains rose, this giant inland sea became completely landlocked. Over millions of years, it fragmented into a few separate, smaller bodies of water. Today, the Caspian Sea, the Black Sea, and the Aral Sea are the last remaining puddles of the Paratethys."}, {"t": "h2", "x": "Ancient oceans geology"}, {"t": "table", "x": "", "head": ["THE TETHYS OCEAN", "Note", "Detail", "Detail (2)"], "rows": [["What it was", "Massive body of water during Mesozoic Era (250-65 million years ago)", "Separated Laurasia (north) from Gondwana (south)", "Located where Mediterranean, Middle East, Himalayas are today - BIBLICAL LANDS"], ["Why it disappeared", "African & Indian plates drifted north, smashed into Eurasian plate", "Collision squeezed ocean out of existence", "Created the Alps and Himalayas - pushed ancient sea floor into sky"], ["Modern remnants", "Mediterranean, Black, and Caspian e subducting under the Mariana Plate. Peru-Chile Trench: Formed by the subduction of the Nazca Plate beneath the South American Plate, driving the uplift of the Andes Mountains."}, {"t": "p", "x": "Aleutian Trench: Located off the coast of Alaska, formed by the Pacific Plate subducting under the North American Plate. Philippine Trench: A major trench in the western Pacific, formed by complex interactions between the Philippine Sea Plate and the Eurasian Plate. Tonga Trench and Kuril-Kamchatka Trench: Significant subduction zones in the southwestern and northeastern Pacific, respectively, contributing to high seismic and volcanic activity."}, {"t": "h2", "x": "Arcturus and the Blaze Star"}, {"t": "h3", "x": "ARCTURUS AND T CORONAE BOREALIS RESEARCH"}, {"t": "table", "x": "", "head": ["Greek Name", "Arktouros", "Bear Guard or Keeper", "arktos + ouros"], "rows": [["ARCTURUS", "Detail", "Detail (2)", "Detail (3)"], ["Location", "Brightest in Bootes", "Follows Ursa Major", "4th brightest star"], ["Job Reference", "Job 9:9 and 38:32", "Hebrew: Ayish", "Can you guide Arcturus?"], ["Enoch Link", "Follows the Bear (North)", "North special in 1 Enoch", "Hoarfrost own Angel"], ["ADAM Link", "ARKTOS = North/Bear", "Arcturus guards Bear", "Star that WATCHES bear"], ["What It Is", "Recurrent nova", "Between Hercules and Arcturus", "Red giant + white dwarf"], ["80-Year Cycle", "Erupts every 79-80 years", "Last: 1946", "Next: Nov 2025 or Jun 2026"], ["Recorded Eruptions", "1217, 1787, 1866, 1946", "4 documented", "Once-in-a-lifetime!"], ["Why It Dims First", "Star DIMMER before eruption", "Same pattern in 1946", "Currently dimming NOW"], ["How It Works", "Hydrogen builds on dwarf", "Thermonuclear runaway", "Nuclear explosion = nova"], ["Visibility", "Bright as North Star", "Naked eye for 5 days", "Best from Northern Hemisphere"], ["How to Find It", "Near Hercules constellation", "Corona Borealis nearby", "Erupts outside the Crown"], ["Something happened to star", "T CrB is dimming"
