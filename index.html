ckle this babe for thee?,\" And she said (unto her) : \" Go.\" 8. And she went- and called thy mother Jochebed,2 and she gave her wages, and she nursed thee. 9. And afterwards, when thou wast grown up, they brought thee unto the daughter of Pharaoh, and thou didst become her son, and Amram thy father taught thee writing,3 and after thou hadst completed three weeks they brought thee into the royal court. 10. And thou 2351-2372 wast three weeks of years at court until the time a.m. when thou didst go forth from the royal court and didst see an Egyptian smiting thy friend who was of the children of Israel, and thou didst slay him and hide him in the sand. 11."}, {"t": "p", "x": "And on the second day thou didst find two of the children of Israel striving together, and thou didst say to him who was doing the wrong : \" Why dost thou smite thy brother? ' 12. And he was angry and indignant, and said : \" Who made thee a prince and a judge over us? Thinkest thou to kill me as thou killedst the Egyptian yesterday ? \" And thou didst fear and flee on account of these words. 1 Thcrmuthis (Josephus, Ant. ii. 9, 5, 7). a Cf. Exod. vi. 20; Num.xxvi.59. 3 Contrast Acts vii. 22. From the Flight of Moses to the Exodus (xlviii. 1-19; cf. Exod. ii. 15 if., iv. 19-24, vii.-xiv.). XLVIII. And in the sixtli year of the third week 2372 AM. of the forty-ninth jubilee thou didst depart and dwell in the land of Midian l five weeks and one year."}, {"t": "p", "x": "And thou didst return into Egypt 2 in the second week in the second year in the fiftieth jubilee. 2. 2jioa.m. And thou thyself knowest what He spake unto thee on Mount Sinai, and what prince Mastema. 3 desired to do with thee when thou wast returning into Egypt on the way when thou didst meet him at the lodgingplace. 3. Did he not with all his power seek to slay thee and deliver the Egyptians out of thy hand when he saw that thou wast sent to execute judgment and vengeance on the Egyptians ? 4 4. And I delivered thee out of his hand, and thou didst perform the signs and wonders which thou wast sent to perform in Egypt against Pharaoh, and against all his house, and against his servants and his people. , 5."}, {"t": "p", "x": "And the Lord executed a great vengeance on them for Israel's sake, and smote them through (the plagues of) blood and frogs, lice and dog-flies, and malignant boils breaking forth in blains ; and their cattle by death; and by hail-stones, thereby He destroyed everything that grew for them ; and by locusts which devoured the residue which had been left by the hail, and by darkness ; and (by the death) of the first-born of men and animals, and on all their idols the Lord took vengeance and burned them with fire.6 6. And everything was sent through thy hand, 1 Cf. Exod. ii. 15. * Cf. Exod. iv. 19. s Notice here the substitution of Satanic agency where the original text of Scripture ascribes the action directly to Jahvch (cf. Exod. iv. 24); another instance in our ISook is xvii. 16."}, {"t": "p", "x": "The same tendency can be illustrated from I Chron. xxi. 1 compared with 2 Sam. xxiv. 1. 4 This explanation of the incident described in Exod. iv. 24 ff. seems to be peculiar to mir author, the real explanation being that Moses had failed to circumcise his son (so Targ. Ps.-Jon. in Ice). r' An enumeration of the ten plagues."}, {"t": "h2", "x": "Biblical Antiquities (pseudo-Philo), chapter 25"}, {"t": "p", "x": "CHAPTER XXV. XXV. And the Philistines sought to fight with p. 146 the men of Israel: 1 and they inquired of the Lord and said: Shall we go up and fight against the p. 147 [paragraph continues] Philistines? and God said to them: If ye go up with a pure heart, fight; but if your heart is defiled, go not up. And they inquired yet again saying: How shall we know if all the heart of the people be alike? and God said to them: Cast lots among your tribes, and it shall be unto every tribe that cometh under the lot, that it shall be set apart into one lot, and then shall ye know whose heart is clean and whose is defiled. 2. And the people said: Let us first appoint over us a prince, and so cast lots. And the angel of the Lord said to them: Appoint. And the people said:"}, {"t": "p", "x": "Whom shall we appoint that is worthy, Lord? And the angel of the Lord said to them: Cast the lot upon the tribe of Caleb, and he that is shown by the lot, even he shall p. 148 be your prince. And they cast the lot for the tribe of Caleb and it came out upon Cenez, and they made him ruler over Israel. 3. And Cenez said to the people: Bring your tribes unto me and hear ye the word of the Lord. And the people gathered together and Cenez said to them: Ye know that which Moses the friend of the Lord charged you, that ye should not transgress the law to the right hand or to the left. And Jesus also who was after him gave you the same charge. And now, lo, we have heard of the mouth of the Lord that your heart is defiled."}, {"t": "p", "x": "And the Lord hath charged us to cast lots among your tribes to know whose heart hath departed from the Lord our God. Shall not the fury of anger come upon the people? But I promise you this day that even if a man of mine own house come out in the lot of sin, he shall not be saved alive, but shall be burned with fire. And the people said: Thou hast spoken a good counsel, to perform it. 4. And the tribes were brought before him, and there were found of the tribe of Juda 345 men, and of the tribe of Ruben 560, and of the tribe of Simeon 775, and of the tribe of Levi 150, and of the tribe of Zabulon 655 (or 645), and of the tribe of Isachar 665, and of the tribe of Gad 380."}, {"t": "p", "x": "Of the tribe of Aser 665, and of the tribe of Manasse 480, and of the tribe of Effraim 468, and of the tribe of Benjamin 267. And all the number of them that were found by the lot of sin was 6110. And Cenez took them all and shut them up in prison, till it should be known what should be done with them. 1 p. 149 5. And Cenez said: Was it not of this that Moses the friend of the Lord spake saying: There is a Dt. 29:18 strong root among you bringing forth gall and bitterness? Now blessed be the Lord who hath revealed all the devices of these men, neither hath he suffered them to corrupt his people by their evil works. Bring hither therefore the Demonstration and the Truth and call forth Eleazar the priest, and let us inquire of the Lord by him. 6."}, {"t": "p", "x": "Then Cenez and Eleazar and all the elders and the whole synagogue prayed with one accord saying: Lord God of our fathers, reveal unto thy servants the truth, for we are found not believing in the wonders which thou didst for our fathers since thou broughtest them out of the land of Egypt unto this day. And the Lord answered and said: First ask them that were found, and let them confess their deeds which they did subtilly, and afterwards they shall be burned with fire. 7. And Cenez brought them forth and said to them: Behold now ye know how that Achiar confessed when the lot fell on him, and declared all that he had done."}, {"t": "p", "x": "And now declare unto me all your wickedness and your inventions: who knoweth, if ye tell us the truth, even though ye die now, yet God will have mercy upon you when he shall quicken the dead? 8. And one of them named Elas said unto him: Shall not death come now upon us, that we shall die by fire? Nevertheless I tell thee, my Lord, there are none inventions like unto these which we have made wickedly. But if thou wilt search out the truth plainly, ask severally the men of every tribe, and so shall some one of them that stand by perceive the difference of their sins. 9. And Cenez asked them of his own tribe and they told him: We desired to imitate and make the calf that they made in the wilderness. And after that he asked the men p. 150 of the tribe of Ruben, which said:"}, {"t": "p", "x": "We desired to sacrifice unto the gods of them that dwell in the land. And he asked the men of the tribe of Levi, which said: We would prove the tabernacle, whether it were holy. And he asked the remnant of the tribe of Isachar, which said: We would inquire by the evil spirits of the idols, to see whether they revealed plainly: and he asked the men of the tribe of Zabulon, which said: We desired to eat the flesh of our children and to learn whether God hath care for them. And he asked the remnant of the tribe of Dan, which said: The Amorites taught us that which they did, that we might teach our children. And lo, they are hid under the tent of Elas, 1 who told thee to inquire of us. Send therefore and thou shall find them. And Cenez sent and found them. 10."}, {"t": "p", "x": "2 And thereafter asked he them that were left over of the tribe of Gad, and they said: We committed adultery with each other's wives. And he asked next the men of the tribe of Aser, which said: We found seven golden images which the Amorites called the holy Nymphs, and we took them with the precious stones that were set upon them, and hid them: and lo, now p. 151 they are laid up under the top of the mount Sychem. 1 Send therefore and thou shalt find them. And Cenez sent men and removed them thence. 11. Now these are the Nymphs which when they were called upon did show unto the Amorites their works in every hour. For these are they which were devised by seven evil men after the flood, whose names are these: <? Cham> Chanaan, Phuth, Selath, Nembroth, Elath, Desuath."}, {"t": "p", "x": "Neither shall there be again any like similitude in the world graven by the hand of the artificer and adorned with variety of painting, but they were set up and fixed for the consecration (i.e. the holy place?) of idols. Now the stones were precious, brought from the land of Euilath, among which was a crystal and a prase (or one crystalline and one green), and they shewed their fashion, being carved after the manner of a stone pierced with open-work, 2 and another of them was graven on the top, and another as it were marked with spots (or like a spotted chrysoprase) 3 so shone with its graving as if it shewed the water of the deep lying beneath. 12. And these are the precious stones which the Amorites had in their holy places, and the price p. 152 of them was above reckoning."}, {"t": "p", "x": "For when any entered in by night, he needed not the light of a lantern, so much did the natural light of the stones shine forth. Wherein that one gave the greatest light which was cut after the form of a stone pierced with open-work, and was cleansed with bristles; 1 for if any of the Amorites were blind, he went and put his eyes thereupon and recovered his sight. Now when Cenez found them, he set them apart and laid them up till he should know what should become of them. 13. And after that he asked them that were left of the tribe of Manasse, and they said: We did only defile the Lord's sabbaths. And he asked the forsaken of the tribe of Effraim, which said: We desired to pass our sons and our daughters through the fire, that we might know if that which was said were manifest."}, {"t": "p", "x": "And he asked the forsaken of the tribe of Benjamin, which said: We desired at this time to examine the book of the law, whether God had plainly written that which was therein, or whether Moses had taught it of himself. Footnotes 146:1 XXV. Up to this point Philo has followed the Bible story faithfully enough. He now draws freely on his own imagination, and presents us with an entirely new history of the beginning of the period of the Judges. Kenaz is the first judge. He and Seenamias, as we read in XX. 6, were the sons of Caleb, and were the two spies sent by Joshua to Jericho (who in the Bible are nameless): at Caleb's request (XX. 10) Joshua gave Kenaz the territory of the three towers (or the tribe of the towers). The context in which this is told is copied from Josh. 14:6 (Cf."}, {"t": "p", "x": "15:16 sqq.). In that place, and in Num. 32:12, Caleb is called the Kenezite. In Josh. 15, Othniel, son of Kenaz, the (younger) brother of Caleb (but another view makes Othniel brother of Caleb), takes Kirjath-sepher and marries Caleb's daughter. This is repeated in Judges 1:13. In Judges 3:10, 3:11 Othniel figures as the first of the judges proper: but all that is said of him is that the Spirit of the Lord came upon him, and he judged Israel and conquered Chushan-rishathaim. Thus in the Bible Kenaz is a mere name: he is a younger brother (or other relative) of Caleb, and father of Othniel the first judge: and his is an ancestral or clan-name in the family of Caleb."}, {"t": "p", "x": "In Philo he completely ousts Othniel, and there is no pretence of assimilating his story to that of any one who appears in the Bible. He figures as a divinely appointed ruler, a detecter of crime, a mediator, it may be said, between God and Israel, and the recipient of God's own instructions: then as a mighty man of valour, and lastly as a seer. In respect of the amount of space devoted to him be is second only to Moses."}, {"t": "p", "x": "It may be merely the author's desire to strike out a new line, or perhaps to import a fresh religious interest into the history of the Judges (though this he could do in other ways, and much of the story of Kenaz has no religious value) that has prompted this sudden burst of inventiveness; or there may have been another motive at work and a hidden meaning in the tale, which I cannot penetrate. I do not find any hint in other writings that tradition clustered round the name of Kenaz: but it is noticeable that the best text of Josephus (Ant. V. 33) substitutes his name (Κενιαζοσ) for that of Othniel: and that in the Pseudo-Epiphanian Lives of the Prophets it is said that Jonah was buried \"in the cave of Kainezias, who was judge of one tribe in the days of the anarchy,\" a sentence p."}, {"t": "p", "x": "147 which neither suggests a knowledge of Philo nor explains itself. All that it, and the passage of Josephus, do suggest is that Philo may be following a current fashion in discarding the name of Othniel, and that he has taken as his text the words in judges: \"the Spirit of the Lord came upon\" Othniel, and has written a variation upon that theme. The next judge is Zebul. The name is taken, no doubt, from the story of Abimelech in judges 9:28, etc. Otherwise he is a completely imaginary figure. From him we pass to Deborah; she is followed by Aod (= Ehud), who is here not a judge, but a Midianitish wizard. As in the case of Zebul, Philo has borrowed a Biblical name from another part of Judges, and affixed it to a totally different personality."}, {"t": "p", "x": "The remainder of his judges follow the Biblical order fairly well: Gideon, Abimelech (Tola may have disappeared in a lacuna), Jair (whose character is gratuitously blackened), Jephtha (Ibzan is then omitted), Addo (= Abdon), Elon (these two being transposed from the Biblical order), Samson. Then follow, as in the Bible, the stories of Micah's idolatry (the migration of the Danites being wholly passed over) and of the Benjamite outrage, which is located at Nob, the priestly city, instead of Gibeah. Thus the narrative in Judges is represented with approximate faithfulness, save in the case of the first judges, where Philo substitutes Kenaz and Zebul for Othniel, Ehud, and Shamgar. 148:1 XXV. 4."}, {"t": "p", "x": "In the enumeration of the sinners among the tribes Dan has accidentally dropped out, though it appears in 9. The separate numbers in the text add up to 5410 or 5400, so that 700 or 710 is the number to be assigned to Dan in order to make up the total of 6110. 150:1 9. under the tent of Elas, who told thee to inquire of us. R. has: under the mount of Abraham, and laid up under a mound of earth. J has: under the mount of Abarim. 150:2 10 seq. The Amorites are described in Jubilees 29:11 as being particularly wicked. A special section in the Talmud treating of superstitious practices is called \"the ways of the Amorites\" (see Jewish Encycl., s.v. Amorites). The idols are too vaguely described to enable us to form an idea of them:"}, {"t": "p", "x": "Philo does not seem to have had any special heathen deities in mind. Of the seven sinners who made them we recognize the names of Canaan, Phuth, Nimrod, Elath, who are mentioned in IV. 6, 7, as descendants of Ham. The land of Euilat (Havilah) is described in Gen. 2:11, 2:12 as the home of gold, bdellium, and onyx. 151:1 10. the mount Sychem: possibly a malicious allusion to the Samaritans. 151:2 11. stone pierced with open-work: uelut in diatrium sculpti. Here, and a few lines below, where we have in modum diatridis or diatriti sculptus, I think diatretos must be restored. The word is used by Martial and in the Digest. 151:3 as it were marked with spots. The variants are caraxatus stigminis and chrysoprassus stigmatus. I prefer the first, because it seems clearly right in XXVI. 10."}, {"t": "p", "x": "There we have: \"The 6th stone was as if it had been a chrysoprase chrysoprassus (or marked (in) caraxatus) . . . and was like a jasper,\" and there the chrysoprase is plainly superfluous. Caraxatus is also the harder word. 152:1 12. \"was cleansed with bristles\": de setis emundabatur (-bitur VR). This looks as if it must be wrong, but I find in Damigeron, de labidibus, 47 (ap. Pitra, Spicil. Solesm III. 335), that the chrysolite \"pertusus et transiectus cum setis † aseminis † (? asininis\") and worn on the left arm, puts demons to flight. This suggests that, though emundabatur is not very clear, de setis is probably correct. I may remark in passing that the old Latin version of Epiphanius, de XII. lapidibus (ed. Dindorf, Opp. IV. 1), has phrases recalling our text, e.g. p."}, {"t": "p", "x": "193: flauum ostentat colorem; p. 198: hyacinthus tranquilli maris similtudinem refert."}, {"t": "h2", "x": "Related notes"}, {"t": "p", "x": "Related: [[24 Watchers Enoch and the Seventy Princes]]"}]}, "master-study-guide": {"title": "Master Study Guide (Q&A Companion)", "section": "Appendices", "sub": "Condensed question-and-answer version", "body": [{"t": "h2", "x": "Does the Genesis birth order match the order in which Matthew lists the Apostles?"}, {"t": "p", "x": "Yes, it does! However, it matches the official roster order given in Matthew 10:2-4, rather than the chronological narrative of who walked up to Jesus first. When Matthew officially lists the 12, he perfectly mirrors the Genesis birth order to establish the matrix of the “8 Royal/Priestly Insiders” (sons of the wives) and the “4 Galilean Outsiders” (sons of the handmaids)."}, {"t": "h2", "x": "The Matthew 10 Roster (How the List is Structured)"}, {"t": "p", "x": "When the author of the Gospel of Matthew officially wrote down the 12 names in Chapter 10, he wasn’t trying to match them 1-to-1 by character to the Genesis birth order. (If he was, he would have put his own name at #3!). Instead, Matthew was mirroring the Mathematical Blueprint of Genesis 29-30 (The 8 Insiders and 4 Outsiders)."}, {"t": "li", "x": "The Genesis Blueprint: In Genesis, the first 4 sons are from a Free Wife. The shift happens at the 5th and 6th sons (Dan and Naphtali), who are born to a Servant Handmaid."}, {"t": "li", "x": "The Matthew Roster: Matthew lists the first block of 4 disciples (the core Galilean fishing partners: Peter, Andrew, James, and John). Then, he triggers the exact same shift at the 5th and 6th slots, inserting Philip and Bartholomew (the Greek Liaison and the True Israelite)."}, {"t": "table", "x": "The 12 Matrix: Genesis Birth Order vs. Matthew 10 Roster Order (digest)", "head": ["#", "Genesis Patriarch (Birth Order & Mother)", "Status", "Matthew 10 Roster Order"], "rows": [["1", "Reuben (Leah)", "Insider", "Simon Peter (Outsider)"], ["2", "Simeon (Leah)", "Insider", "Andrew (Outsider)"], ["3", "Levi (Leah)", "Insider", "James son of Zebedee (Insider)"], ["4", "Judah (Leah)", "Insider", "John son of Zebedee (Insider)"], ["5", "Dan (Bilhah - Handmaid)", "Outsider", "Philip (Outsider)"], ["6", "Naphtali (Bilhah - Handmaid)", "Outsider", "Bartholomew / Nathanael (Outsider)"], ["7", "Gad (Zilpah - Handmaid)", "Outsider", "Thomas (Insider)"], ["8", "Asher (Zilpah - Handmaid)", "Outsider", "Matthew / Levi (Insider)"], ["9", "Issachar (Leah)", "Insider", "James of Alphaeus (Insider)"], ["10", "Zebulun (Leah)", "Insider", "Thaddaeus / Jude (Insider)"], ["11", "Joseph (Rachel)", "Insider", "Simon the Zealot (Insider)"], ["12", "Benjamin (Rachel)", "Insider", "Judas Iscariot (Insider)"]]}, {"t": "h2", "x": "The Typological Mirror (Who They Are)"}, {"t": "p", "x": "This is the character, family, and prophetic match. Jesus didn’t call the disciples in the exact birth order of the ancient patriarchs. Instead, He called individuals whose lives, flaws, and actions mirrored the ancient prophecies of Genesis 49 and Deuteronomy 33. In this spiritual mirror, Matthew = Levi, Peter = Reuben, Andrew = Simeon, and Judas = Dan."}, {"t": "table", "x": "Typological Prophetic Mirror (digest)", "head": ["The Apostle (1st & 2nd Gen)", "The Tribal Mirror", "The Theological and Prophetic Connection"], "rows": [["Simon Peter (1st Gen Core)", "Reuben (The Firstborn)", "The Flawed Firstborn: Reuben was the firstborn of Jacob, and Peter was the first-called, prominent leader of the disciples. Both were impulsive, passionate, and deeply flawed. Reuben lost his ultimate birthright due to instability (Genesis 49:4), just as Peter denied Christ and eventually saw the administrative leadership of the church shift to James."], ["Andrew (1st Gen Core)", "Simeon (The Second Brother)", "The Brother in the Shadow: Simeon was the second-born son, forever intertwined with his older brother Reuben. Andrew is Peter’s brother. Just as Simeon often stood in the background of Reuben’s prominent (and flawed) leadership, Andrew was the very first disciple called, but he humbly took a backseat to Peter’s loud, upfront leadership."], ["James & John (Sons of Zebedee)", "Zebulun & Issachar (The Sea and the Tent)", "The Galilean Fishermen: In Genesis 49:13, Zebulun is prophesied to be a “haven for ships.” Issachar is told to rejoice in his tents. James and John were wealthy fishermen from the Sea of Galilee, called directly out of their boats. They represent the coastal, working-class tribes that Jesus used to shame the religious elite in Jerusalem."], ["Simon the Zealot (1st Gen Core)", "Simeon (The Violent Zeal)", "The Militant Zealot: Simon’s name is literally the Greek variation of Simeon. In Genesis 34, Simeon and Levi use their swords in a violent, zealous rage to slaughter the Shechemites. Simon the Zealot belonged to a violent, militaristic political faction dedicated to overthrowing Rome with the sword before Jesus redirected his zeal toward the Kingdom."], ["Bartholomew / Nathanael (1st Gen Core)", "Asher (The Royal Dainties)", "The Pure Israelite: Asher’s prophecy in Genesis 49:20 says his “food shall be rich, and he shall yield royal dainties.” When Jesus first sees Nathanael, he is sitting peacefully under a fig tree (a symbol of rich, millennial peace and provision) and Jesus declares him “an Israelite in whom there is no deceit” (John 1:47)."], ["Thomas (1st Gen Core)", "Naphtali (The Wrestler)", "The Skeptic Who Wrestles: The name Naphtali means “my wrestling.” Thomas is famous for wrestling with his faith, refusing to believe the resurrection until he could physically touch the wounds of Christ. Just as Naphtali eventually brought “beautiful words” (Gen 49:21), Thomas’s wrestling produced the most beautiful, definitive declaration of Christ’s divinity in the Gospels: “My Lord and my God!” (John 20:28)."], ["Philip (1st Gen Core)", "Gad (The Troop / Provider)", "The Calculator: Gad’s name means “good fortune” or “troop.” Philip is the highly practical, calculating Apostle. When faced with a massive troop of 5,000 hungry people, it is Philip who immediately does the math on how much bread it would take to feed them (John 6:7)."], ["Matthew / Levi (1st Gen Core)", "Levi (The Priesthood)", "The Covenant Access: The tribe of Levi was pulled out of the standard inheritance to manage the temple and the law. Matthew (also called Levi) was pulled out of the corrupt tax-collection system by Jesus to record the definitive, deeply Jewish Gospel that explains how Jesus fulfills the Levitical law."], ["Thaddaeus / Jude (1st Gen Core)", "Joseph (The Preserver)", "The Preserver of the Remnant: Joseph was sold out by his brothers but remained faithful to preserve a remnant of his family in a dark world. Thaddaeus (also known as Jude) wrote the Epistle of Jude, which is entirely dedicated to urging the church to “contend for the faith” and preserve themselves against false teachers creeping into the camp."], ["Judas Iscariot (The Betrayer)", "Dan (The Serpent)", "The Betrayal and Omission: In Genesis 49:17, Jacob prophesies that Dan will be a “serpent in the way” that bites the horse’s heels so its rider falls backward. Dan was the tribe that introduced institutional idolatry to Israel. In Revelation 7, Dan is entirely omitted from the list of the 144,000, exactly as Judas is permanently stripped of his apostolic seat for his serpentine betrayal."], ["Matthias (The Replacement)", "Ephraim / Manasseh (The Adoptions)", "The Mathematical Replacements: Just as Jacob had to elevate Joseph’s sons to full tribal status to keep the administrative number at 12 after Levi was pulled out, the Apostles had to cast lots to elevate Matthias to keep the foundational number at 12 before the Holy Spirit arrived at Pentecost."], ["James the Just (2nd Gen Hub)", "Judah (The Royal Scepter)", "The Administrative Core: Just as the leadership and scepter eventually bypassed Reuben and landed on Judah (the administrative and royal tribe in Jerusalem), the earthly leadership of the early church shifted from Peter to James (the brother of Jesus), who ruled the Jerusalem Council (Acts 15)."], ["The Apostle Paul (The 13th / 2nd Gen)", "Benjamin (The Ravenous Wolf)", "The Hunter Turned Conqueror: Paul explicitly states he is from the tribe of Benjamin (Philippians 3:5). In Genesis 49:27, Benjamin is prophesied to be a “ravenous wolf, in the morning devouring the prey and at evening dividing the spoil.” This perfectly mirrors Paul: in the “morning” of his life, he was a Pharisee hunting and devouring the early church; in the “evening” of his life, he was an Apostle dividing the spiritual spoils of the gospel among the Gentiles."], ["Stephen & The Hellenists (2nd Gen Martyrs)", "The Scattered Northern Tribes (The Dispersion)", "The Global Seed: After the ancient kingdom split, the Northern Tribes were conquered by Assyria and scattered into the Gentile nations. In the New Testament, Stephen (a Greek-speaking, 2nd generation Jewish Christian) is martyred. His death causes the church to scatter out of Jerusalem, acting as the seed that finally pushes the Gospel out into the Gentile world (Acts 8:1-4)."], ["Luke, Timothy, Silas (2nd Gen Network)", "The Mixed Multitude (Exodus 12:38)", "The Gentile Incorporation: When Israel left Egypt, a “mixed multitude” of non-Israelites went with them and were grafted into the covenant. The 2nd generation of the church (led by Paul’s network) were half-Jews and Gentiles (like Timothy and Luke) who fully grafted the Greco-Roman world into the New Israel."]]}, {"t": "h2", "x": "The Forensic Proof in the List"}, {"t": "li", "x": "The Shift at Number 5: In Genesis, the very first two “Outsider” sons born to a handmaid are Dan (#5) and Naphtali (#6). In Matthew’s list, the #5 and #6 slots are given to Philip and Bartholomew—two of the Galilean “Outsiders” who are not part of the core royal/priestly bloodline. Matthew intentionally mirrored the Genesis shift from “Wives” to “Servants” right at the 5th position!"}, {"t": "li", "x": "The Benjamin/Judas Match: Benjamin is the 12th and final son born to Jacob. Judas Iscariot is listed as the 12th and final Apostle in Matthew’s roster."}, {"t": "li", "x": "The Blueprint: Matthew engineered this list to show his Jewish readers that Jesus was officially rebuilding the 12 Tribes of Israel using the exact same structural matrix of 12!"}, {"t": "h2", "x": "ANDREW"}, {"t": "li", "x": "Asher / Andrew"}, {"t": "li", "x": "The Blessing (Deut 33:24): “Most blessed of sons be Asher; let him be the favorite of his brothers, and let him dip his foot in oil.”", "sub": true}, {"t": "li", "x": "The Apostolic Overlay: Andrew is the favorite brother who actively goes and fetches his brother Peter. The oil represents rich provision, perfectly matching Andrew finding the boy with the loaves and fish to provide the miraculous meal.", "sub": true}]}, "matthew-vs-levi": {"title": "Matthew vs. Levi: The Identity Debate", "section": "Appendices", "sub": "The strongest case for each side", "body": [{"t": "p", "x": "A comparative analysis of the traditional identification of Matthew as Levi, the prophetic function of New Testament names, and the strongest textual counter-arguments."}, {"t": "h2", "x": "Introduction"}, {"t": "p", "x": "One of the most enduring debates in New Testament studies and biblical typology is the identity of the tax collector called by Jesus in Capernaum. In Matthew 9:9, he is introduced as Matthew. In Mark 2:14 and Luke 5:27, the exact same scene names him Levi, son of Alphaeus. Is “Matthew” a redeemed functional nickname for “Levi,” or were Matthew and Levi originally two distinct individuals whose stories merged in early Christian tradition?"}, {"t": "h2", "x": "Part 1: The Case That Matthew IS Levi (The Prophetic & Typological Framework)"}, {"t": "h3", "x": "1. The Prophetic Naming Convention (The “Bar-Jonah” Principle)"}, {"t": "p", "x": "In 1st-century Jewish culture and Gospel theology, names frequently functioned as prophetic, theological, and functional signifiers rather than mere biological identifiers:"}, {"t": "li", "x": "Simon Bar-Jonah: In John 1:42 and John 21:15–17, Peter’s father is named John (Yochanan). Yet in Matthew 16:17, after Peter confesses Christ, Jesus specifically proclaims: “Blessed are you, Simon Bar-Jonah, for flesh and blood has not revealed this to you, but My Father in heaven.” In Hebrew, Yonah means Dove—the universal emblem of the Holy Spirit (Matthew 3:16) and new creation (Genesis 8). Calling him Bar-Jonah (“Son of the Dove / Son of the Sign”) directly tied his identity to divine spiritual revelation."}, {"t": "li", "x": "Levi at the Tax Booth: Under Torah (Numbers 18, Deuteronomy 14, 33), the tribe of Levi was consecrated to collect holy tithes for the Tabernacle and teach the Law. A Jew named “Levi” sitting at a Roman toll booth (telōnion) was the tragic mirror: using a ledger to extract imperial tribute for a pagan empire (Caesar’s coin) rather than gathering offerings for God. In the Gospel narrative, “Levi” marks the man in his compromised, worldly post."}, {"t": "li", "x": "Matthew in the Kingdom: Mattityahu means “Gift of God.” When Jesus calls him out of the booth, his worldly identity is stripped away. The First Gospel uses “Matthew” right at the booth (Matthew 9:9) to declare his redemptive identity from the outset. Jesus pulls him from the tax booth to fulfill Moses’ ancient blessing on Levi in Deuteronomy 33:10: “They shall teach Jacob your ordinances, and Israel your law.” He leaves the Roman tax ledger to write the ultimate Jewish Gospel of Torah fulfillment."}, {"t": "h3", "x": "2. Absolute Narrative Identicality"}, {"t": "p", "x": "The calling accounts in Matthew 9:9–13, Mark 2:14–17, and Luke 5:27–32 are narratively inseparable:"}, {"t": "li", "x": "Jesus walks past the tax booth in Capernaum."}, {"t": "li", "x": "He sees a tax collector sitting at his post."}, {"t": "li", "x": "He speaks the exact same two-word command: “Follow me” (Ἀκολούθει μοι)."}, {"t": "li", "x": "The tax collector immediately leaves everything, rises, and follows Him."}, {"t": "li", "x": "He immediately hosts a massive feast at his house with fellow tax collectors and sinners."}, {"t": "li", "x": "The Pharisees raise the exact same complaint: “Why does your teacher eat with tax collectors and sinners?”"}, {"t": "p", "x": "Jesus gives the exact same theological response: “Those who are well have no need of a physician, but those who are sick... I came not to call the righteous, but sinners to repentance.”"}, {"t": "p", "x": "From a literary standpoint, it is virtually impossible for these to represent two independent historical events occurring in the same small fishing village with the exact same dialogue, feast, and Pharisaic confrontation."}, {"t": "h3", "x": "3. The Family Network (The Alphaeus Branch)"}, {"t": "p", "x": "Mark 2:14 identifies Levi as the “son of Alphaeus.” In the apostolic rosters (Matthew 10:3, Mark 3:18, Luke 6:15, Acts 1:13), James the Less is explicitly designated as the “son of Alphaeus.” Identifying Matthew as Levi firmly situates him within the core apostolic family network (the “Alphaeus Branch / Logia Guard”), brother to James the Less and Thomas (the Twin), explaining his immediate inclusion and intimacy with the Jesus movement."}, {"t": "h2", "x": "Part 2: The Deeper Scriptural Case Against Them Being the Same Person"}, {"t": "h3", "x": "1. The Roster Omission in Mark and Luke"}, {"t": "p", "x": "The primary textual argument against equating Matthew with Levi is the striking omission in the apostolic lists:"}, {"t": "li", "x": "In Mark 3:16–19, Luke 6:14–16, and Acts 1:13, the official rosters of the Twelve are presented. Matthew is listed in every single one; Levi is completely absent."}, {"t": "li", "x": "Why would Mark and Luke introduce Levi with dramatic narrative fanfare in the second and fifth chapters, highlighting his radical abandonment of wealth, only to drop him completely from the official list of the Twelve?"}, {"t": "p", "x": "Unlike Simon Peter (where Mark explicitly clarifies: “Simon, whom he surnamed Peter” in Mark 3:16) and James and John (“whom he surnamed Boanerges” in Mark 3:17), neither Mark nor Luke ever offers an explanatory gloss like “Levi, who is called Matthew.” The complete silence of Mark and Luke regarding any name change suggests they did not identify the two men as one."}, {"t": "h3", "x": "2. The Disciple vs. Apostle Distinction (The Wealthy Patron)"}, {"t": "p", "x": "Jesus had multiple concentric circles of followers outside the Twelve (e.g., the Seventy in Luke 10, Cleopas, Joseph of Arimathea, Nicodemus, and Zacchaeus):"}, {"t": "li", "x": "Luke 5:29 emphasizes that “Levi made him a great feast in his own house.” Levi was likely a chief tax contractor—a wealthy, influential figure in Capernaum who became a key patron and disciple of the movement."}, {"t": "li", "x": "In this reading, Levi was a faithful disciple who funded and supported Jesus (much like Zacchaeus in Luke 19), while Matthew was a distinct individual chosen for the core Twelve."}, {"t": "li", "x": "Early Patristic Evidence:"}, {"t": "li", "x": "Heracleon (c. 175 CE), quoted by Clement of Alexandria (Stromata 4.9.71), explicitly lists disciples who confessed Christ without martyrdom: “Matthew, Philip, Thomas, Levi, and many others.” Heracleon clearly considered Matthew and Levi to be two separate people.", "sub": true}, {"t": "li", "x": "Origen (c. 185–253 CE) in Contra Celsum 1.62 writes: “Levi the tax collector did indeed become a follower of Jesus, but he was not at all of the number of his chosen apostles, except according to some copies of Mark’s Gospel.” Origen confirms that in early scholarship, Levi was recognized as a disciple outside the Twelve.", "sub": true}, {"t": "h3", "x": "3. Matthew 9:9 as an Intentional Apostolic Substitution"}, {"t": "p", "x": "Under the widely accepted framework of Markan Priority (where Matthew utilized Mark as a narrative framework):"}, {"t": "li", "x": "The First Gospel follows Mark 2:14 almost verbatim, but deliberately replaces Mark’s “Levi son of Alphaeus” with “a man called Matthew” (Matthew 9:9)."}, {"t": "li", "x": "In Matthew 10:3, the author uniquely appends the label: “Matthew the tax collector”—a phrase found in neither Mark nor Luke."}, {"t": "li", "x": "Scholars argue that the author of the First Gospel deliberately substituted their community’s namesake apostle (Matthew) into the dramatic story of the tax collector to provide Matthew with a specific call narrative and emphasize the theology that the Gospel of the Kingdom elevates the most despised social outcasts into apostolic teachers."}, {"t": "h3", "x": "4. The Scribal Confusion in Codex Bezae (James vs. Levi)"}, {"t": "p", "x": "In ancient Western manuscripts such as Codex Bezae (D) and early Old Latin witnesses, Mark 2:14 actually reads: “He saw James the son of Alphaeus sitting at the tax office.” Early Christian copyists were so perplexed by the absence of “Levi son of Alphaeus” in Mark’s apostolic roster that they tried to harmonize the text with “James son of Alphaeus”—proving that the equation of Levi with Matthew was not an unquestioned, universal assumption in the early manuscript tradition."}, {"t": "h2", "x": "Conclusion & Synthesis"}, {"t": "table", "head": ["Perspective", "Core Proposition", "Key Scriptural Clues"], "rows": [["Matthew IS Levi (Typological / Harmonic)", "Levi is the pre-calling, compromised identity; Matthew (“Gift of God”) is the redeemed apostolic commission.", "Identical narrative details in Capernaum; prophetic renaming conventions (like Simon Bar-Jonah); fulfillment of Deuteronomy 33:10 (Levite teacher of the Law)."], ["Matthew & Levi are DISTINCT (Historical-Critical)", "Levi was a wealthy Capernaum disciple/patron; Matthew was an apostle substituted into the narrative by the First Gospel.", "Levi’s complete omission from the apostolic lists of Mark, Luke, and Acts; early patristic writings of Origen and Heracleon; absence of any explicit renaming formula."]], "x": "Conclusion & Synthesis: the two readings side by side"}]}, "sources": {"title": "Sources & Provenance", "section": "Appendices", "sub": null, "body": [{"t": "p", "x": "Every word on this site is converted verbatim from three PDFs in the Drive folder Caroline’s Bible Notes: ‘12 Apostles and the 12 Tribes’ (77 pp, master document), ‘12 Apostles and the 12 Tribes - Master Study Guide’ (11 pp), and ‘Matthew vs Levi - Apostolic Identity and Textual Analysis’ (4 pp). List glyphs and line wraps were normalized for the web; no wording was altered."}, {"t": "p", "x": "Companion Obsidian vault: Documents\\Caroline Bible Notes (22 notes; source PDFs in attachments\\)."}, {"t": "h2", "x": "Master Study Companion: closing Q&A (verbatim from the full study PDF)"}, {"t": "h3", "x": "Who were “The Seven” (Philip’s Group)?"}, {"t": "p", "x": "In Acts 21:8, Luke notes that Philip the Evangelist was “one of the seven.”"}, {"t": "li", "x": "The Origin (Acts 6): Early on in Jerusalem, the Greek-speaking Jewish widows (Hellenists) were being neglected in the daily food distribution. The original 12 Apostles said they couldn’t stop preaching to manage the food lines. So, they ordained Seven Men to act as the primary administrators and almoners of the church (the first “Deacons”)."}, {"t": "li", "x": "The Roster: 1. Stephen (the first martyr) 2. Philip (the evangelist/father of the daughters) 3 Prochorus 4 Nicanor 5 Timon 6 Parmenas 7 Nicolas (a Gentile convert from Antioch)."}, {"t": "li", "x": "The Distinction: This Philip is Philip the Evangelist (a 2nd Gen Hellenist leader), not Philip the Apostle (one of the original 12 Galileans). Note: Later church fathers like Papias actually got these two Philips confused, which is why tracing the exact bloodlines like you are doing is so important!"}, {"t": "h3", "x": "3. Who is Agabus the Prophet?"}, {"t": "li", "x": "His Profile: Agabus is one of the most fascinating characters in Acts. He is part of the organic, charismatic prophetic movement (Bucket 1). He operates exactly like an ancient Old Testament prophet, using “prophetic theater” to deliver his messages."}, {"t": "li", "x": "His Track Record: In Acts 11:28, he accurately prophesies a severe global famine that occurred under the Roman Emperor Claudius."}, {"t": "li", "x": "The Acts 21 Encounter: When he meets Paul, he physically takes Paul’s belt, ties his own hands and feet together, and declares through the Holy Spirit that the Jews in Jerusalem will bind the owner of the belt and hand him over to the Romans. He is a living proof that the raw, prophetic Spirit was still actively warning the network!"}, {"t": "h3", "x": "4. Who is Mnason of Cyprus?"}, {"t": "li", "x": "His Profile: In Acts 21:16, Mnason is described as an “old disciple.” In the original Greek (archaios mathetes), this doesn’t just mean he had gray hair; it means he was an “original” or “early” disciple. He was likely someone who had been following Jesus since the earthly ministry or the Day of Pentecost."}, {"t": "li", "x": "His Role (The Safe House): Like Barnabas, Mnason was a wealthy Jewish believer from the island of Cyprus who owned property in Jerusalem. Because the institutional Jewish leaders (and many strict Jewish-Christians) hated Paul, Paul couldn’t just check into an inn. Mnason provided the highly secure, trusted safe house for Paul’s network to lodge in while they navigated the dangerous politics of Jerusalem."}, {"t": "h3", "x": "5. Why Did Paul and Luke Call the Apostles “Elders”?"}, {"t": "p", "x": "You caught a massive structural shift in the biblical text! Yes, it is highly accurate that the text shifts from using the word “Apostles” to “Elders.” Here is what that tells us about the network:"}, {"t": "li", "x": "The Shift to Institution: “Apostle” (a sent-out one) was a charismatic, founding title used for the frontline ground war. But as the church grew, settled into cities, and began to build local governments, they adopted the synagogue structure of leadership: A Council of Elders (Presbyters)."}, {"t": "li", "x": "The Changing of the Guard: By Acts 15 (the Jerusalem Council), you see the phrase “the apostles and elders” used constantly. This proves the transition was happening in real-time. The original founders (Apostles) were sharing power with the local, administrative bishops and managers (Elders) led by James the Just."}, {"t": "li", "x": "Peter’s Submission: The ultimate proof of this is 1 Peter 5:1. Peter, the fiery, first-called Apostle, writes to the network and says, “So I exhort the elders among you, as a fellow elder...” He drops the towering title of Apostle and humbly aligns himself with the localized Presbyters!"}]}}, "meta": [{"id": "the-genesis-matrix", "t": "The Genesis Matrix: Birth Order as Blueprint", "sec": "Foundations", "sub": "Structural foundations of the whole system", "w": 1760, "rel": ["network-timeline", "simon-peter"]}, {"id": "network-timeline", "t": "Timeline of the True Vine Network", "sec": "Foundations", "sub": "Two generations, AD 30-107", "w": 703, "rel": ["acts-timeline", "the-genesis-matrix", "simon-peter"]}, {"id": "simon-peter", "t": "Simon Peter", "sec": "The Twelve", "sub": "1st Gen Core", "w": 1139, "rel": ["the-genesis-matrix", "sg14", "network-timeline", "andrew"]}, {"id": "andrew", "t": "Andrew", "sec": "The Twelve", "sub": "1st Gen Core", "w": 1085, "rel": ["simon-peter", "john-mark-lazarus", "james-the-great"]}, {"id": "james-the-great", "t": "James the Great", "sec": "The Twelve", "sub": "1st Gen Core", "w": 1358, "rel": ["john-the-apostle", "transfiguration-gates", "andrew"]}, {"id": "john-the-apostle", "t": "John the Apostle", "sec": "The Twelve", "sub": "1st Gen Core", "w": 2689, "rel": ["john-mark-lazarus", "james-the-great", "philip"]}, {"id": "philip", "t": "Philip", "sec": "The Twelve", "sub": "1st Gen Core", "w": 1640, "rel": ["bartholomew-nathanael", "sg28", "john-the-apostle"]}, {"id": "bartholomew-nathanael", "t": "Bartholomew / Nathanael", "sec": "The Twelve", "sub": "1st Gen Core", "w": 2707, "rel": ["philip", "the-genesis-matrix", "thomas"]}, {"id": "thomas", "t": "Thomas", "sec": "The Twelve", "sub": "1st Gen Core", "w": 335, "rel": ["simon-peter", "the-genesis-matrix", "bartholomew-nathanael", "matthew-levi"]}, {"id": "matthew-levi", "t": "Matthew / Levi", "sec": "The Twelve", "sub": "1st Gen Core", "w": 420, "rel": ["matthew-vs-levi", "the-genesis-matrix", "thomas", "james-the-less"]}, {"id": "james-the-less", "t": "James the Less", "sec": "The Twelve", "sub": "1st Gen Core / The Royal Cousin", "w": 310, "rel": ["simon-peter", "sg14", "matthew-levi", "thaddaeus-jude"]}, {"id": "thaddaeus-jude", "t": "Thaddaeus / Jude", "sec": "The Twelve", "sub": "1st Gen Core", "w": 1033, "rel": ["transfiguration-gates", "sg18", "james-the-less", "simon-the-zealot"]}, {"id": "simon-the-zealot", "t": "Simon the Zealot", "sec": "The Twelve", "sub": "1st Gen Core", "w": 544, "rel": ["judas-iscariot", "the-genesis-matrix", "thaddaeus-jude"]}, {"id": "judas-iscariot", "t": "Judas Iscariot", "sec": "The Twelve", "sub": "1st Gen Core / The Co-Partner & The Forfeited Seat", "w": 2019, "rel": ["sg13", "simon-peter", "simon-the-zealot", "second-generation"]}, {"id": "second-generation", "t": "The Second Generation", "sec": "The Second Generation", "sub": "Hub: entries 13–29", "w": 541, "rel": ["sg14", "sg18", "judas-iscariot", "sg13"]}, {"id": "sg13", "t": "Matthias", "sec": "The Second Generation", "sub": "1st Gen Replacement / The Adoptions", "w": 182, "rel": ["judas-iscariot", "second-generation", "sg14"]}, {"id": "sg14", "t": "James the Just", "sec": "The Second Generation", "sub": "2nd Gen Hub / The Administrative Scepter", "w": 144, "rel": ["james-the-less", "second-generation", "sg13", "sg15"]}, {"id": "sg15", "t": "The Apostle Paul", "sec": "The Second Generation", "sub": "The 13th Apostle / The Hunter", "w": 156, "rel": ["acts-timeline", "sg17", "sg14", "sg16"]}, {"id": "sg16", "t": "Stephen & the Hellenist Deacons", "sec": "The Second Generation", "sub": "2nd Gen Martyrs", "w": 135, "rel": ["sg27", "acts-timeline", "sg15", "sg17"]}, {"id": "sg17", "t": "Luke, Timothy, & Silas", "sec": "The Second Generation", "sub": "The 2nd Gen Network", "w": 139, "rel": ["sg15", "john-mark-lazarus", "sg16", "sg18"]}, {"id": "sg18", "t": "John Mark (Second Generation)", "sec": "The Second Generation", "sub": "2nd Gen Core / The True Beloved Disciple", "w": 469, "rel": ["john-mark-lazarus", "sg19", "sg17"]}, {"id": "sg19", "t": "The Four Daughters of Philip", "sec": "The Second Generation", "sub": "2nd Gen Core / The Prophetic Hub", "w": 611, "rel": ["sg28", "second-generation", "sg18", "sg20"]}, {"id": "sg20", "t": "Agabus", "sec": "The Second Generation", "sub": "2nd Gen Core / The Classical Prophet", "w": 472, "rel": ["acts-timeline", "sg21", "sg19"]}, {"id": "sg21", "t": "Mnason of Cyprus", "sec": "The Second Generation", "sub": "2nd Gen Core / The Archaios Anchor", "w": 459, "rel": ["sg20", "sg22"]}, {"id": "sg22", "t": "Aristarchus", "sec": "The Second Generation", "sub": "2nd Gen Core / The Captive Companion", "w": 185, "rel": ["sg15", "sg17", "sg21", "sg23"]}, {"id": "sg23", "t": "Apollos", "sec": "The Second Generation", "sub": "2nd Gen Core / The Alexandrian Orator", "w": 236, "rel": ["apollos-alias", "sg24", "sg22"]}, {"id": "sg24", "t": "Priscilla & Aquila", "sec": "The Second Generation", "sub": "2nd Gen Core / The Tentmaking Financiers", "w": 533, "rel": ["sg23", "apollos-alias", "sg25"]}, {"id": "sg25", "t": "Mary the Niece", "sec": "The Second Generation", "sub": "2nd Gen Core / The Jerusalem Archive", "w": 421, "rel": ["john-mark-lazarus", "sg14", "sg24", "sg26"]}, {"id": "sg26", "t": "The Seven", "sec": "The Second Generation", "sub": "2nd Gen Core / The Hellenist Administration", "w": 121, "rel": ["sg28", "acts-timeline", "sg25", "sg27"]}, {"id": "sg27", "t": "Stephen the Martyr", "sec": "The Second Generation", "sub": "2nd Gen Martyr / The Dispersion Spark", "w": 141, "rel": ["sg16", "acts-timeline", "sg26", "sg28"]}, {"id": "sg28", "t": "Philip the Evangelist", "sec": "The Second Generation", "sub": "2nd Gen Core / The Ethiopian Bridge", "w": 123, "rel": ["philip", "sg26", "sg27", "sg29"]}, {"id": "sg29", "t": "Nicolas & the Gentile Vanguard", "sec": "The Second Generation", "sub": "The Gentile Vanguard", "w": 99, "rel": ["sg26", "second-generation", "sg28", "apollos-alias"]}, {"id": "apollos-alias", "t": "The Apollos Alias", "sec": "Deep Dives", "sub": "The merged-identity counter-case", "w": 862, "rel": ["sg23", "sg24", "sg29", "acts-timeline"]}, {"id": "acts-timeline", "t": "The Acts Timeline", "sec": "Deep Dives", "sub": "Acts as curated political roadmap", "w": 652, "rel": ["sg15", "second-generation", "apollos-alias", "john-mark-lazarus"]}, {"id": "john-mark-lazarus", "t": "John Mark / Lazarus: The Beloved Disciple Audit", "sec": "Deep Dives", "sub": "The merged identity, full audit", "w": 1586, "rel": ["sg18", "john-the-apostle", "acts-timeline", "transfiguration-gates"]}, {"id": "transfiguration-gates", "t": "Transfiguration & the Gates of Hades", "sec": "Deep Dives", "sub": "Hermon, the Watchers, and the Sons of Thunder", "w": 54, "rel": ["james-the-great", "thaddaeus-jude", "john-mark-lazarus", "master-study-guide"]}, {"id": "master-overview", "t": "Master Matrix - Overview and Method", "sec": "Master Matrix", "sub": "The framework, method, dashboard and source register", "w": 10143, "rel": ["transfiguration-gates", "master-titles-310", "master-watchers-enoch"]}, {"id": "master-titles-310", "t": "The 310 Traditions Matrix", "sec": "Master Matrix", "sub": "The master table itself, archetype dictionary", "w": 438, "rel": ["master-overview", "master-watchers-enoch", "the-genesis-matrix"]}, {"id": "master-watchers-enoch", "t": "Watchers, Enoch and the Seventy Princes", "sec": "Master Matrix", "sub": "The 70 princes, Enoch cosmology, flood and Nephilim", "w": 10807, "rel": ["master-titles-310", "transfiguration-gates", "master-overview", "master-ancient-texts"]}, {"id": "master-calendar", "t": "Calendar and Chronology", Object.keys(SECN).forEach(sec=>{

    SECN[sec].forEach(m=>{

/* ---------- render ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function linkify(t){
  return t.replace(/\[\[([^\]]+)\]\]|\[([^\]]+)\]/g,(w,a,b)=>{
    const name=(a||b).replace(/\s+/g,' ').trim();
    let id=byTitle[name.toLowerCase()]||ALIAS[name]||ALIAS[name.replace(/^(the|The) /,'')];
    if(!id){ // try inside em-dash split names e.g. "Simon Peter"
      for(const k in byTitle){if(name.toLowerCase().includes(k)||k.includes(name.toLowerCase())){id=byTitle[k];break;}}
    }
    const label=name;
    return id?`<a href="#${id}" data-go="${id}">${esc(label)}</a>`:esc(label);
  });
}
function rich(t){ // bold label lead-ins; skip parenthesized citations (c. 185 etc)
  const m=t.match(/^([^:•\[\]]{3,48}): (.*)$/);
  const ok=m&&!/\bc\. \d/.test(m[1])&&!/^\(/.test(m[1]);
  return ok?`<b>${esc(m[1])}:</b> ${linkify(m[2])}`:linkify(esc(t));
}
function bodyHTML(p){
  const out=[];let items=null;
  const flushL=()=>{if(items&&items.length){out.push('<ul>'+items.join('')+'</ul>');}items=null;};
  for(const b of p.body){
    if(b.t==='h2'){flushL();out.push(`<h2>${linkify(esc(b.x))}</h2>`);continue;}
    if(b.t==='h3'){flushL();out.push(`<h3>${linkify(esc(b.x))}</h3>`);continue;}
    if(b.t==='table'){flushL();
      out.push(`<div class="tw" tabindex="0" role="region" aria-label="${esc(b.x)}"><table><caption>${esc(b.x)}</caption><thead><tr>${b.head.map((h)=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>`+
        b.rows.map(r=>`<tr>${r.map((c,ci)=>`<td>${b.head.length>2&&ci===0?'<b>':''}${linkify(esc(c))}${b.head.length>2&&ci===0?'</b>':''}</td>`).join('')}</tr>`).join('')+`</tbody></table></div>`);continue;}
    if(b.t==='li'){
      if(!items)items=[];
      items.push(`<li${b.sub?' class="sub"':''}>${rich(b.x)}</li>`);
    }else{
      flushL();out.push(`<p>${rich(b.x)}</p>`);
    }
  }
  flushL();return out.join('\n');
}
function relChips(ids){
  if(!ids||!ids.length)return'';
  return `<div class="rel"><p class="relh">Threads nearby</p><div class="chips">`+
    ids.map(id=>`<a href="#${id}" data-go="${id}">${esc(M[id]?M[id].t:id)}</a>`).join('')+`</div></div>`;
}
function renderHome(){
  const n=DATA.meta.length,w=DATA.meta.reduce((a,m)=>a+m.w,0),ap=12,sg=18,mm=10;
  const feat=(sec,desc,items)=>{
    return `<section><h2>${sec}</h2><div class="count">${desc}</div>`+
      `<ul>`+items.map(id=>`<li><a href="#${id}" data-go="${id}">${esc(M[id].t)}</a><span>${esc(M[id].sub||'')}</span></li>`).join('')+`</ul></section>`;};
  return `<div class="home">
   <div class="hero">
     <div class="over">A private study wiki &middot; rubricated edition</div>
     <h1>The Twelve, and the generation that carried them.</h1>
     <p class="standfirst">A structural reading of the Gospels: the apostolic roster as a mirror of the Genesis birth order, the&nbsp;<i>eight insiders and four outsiders</i>, and the second generation that inherited the network &mdash; audited name by name, verse by verse.</p>
     <div class="stats">
       <div><b>${ap}</b><span>The Twelve</span></div>
       <div><b>${sg}</b><span>2nd gen pages</span></div>
       <div><b>4</b><span>deep audits</span></div><div><b>${mm}</b><span>Master Matrix pages</span></div>
       <div><b>${w.toLocaleString('en-US')}</b><span>words</span></div>
     </div>
   </div>
   <div class="secgrid">
   ${feat('Foundations','start here',['the-genesis-matrix','network-timeline'])}
   ${feat('The Twelve','insider / outsider matrix',['simon-peter','john-the-apostle','matthew-levi','judas-iscariot','bartholomew-nathanael','philip'])}
   ${feat('The Second Generation','hub + entries 13&ndash;29',['sg14','sg15','sg18','sg19','sg23','sg24'])}
   ${feat('Deep Dives &amp; Appendices','forensic audits',['john-mark-lazarus','apollos-alias','acts-timeline','matthew-vs-levi','master-study-guide','sources'])}
   ${feat('Master Matrix','the 310-tradition framework &amp; its wings',['master-overview','master-titles-310','master-watchers-enoch','master-family-dna','master-ancient-texts','master-calendar'])}
   </div>
   <p class="colophon">Every word is Caroline&rsquo;s, converted unchanged from the source PDFs. The Master Matrix section imports her workbook of 310 traditions, DNA, calendar and text research; every sheet’s full data ships in the vault CSVs. The Master Matrix section imports her workbook of 310 traditions, DNA, calendar and text research; every sheet&rsquo;s full data ships in the vault CSVs. Use <kbd>/</kbd> to search, <kbd>&larr;</kbd>&nbsp;<kbd>&rarr;</kbd> to page between articles.</p>
  </div>`;
}
function render(id){
  if(id==='home'||!M[id]&&!P[id])return renderHome();
  const m=M[id],p=P[id];
  const i=DATA.meta.findIndex(x=>x.id===id);
  const prev=DATA.meta[i-1],next=DATA.meta[i+1];
  if(!m)return renderHome();
  const sub=m.sub?`<p class="subtitle">${esc(m.sub)}</p>`:'';
  const lead=bodyHTML(p);
  let html=`<div class="eyebrow">${esc(m.sec)}</div><h1>${esc(m.t)}</h1>${sub}<div class="meta-line">${m.w} words &middot; converted verbatim</div><hr class="rule">`;
  html+=lead;
  html+=`<div class="brandline"><div class="pn">
    ${prev?`<a href="#${prev.id}" data-go="${prev.id}">&larr; ${esc(prev.t)}</a>`:''}
    ${next?`<a href="#${next.id}" data-go="${next.id}">${esc(next.t)} &rarr;</a>`:''}
  </div><span class="meta-line">${i+1} / ${DATA.meta.length}</span></div>`;
  html+=relChips(m.rel);
  return html;
}

/* ---------- router ---------- */
const view=document.getElementById('view');
let cur=null;
function go(id,noScroll){
  if(!M[id]){id='home';}
  cur=id;
  view.innerHTML=render(id);
  view.className=id==='home'?'home':'';
  document.title=(id==='home'?'The Twelve & the Second Generation':M[id].t+' — Caroline’s Bible Notes');
  document.querySelectorAll('nav#toc a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
  if(location.hash.slice(1)!==id)history.pushState(null,'','#'+id);
  if(!noScroll)window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
  closeToc();
  const q=document.getElementById('q');if(document.activeElement===q)q.blur();
}
window.addEventListener('popstate',()=>go(location.hash.slice(1)||'home',true));
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-go]');if(!a)return;e.preventDefault();go(a.dataset.go);
});
document.querySelector('.brand').addEventListener('click',()=>go('home'));

/* mobile toc */
const tocEl=document.getElementById('toc'),scrim=document.getElementById('scrim');function closeToc(){tocEl.classList.remove('open');scrim.classList.remove('on');}
const hdr=document.querySelector('header');const setHdr=()=>document.documentElement.style.setProperty('--hdr',(hdr?hdr.getBoundingClientRect().height:73)+'px');setHdr();window.addEventListener('resize',setHdr);
document.getElementById('tocbtn').addEventListener('click',()=>{
  const open=tocEl.classList.toggle('open');scrim.classList.toggle('on');
  document.getElementById('tocbtn').setAttribute('aria-expanded',open?'true':'false');
  tocEl.setAttribute('aria-hidden',open?'false':'true');
});
scrim.addEventListener('click',closeToc);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tocEl.classList.contains('open'))closeToc();});

/* ---------- search ---------- */
const q=document.getElementById('q'),res=document.getElementById('results');
IDX=DATA.meta.map(m=>({id:m.id,lo:(m.t+' '+m.sub+' '+P[m.id].body.map(b=>b.x).join(' ')).toLowerCase()}));
let sel=-1,curRes=[];
function doSearch(){
  const s=q.value.trim().toLowerCase();
  if(s.length<2){res.classList.remove('on');return;}
  const scored=[];
  for(const e of IDX){
    const t=e.lo.indexOf(s);if(t<0)continue;
    scored.push({id:e.id,sc:(t<40?2:0)+(e.lo.startsWith(s)?3:0)+1});
  }
  scored.sort((a,b)=>b.sc-a.sc);curRes=scored.slice(0,9);sel=-1;
  q.setAttribute('aria-expanded','true');
  res.innerHTML=curRes.length?
    curRes.map((r,i)=>{const m=M[r.id];return `<div class="r" id="opt-${i}" data-i="${i}" role="option" aria-selected="false"><b>${esc(m.t)}</b><span>${esc(m.sec)}${m.sub?' · '+esc(m.sub):''}</span></div>`;}).join('')
    :`<div class="none" role="status" aria-live="polite">Nothing matches &ldquo;${esc(q.value)}&rdquo;</div>`;
  res.classList.add('on');
  res.querySelectorAll('.r').forEach(el=>el.addEventListener('mousedown',ev=>{ev.preventDefault();pick(+el.dataset.i);}));
}
q.addEventListener('input',doSearch);
function pick(i){if(!curRes[i])return;go(curRes[i].id);res.classList.remove('on');q.value='';q.setAttribute('aria-expanded','false');}
q.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();if(!curRes.length)return;
    sel=(sel+(e.key==='ArrowDown'?1:-1)+curRes.length)%curRes.length;
    res.querySelectorAll('.r').forEach((el,i)=>{el.classList.toggle('sel',i===sel);el.setAttribute('aria-selected',i===sel?'true':'false');});
    q.setAttribute('aria-activedescendant','opt-'+sel);
  }
  else if(e.key==='Escape'){res.classList.remove('on');q.setAttribute('aria-expanded','false');q.value='';q.blur();}
  else if(e.key==='Enter'){pick(Math.max(sel,0));sel=-1;curRes=[];}
});
document.addEventListener('click',e=>{if(!e.target.closest('#searchbox'))res.classList.remove('on');});

/* keys */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='/'){e.preventDefault();q.focus();q.select();}
  else if(e.key==='ArrowRight'&&e.altKey&&cur&&M[cur]){const i=DATA.meta.findIndex(m=>m.id===cur);if(DATA.meta[i+1])go(DATA.meta[i+1].id);}
  else if(e.key==='ArrowLeft'&&e.altKey&&cur&&M[cur]){const i=DATA.meta.findIndex(m=>m.id===cur);if(DATA.meta[i-1])go(DATA.meta[i-1].id);}
  else if(e.key==='Home'&&!e.ctrlKey){window.scrollTo({top:0,behavior:'smooth'});}
});
