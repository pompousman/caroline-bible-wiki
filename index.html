hesis here, connecting the Old Testament redemption laws to the New Testament passion narrative. A. The Go'el (Kinsman-Redeemer) Hebrew: גֹּאֵל (go'el) Requirements: Must be a blood relative (family/clan)."}, {"t": "p", "x": "Must be able to pay the redemption price. Must be willing to redeem. Functions: Redeem land (Lev 25:25), redeem persons (Lev 25:47-49), marry a widow to raise up a name (Ruth 4), avenge blood (Num 35:19). B. The Hetairos (Clansman / Comrade) Greek: ἑταῖρος (G2083). Root is etēs = a clansman (family member). Usage in the NT: Appears only 3 times in the NT, all in Matthew (20:13, 22:12, 26:50). Every usage is negative—rebuking a complainer, an unworthy wedding guest, and Judas. Critical Insight: When Jesus addresses Judas in Gethsemane as \"Hetairoi\" (Matthew 26:50), He is calling him a clansman, someone in the inner circle. Jesus never calls Judas Philos (true beloved friend)—that word is reserved for His faithful disciples (John 15:13-15)."}, {"t": "p", "x": "Judas was a kinsman by association (a comrade in the family of disciples) who failed to act as a true Go'el. C. The Paradidomi (Handing Over) Greek: παραδίδωμι. Crucial Fact: Paradidomi does not mean \"betray.\" It means \"to hand over, deliver, transfer.\" It is a neutral verb. Usage: The Father paradidomi the Son (Romans 8:32; Isaiah 53:6 LXX). The Son paradidomi Himself (Galatians 2:20; Ephesians 5:2, 25). Judas paradidomi Jesus to the authorities (Mark 14:10). Pilate paradidomi Jesus to be crucified (Mark 15:15). Theological Synthesis: The \"handing over\" was a divine, multi-layered transaction. Judas was the human instrument of the Divine paradidomi that set the redemption in motion. D."}, {"t": "p", "x": "The Lytron (Ransom) and the Potter's Field Greek: λύτρον (ransom price) / ἀντίλυτρον (substitute-ransom, 1 Tim 2:6). Your Breakthrough: The 30 pieces of silver returned by Judas (Matthew 27:3-10) were used to buy the Potter's Field. The Go'el Connection: The priests bought a field (redeemed land) for the burial of strangers (ξένοι / xenoi = foreigners, Gentiles). Boaz Parallel: Boaz redeemed Elimelech's land for the stranger (Ruth the Moabite) to raise up a name. Jesus Parallel: The money from the paradidomi redeemed a field for strangers (the Gentiles) to be buried—a symbolic act foreshadowing that Jesus, the ultimate Go'el, would be handed over to ransom all strangers (the entire Gentile world) and graft them into the family of God. 5."}, {"t": "p", "x": "Textual Variants in the Book of Judges (NETS, Kaige, Origen) Your notes on Judges revealed critical variant readings between the standard LXX (NETS) and the Kaige/Origen recensions:"}, {"t": "h2", "x": "Kinsman redeemer archive"}, {"t": "table", "x": "", "head": ["Name (Transliteration)", "Hebrew Spelling", "Meaning", "Modern Site", "Biblical Significance"], "rows": [["Geba / Gaba / Gabaa", "גֶּבַע", "\"Hill\"", "Jaba‘ (8-10 km NE of Jerusalem)", "Levitical city; fortified by Asa; Southern remnant of Dan's inheritance before they migrated north to Laish."], ["Gibeah", "גִּבְעָה", "\"Hill\"", "Tell el-Ful (5 km N of Jerusalem)", "Saul's hometown and first capital of Israel. Site of the horrific story in Judges 19-21."]]}, {"t": "p", "x": "Notes David, Ruth, Boaz, Saul, Benjamin, Abimelech. A Text-Critical & Theological Synthesis: From Geba to Golgotha (Tracing the Kinsman-Redeemer Thread through the NETS, KJV, and Hebrew Roots) 1. The Geography of Benjamin: Geba vs. Gibeah Your initial chain (Gaba = Gabaa = Geba = Gibeah = Benjamin = Saul's hometown = Dan's south inheritance = Modern Jaba) is etymologically true but geographically distinct. The NETS/KJV Obscurity: The Septuagint (NETS) uses the same Greek word (Γαβαα / Gabaa) for both locations. The archaeological record (fortress at Tell el-Ful vs. priestly city at Jaba') validates the Hebrew distinction that the Greek translation obscures. Context (e.g., \"Gabaa of Saul\" or \"Gabaa which belongs to Benjamin\") is the only way to distinguish them. 2."}, {"t": "p", "x": "The Bombshell in the Book of Ruth (NETS vs. KJV) Your cross-reference of Ruth 1-4 revealed two massive textual variants that completely rewire the theology of the story: A. Naomi's Husband: \"Elimelech\" vs. \"Abimelech\" KJV (Masoretic): Elimelech (אֱלִימֶלֶךְ) = \"My God is King\". A pious, covenantal name. NETS (Septuagint): Ἀβιμέλεχ (Abimelech) = \"My Father is King\". Theological Impact in NETS: By naming Naomi's husband \"Abimelech\"—the exact dynastic title used by the Philistine kings of Gerar and Gath—the Greek text frames Naomi's family as living under pagan/Philistine cultural overtones right from the start. It visually hooks the story of Ruth directly into the chaotic, Philistine-dominated era of the Judges. B. Boaz: \"Kinsman\" vs. \"Friend/Acquaintance\" KJV (Ruth 2:1):"}, {"t": "p", "x": "\"And Naomi had a kinsman of her husband's... and his name was Boaz.\" (Hebrew: מוֹדַע / moda = blood relative). NETS (Ruth 2:1): \"And Noemin had a man known to her husband [γνώριμος / gnorimos = acquaintance/friend].\" The Legal & Theological Shift: In the KJV, Boaz is a blood-relative with a legal duty (the Go'el / Kinsman-Redeemer) to marry Ruth and redeem the land. In the NETS, Boaz is merely a \"friend.\" He has zero legal obligation. When he steps up in Ruth 3-4 (after the nearer kinsman forfeits his right), Boaz is performing an act of pure, voluntary grace, not cold legal duty. The Nearer Kinsman (Ruth 4): The actual blood-relative refuses to redeem Ruth because he fears \"destroying his own inheritance\" (NETS). He selfishly chooses his own name over the dead man's name."}, {"t": "p", "x": "Boaz (the \"friend\") then steps in, pays the price, marries Ruth, and raises up a child for the dead. This perfectly matches your conclusion: Boaz is the ultimate embodiment of unearned grace. 3. The Royal Bloodline: Tamar, Rahab, Ruth, and the \"Stranger\" Theme You correctly traced the foreign DNA in the line of Judah: A. Tamar (Timnah) Location: Tamar is associated with Timnah (Thamnatha in the LXX), which is in the Shephelah near the Philistine border. This is the same region where Samson later operated. The Garment / Covering: Judah gave Tamar his signet, cord, and staff as a pledge. When she was accused of harlotry, she produced the items. This is a \"covering\" (garment) that redeems her from shame. Connection:"}, {"t": "p", "x": "The Hebrew word for garment (kethonet) and covering (kaphar) tie into the priestly garments of the garden and the covering of sin. Tamar, a Canaanite, is grafted into the line of Judah through a righteous act of faith (she was more righteous than Judah). B. Rahab (Jericho) The Scarlet Cord: Rahab hung a scarlet cord/token out her window. The Hebrew word for \"token\" is אוֹת (oth), the same word used for the covenant sign of circumcision (Genesis 17:11). The \"Garment\" of Salvation: Her house was on the wall—positioned between destruction and salvation. The scarlet cord is a covering, a sign of the blood, that saves her household. The Flint Knives of Gilgal: The circumcision at Gilgal (Joshua 5) involved flint knives, removing the \"reproach of Egypt\" (shame)."}, {"t": "p", "x": "This physical removal of flesh foreshadows the spiritual removal of shame/garment of sin. Your insight that \"circumcision = removal of shame\" is precisely the theology Paul develops in Romans 2-4. C. The Joshua vs. Salmon Puzzle (Rahab's Husband) Matthew 1:5 (Historical Genealogy): Rahab married Salmon (שַׂלְמוֹן = \"garment/covering\"), who is the father of Boaz. This makes Rahab the biological great-great-grandmother of David and Jesus. Talmudic Tradition (Megillah 14b): Rahab married Joshua. Your Conclusion (Correctly): There is no explicit historical evidence outside the Talmud that Joshua married Rahab. The early Church Fathers knew the tradition but did not affirm it as historical."}, {"t": "p", "x": "The New Testament genealogies (Matthew 1) are the definitive historical witness for the lineage of Christ. However, your theological instinct is spot on: Typologically, Joshua (Yehoshua / Ἰησοῦς) is a perfect \"type\" of Jesus. Just as the first Joshua saved Rahab (a Gentile) from destruction, the second Joshua (Jesus) saves all Gentiles (strangers) from judgment. The Talmud likely spiritualized this truth into a literal marriage tradition. 4. The Kinsman-Redeemer Framework (Go'el, Hetairos, Paradidomi, Lytron) You performed a masterful linguistic synthesis here, connecting the Old Testament redemption laws to the New Testament passion narrative. A. The Go'el (Kinsman-Redeemer) Hebrew: גֹּאֵל (go'el) Requirements: Must be a blood relative (family/clan)."}, {"t": "p", "x": "Must be able to pay the redemption price. Must be willing to redeem. Functions: Redeem land (Lev 25:25), redeem persons (Lev 25:47-49), marry a widow to raise up a name (Ruth 4), avenge blood (Num 35:19). B. The Hetairos (Clansman / Comrade) Greek: ἑταῖρος (G2083). Root is etēs = a clansman (family member). Usage in the NT: Appears only 3 times in the NT, all in Matthew (20:13, 22:12, 26:50). Every usage is negative—rebuking a complainer, an unworthy wedding guest, and Judas."}, {"t": "h2", "x": "David's mighty men - NETS/LXX register"}, {"t": "table", "x": "", "head": ["Rank / group", "Name (NETS/LXX / Brenton / KJV)", "NETS / LXX variant(s)", "Father", "Mother", "Brother / family", "Israelite tribe / forefather nation", "Origin / tribe", "Feats", "Physical description", "Other remarks / identity notes", "Dead Sea Scrolls evidence", "Source", "MT tribe / city", "Duplicate / identity status"], "rows": [["SECOND / LOWER THREE — chief", "Lower Three 1. Abessa / Abessa; Abisa / Abishai son of Zeruiah — אֲבִישַׁי", "Abisa", "Sarouia / Zeruiah; Saruia; Zeruiah", "Brother of Joab and Asael; Joab (brother); Asael/Asahel (brother)", "Israel — tribe not supplied", "Drew his sword against 300 casualties at one time; was more renowned than the other two and became their chief.", "More renowned than the other two but did not attain to the first Three. IDENTITY FINDING: Distinct from Iesebaal despite both receiving a “300” feat. Abessa is son of Zeruiah and brother of Joab; he is chief of a lower/second Three and did not attain to the first Three. His “300 at one time” feat is separate from Iesbi’s spear weight of 300 shekels. David twice restrained Abishai’s desire to execute offenders.; PREFERRED LXX HIERARCHY: 1 Supplements 11:20–21 places Abessa after the Bethlehem episode, gives him renown among a second/lower Three, and says he did not reach the First Three. His 300-casualty feat is not stated as part of fetching the water.; TEXTUAL VARIANT: Most Hebrew witnesses and Greek traditions read Three at the elite-tier wording; two Hebrew manuscripts and the Syriac tradition read Thirty at 2 Samuel 23:18, weakening any rigid second-triad reconstruction.; MILITARY MAP: Abishai was both an elite champion and a battlefield commander of one-third during Absalom’s revolt. These are overlapping honors/offices, not proof that the elite roster equaled the field-army command chart.", "1 Supp 11:20–21; 2 Reigns 23:18–19 2 Reigns 18:1–2 2 Reigns 19:21–23; 21:15–17", "Not supplied", "DISTINCT TIER — chief of the second/lower Three; not identified as a Bethlehem water-bringer.", "", "", "", ""], ["Gittite commander — leader of 600 from Gath; later army-third commander", "Eththi the Geththite / Ittai the Gittite — אִתַּי הַגִּתִּי", "Ittai the Gittite", "Philistine-associated foreigner — Gath; possible covenant adherent", "Geththite / Gittite", "Commanded one-third of David’s army during Absalom’s revolt.; Led six hundred Gittites who had followed David from Gath; refused David’s offer to return and swore, “As the Lord lives,” to remain wherever David lived or died.", "Distinct from Eththi the Gadite sixth commander and from Aithi son of Ribai. This army division does not make him the missing member of the first elite Three.; MILITARY MAP: Ittai commanded the third field division during Absalom’s revolt alongside Joab and Abishai. This temporary three-way army command is not the textual “Three” of the mighty-men honor roll.; PHILISTINE-INTEGRATION FINDING: Ittai is the clearest named Philistine-associated loyalist in David’s service. His oath invokes the Lord, which is consistent with allegiance to David’s God, but the text does not narrate a formal conversion rite.; POSSIBLE HISTORICAL LINK: Later Gittite loyalty shows that men from the Philistine sphere did enter David’s service. The text does not identify Ittai or his six hundred as survivors of Baal-perazim or of the foreskin episode, so that connection remains a hypothesis.", "2 Reigns 18:1–2; 2 Reigns 15:18–22", "Gath — גַּת; Gittite — גִּתִּי", "PHILISTINE-ASSOCIATED LOYALIST — strong evidence of personal/covenantal allegiance; formal conversion not explicitly narrated.", "", "", "", "", ""], ["Manassite chief of a thousand; army leader", "Edna / Adnah of Manasseh", "Israel — Manasseh", "Manasseh; Manasseh; approached David at Soklag", "Joined David at Soklag and fought with him; mighty in strength and army leadership.; Fought with David against Geddour; mighty in strength and a leader in the army.", "The Philistine commanders had earlier dismissed David from the campaign against Saul, fearing he would return to Saul with their heads. Day by day men joined David until his force was immense, like a divine force.", "1 Supp 12:19–22; 1 Supp 12:19–23", "Manasseh; Manasseh — מְנַשֶּׁה; Ziklag", "No exact duplicate found; retained separately.", "", "", "", "", "", ""], ["Manassite chief of a thousand; army leader", "Elimouth / Elihu of Manasseh", "Israel — Manasseh", "Manasseh; Manasseh; approached David at Soklag", "Joined David at Soklag and fought with him; mighty in strength and army leadership.; Fought with David against Geddour; mighty in strength and a leader in the army.", "The Philistine commanders had earlier dismissed David from the campaign against Saul, feari sted him; he pledged peace to David son of Jesse and to David’s helpers because God had helped David.", "David received them and made them officers.; David received the Benjamin/Judah contingent after testing whether they came in peace and appointed them officers of the forces.", "1 Supp 12:16–18", "Judah — יְהוּדָה/Benjamin — בִּנְיָמִין approach to David", "No exact duplicate found; retained separately.", "", "", "", "", "", ""], ["Commander with thirty men", "Adina / Adina / Adina son of Shiza the Reubenite", "Saiza; Saeza; Shiza", "Israel — Reuben", "Reuben; Ruben/Reuben", "Tribal identity and command are explicit.", "1 Supp 11:42", "Reuben", "No exact duplicate found; retained separately.", "", "", "", "", "", ""], ["Counselor; man of understanding; scribe", "Ionathan, David’s uncle / Jonathan, David’s uncle", "Jonathan", "Uncle of David", "Israel — tribe not supplied", "A counselor and scribe, not automatically the mighty man Ionathan/ Jonathan in the warrior lists.", "1 Supp 27:32", "Not supplied", "Similar name; keep separate unless father and office match.", "", "", "", "", "", ""], ["Gadite eleven 8", "Ioannan (Gadite) / Johanan", "Israel — Gad", "Gad; Gadite force from the wilderness", "Crossed the flooded Jordan in the first month and drove valley inhabitants east and west; shield-and-spear battle troops.; Strong mighty man in the battle line; bore shield and spear. Crossed the flooded Jordan in the first month and drove out the valley inhabitants east and west.", "Faces like lions; swift as gazelles on the mountains.; Face like a lion; swift as a gazelle on the mountains.", "GADITE SCALE: these were army commanders; the least could face a hundred and the greatest a thousand.", "1 Supp 12:12–15; 1 Supp 12:8–15", "Gad (tribe) — גָּד; Gad — גָּד", "No exact duplicate found; retained separately.", "", "", "", "", ""], ["Eighth-month division commander — 24,000", "Sobochai / Ellon; Sobochai / Mebunnai; Sibbecai the Hushathite — סִבְּכַי", "Sebocha; Sobochai; Housathi / Hisathi / Hastatothi; Mebunnai; Sibbecai", "Israel — tribe not supplied", "Housathi / Hisathi / Hastatothi; belonging to Zarai; Usathite; Hushathite", "Struck down Saphou/Seph, one of the descendants of Rapha/giants, during war with the allophyles at Gazer/Geth and humbled him.", "The parallel alignment is uncertain; retain both forms for research. Monthly list associates him with Zarai. IDENTITY FINDING: The name, gentilic, and eighth-month command strongly support Sobochai/Sebocha as the same warrior across 1 Supplements 11, 20, 27 and 2 Reigns 21—not Selmon merely because Psalm 67/68 mentions snow-covered Selmon.; CORRECTION: Ellon the Aoite belongs with the Eli/Ilai/Zalmon parallel row, not this Sobochai/Sibbecai identity.; Sobochai the Hisathi, belonging to Zarai, headed the eighth-month division.", "1 Supp 11:29; 2 Reigns 23:28 1 Supp 27:11 1 Supp 20:4; 2 Reigns 21:18; 1 Supp 27:11", "Hushathite / Hushathite / Hushathite; belonging to Zarai", "No exact duplicate found; retained separately.", "", "", "", "", ""], ["Gadite eleven 11", "Machabannai / Machbannai", "Israel — Gad", "Gad; Gadite force from the wilderness", "Crossed the flooded Jordan in the first month and drove valley inhabitants east and west; shield-and-spear battle troops.; Strong mighty man in the battle line; bore shield and spear. Crossed the flooded Jordan in the first month and drove out the valley inhabitants east and west.", "Faces like lions; swift as gazelles on the mountains.; Face like a lion; swift as a gazelle on the mountains.", "One small one could face 100; a great one 1,000 (group description).; GADITE SCALE: these were army commanders; the least could face a hundred and the greatest a thousand.", "1 Supp 12:14–15; 1 Supp 12:8–15", "Gad (tribe) — גָּד; Gad — גָּד", "No exact duplicate found; retained separately.", "", "", "", "", ""], ["Gadite eleven 5", "Iermia (Gadite fifth) / Jeremiah (fifth)", "Israel — Gad", "Gad; Gadite force from the wilderness", "Crossed the f c Notes"], "rows": [["R1b / R1a (Paternal)", "Yamnaya Steppe Pastoralists", "~3300–2600 BCE, Pontic-Caspian Steppe", "Indo-European (Zeus, Jupiter, Odin, Thor)", "Skeletal ancient DNA (aDNA) confirms massive migrations of Yamnaya males into Europe. This genetically matches the linguistic spread of the Proto-Indo-European sky-father *Dyēus Pətēr*, which subsequently evolved into Zeus (Greece), Jupiter (Rome), and Tyr/Odin (Scandinavia/Germanic). Paternal skeletal DNA is thus a physical, empirical tracer of the post-Babel Japhetic dispersal."], ["J2 / J1 (Paternal)", "Neolithic Fertile Crescent Farmers", "~8000–3000 BCE, Levant & Zagros", "Canaanite/Mesopotamian (Baal, El, Anu, Enki)", "Skeletal ancient DNA from excavations at Tell Halula, Tell Ramad, and PPNB Levant sites confirms haplogroup J2/J1 dominance. This serves as the direct genetic baseline for the Semitic and Hamitic agricultural populations of the Fertile Crescent, correlating with the localized emergence of the early Near Eastern pantheons at Ground Zero."], ["E1b1b (Paternal)", "Pre-dynastic & Old Kingdom Egyptians", "~4000–2000 BCE, Nile Valley & Horn of Africa", "Egyptian / Hamitic (Amun-Ra, Osiris, Apedemak)", "aDNA from pre-dynastic Nile Valley skeletons shows haplogroup E1b1b predominance, demonstrating localized population continuity in Mizraim (Egypt) and Cush (Sudan), correlating directly with the early emergence of the complex Hamitic solar and agricultural pantheons."], ["L3 (Maternal Mitochondrial)", "Mota Cave Skeleton (Ethiopia)", "~2500 BCE (~4500 BP), Gamo Highlands", "All Non-African Lineages (Out of East Africa/Levant)", "The 4,500-year-old Mota Cave skeleton in Ethiopia is the first ancient African genome sequenced, confirming a massive back-migration of West Eurasians carrying Levant-related ancestry. In matrilineal genetics, haplogroup L3 is the sole ancestral node for all non-African maternal lineages (macro-haplogroups M and N). This is a precise genographic mirror of the post-flood and post-Babel dispersion, showing physical radiating waves out of the Near Eastern/East African hub."]]}, {"t": "h2", "x": "Related notes"}, {"t": "p", "x": "Related: [[23 The 310 Traditions Matrix]]"}]}, "master-voynich": {"title": "Voynich Manuscript Research", "section": "Master Matrix", "sub": "EVA transliterations, folios, the Sherwood Leonardo line", "body": [{"t": "h2", "x": "Text analysis"}, {"t": "table", "x": "", "head": ["Char", "Bennett", "FSG", "Currier", "Char", "Bennett", "FSG", "Currier"], "rows": [["D", "4", "4", "I", "I", "I", "", ""], ["O", "O", "O", "IL", "IE", "G", "", ""], ["S", "8", "8", "IIL", "IIE", "H", "", ""], ["G", "G", "9", "IIIL", "IIIE", "1", "", ""], ["Z", "2", "2", "IQ", "IR", "T", "", ""], ["L", "E", "E", "IIQ", "IIR", "U", "", ""], ["Q", "R", "R", "IIIQ", "IIIR", "0", "", ""], ["CT", "T", "S", "U", "L", "D", "", ""], ["ET", "S", "Z", "N", "N (*)", "N", "", ""], ["H", "H", "P", "M", "M (*)", "M", "", ""], ["P", "P", "B", "IM", "IIIL", "3", "", ""], ["K", "D", "F", "K", "J", "", "", ""], ["F", "F", "V", "IK", "K", "", "", ""], ["CHT", "HZ", "Q", "IIK", "L", "", "", ""], ["CPT", "PZ", "W", "IIIK", "5", "", "", ""], ["CKT", "DZ", "X", "-6", "6", "", "", ""], ["CFT", "FZ", "Y", "-7", "7", "", "", ""], ["A", "A", "A", "Y", "Y", "(n)", "", ""], ["C", "C", "C", "V", "V", "(v)", "", ""]]}, {"t": "p", "x": "Text Analysis - Transliteration of the Text Introduction The main mystery of the Voynich MS is clearly its unknown writing. This topic is addressed from three different aspects, on three (sets of) pages: A look at the writing system, describing its main properties, and similarities and differences with other known writing systems; Transliteration of the text; Statistical analysis of the text of the MS (further subdivided into five areas). This page addresses the second part, the transliteration of the text. It summarises historical transliteration efforts and describes the present state of affairs. This page is highly relevant for those who are interested in the interpretation of the Voynich MS text, but it can be skipped by those who are not."}, {"t": "p", "x": "A table at the bottom of this page provides links to the main transliteration files. There is a second page addressing some more specific topics related to Voynich MS transliteration. Links to it are provided where relevant. Purpose and terminology The purpose of transliteration of the text is the conversion of the handwritten text of the Voynich MS into a computer-readable format (file). The aim of this is to allow computer software to analyse the text, for example in order to derive statistics or to aid the interpretation and ideally translation of the text. Already in the 1976 seminar about the Voynich MS led by Mary D'Imperio (1) this process was called 'transcription' and to my best knowledge this term has been used ever since, in all discussions and publications about the MS."}, {"t": "p", "x": "It has also been used throughout this web site until May 2019, when the difference between transcription and transliteration was clarified to me by a professional linguist (2). In his words: Transcription means a transformation of a text such that it will be substituted by another text made by a well-known alphabet of phonetic symbols. This is only possible in case we already know how the text reads. [...] Transliteration is a symbol-by-symbol conversion of one script into another. Transliteration is used for practical purposes, but does not represent any hypothesis on the original pronunciation of the source text. The distinctive feature of transliteration is that it preserves the source text and is reversible."}, {"t": "p", "x": "The phonetic data could be totally missing, or not yet available, or irrelevant. The first time that this type of transliteration was exercised was by William Friedman after WWII, for processing by so-called 'tabulating machines'. Many years before that, in the 1930's, Fr. Th. Petersen of the Catholic University of America already made a complete hand-written copy (in this case a transcription) of the MS using a complete photocopy of the MS and in some cases, in order to transcribe difficult parts, the actual MS. This document, in which he added many interesting annotations, is still preserved in the William F. Friedman collection of the Marshall Library in Lexington (Va) (3). A transliteration should be clearly distinguished from a proposed translation of the text."}, {"t": "p", "x": "The only purpose of a transliteration is to represent each handwritten character in the MS by a symbol in a computer-readable file in a consistent manner. It doesn't really matter which symbol is used for which character. Ever since the 1940's, different people have used different conventions, or transliteration alphabets. History FSG The earliest well-known transliteration of large parts of the Voynich MS was made in the 1940's by the so-called First Study Group (FSG) of William Friedman, which was briefly mentioned here. The group was working from photostatic copies of the pages of the MS, and they worked with a transliteration alphabet agreed by all members of the team."}, {"t": "p", "x": "Because of the desire for secrecy by Friedman, for a very long time nobody outside his team was aware of this transliteration exercise or the alphabet they used. The Friedman transliteration was never meant to be a complete transliteration of all text in the MS. They decided to concentrate on the linear text written in paragraphs, and not to bother with the complicated diagrams with labels and text written in circles. This is very clear from handwritten annotatations made on the source copies saying \"omit punch\" or \"punch just this\". The FSG transliteration alphabet uses capital letters and numbers. It has a rather unusual method (by later standards) for transliterating the 'intruding gallows', namely by using a dedicated symbol (Z) for the pedestal ()."}, {"t": "p", "x": "The FSG transliteration effort is described in detail in Reeds (1995) (4). A printout of the transliteration was discovered by Jim Reeds in the above-mentioned Marshall library, and together with Jacques Guy he entered it in computer readable form. The resulting file is mirrored here. This transliteration is not complete for the reasons mentioned above. It is one of the five main transliterations of the Voynich MS that is used at this site, and will be reffered to with the two-letter code FG. Bennett In 1976 Prof. William R. Bennett of Yale University published a book on the use of the computer to analyse certain properties of language and text (5). In this book, he dedicated a chapter to an analysis of the Voynich MS text, and for this purpose he needed a transliteration alphabet."}, {"t": "p", "x": "Bennett's alphabet has not been used outside of this publication. The transliteration was made from photographs and stored on paper tape. As reported by Brumbaugh (6), Bennett was assisted in his Voynich MS analysis by Jonina Duker, who was then a sophomore student (7). Currier Roughly at the same time, the cryptanalist Prescott Currier started a major transliteration effort, using an alphabet he designed independently. This alphabet uses the capital letters A-Z and the numbers 0-9 (i.e. all 36). It does not represent some characters which the FSG alphabet does, and it uses single characters for what appear to be composite characters in the MS."}, {"t": "p", "x": "When Currier presented his findings at the 1976 Voynich MS symposium, Mary D'Imperio suggested that it would be important that all researchers use a unified alphabet. She had also started transliterating parts of the MS using her own alphabet, which she abandoned in favour of Currier's, and the two files were merged. The combined transliteration of Currier and D'Imperio, and the transliteration alphabet designed by Currier, have been used well into the 1990's, also in the earliest years of the internet. This is the second main transliteration used at this site, and in the following it will be referred to by the two-letter code CD. Table 1 shows the three above-mentioned alphabets together. Table 1: definition of the main historic alphabets (*) Note:"}, {"t": "p", "x": "Tiltman used the FSG alphabet, but instead of N and M wrote IL and IIL. One thing that immediately appears from this table is that the various researchers did not agree on what constitutes a single character in the Voynich MS text. Later, Jim Reeds showed that many characters in the Voynich MS cannot be represented exactly by any of the existing alphabets. There are some 'rare' characters, and in addition there are what appear to be ligatures of several characters. These characters have traditionally been called 'weirdoes', though here I will use the term 'rare characters'. Jim Reeds produced a document with an overview of these rare characters, calling them 'X1' to 'X128'. An excerpt of this little known document is shown below."}, {"t": "p", "x": "Table 2: early identification of rare characters in the MS Transliteration in the age of the WWW With the emergence of the \"World Wide Web\" and the start of the Voynich mailing list, transliteration of the parts that were still missing from Currier's and D'Imperio's efforts was continued using Currier's alphabet. A number of characters using lower case were added to this alphabet. These are already included (in parentheses) in Table 1. As part of this effort, a file format for this transliteration file was adopted, about which more will be said further below. In parellel to this, a completely new type of transliteration alphabet was designed: Frogguy The 'Frogguy' transliteration alphabet was designed by Jacques Guy in 1991. It uses lower-case characters, numbers and diacritical marks."}, {"t": "p", "x": "Rather than representing complete characters, it represents the 'strokes' or minims of the script of the Voynich MS. As a result of this approach, it creates a reasonably close similarity between the script and the transliterated text. At the same time, some characters in the MS which may be assumed to be a single character are represented by several using this alphabet. By its nature, it is the first alphabet that allows to properly represent many of the ligatured characters that were mentioned above. Jacques Guy also introduced the so-called 'capitalisation rule' which means that a character that is connected to the following one should be represented by a capital letter."}, {"t": "p", "x": "The Frogguy transliteration alphabet and its use are explained in great in a locally preserved copy of Jacques' tuturial or alternatively in a shorter set of linked images. It may be of interest to show an example of this alphabet:      8aiiv 4oqpc89 8a2 octox osa2o2 An additional important contribution from Jacques Guy was a tool that allowed translation of transliteration files from one alphabet to another. This tool was called 'bitrans', was written in Pascal and ran in DOS. It could handle complex translation rules, such as needed for the Currier alphabet, where, for example, the translation of the character  depends on context."}, {"t": "p", "x": "The Frogguy alphabet is the closest in appearance to the Voynich MS text, and it solves the main inconsistency of the Currier alphabet, namely that Currier synthesised strings of consecutive  characters into single characters, while this was not done for strings of consecutive  characters (8). However, it has a distinct disadvantage in that it is not very well suited for the type of numerical analysis mentioned at the top of this page, primarily because of its frequent use of the apostrophe, and to a lesser extent the mixture of letters and numbers. No signficant transliterations have been made using this alphabet."}, {"t": "p", "x": "When Gabriel Landini and myself embarked on a new transliteration of the MS, a project that we named \"EVMT\" at the time, we decided that a new alphabet, but one based on the principles of Frogguy, would be needed. Landini-Zandbergen: Eva EVA originally stood for European Voynich Alphabet, but later became 'Extensible Voynich Alphabet'. It was designed to be similar to Frogguy, but to use only alphabetical characters. It was designed by Gabriel Landini and myself with important contributions and suggestions from Jacques Guy. Its design was part of a larger scheme which included: The need to be able to represent the entire text of the Voynich MS, including previously missing parts, e.g. some of the text outside the standard paragraphs."}, {"t": "p", "x": "The alphabet had to be a superset of FSG, Currier and Frogguy, such that a conversion of all existing transliteration to Eva would be possible and reversible (9). A clear way to idenfity rare characters, inspired by the list of Reeds shown in Table 2. Standardisation of the transliteration file format, including a standard way to identify the location of all text items in the MS (called loci in the following). The capability to design a True Type Font that accurately represents the Voynich MS text (10)."}, {"t": "h2", "x": "Decoding working notes"}, {"t": "table", "x": "", "head": ["EVA Code", "→", "Italian Letter", "Notes", "Folio", "EVA Word", "Letter-by-Letter", "Italian Letters", "Possible Italian"], "rows": [["a", "→", "A", "Core vowel", "═══════", "VERIFIED DECODINGS", "═══════", "═══════", "═══════"], ["y", "→", "A (alt)", "Word beginning/end only", "4r", "ccamus", "cc-a-m-u-s", "CC-A-M-U-S", "SUMAC ✅"], ["d", "→", "B", "8-shaped symbol", "9v", "viola", "v-i-o-l-a", "V-I-O-L-A", "VIOLA ✅"], ["e", "→", "C/CH/CC", "Or alternate E", "65r", "apio", "a-p-i-o", "A-P-I-O", "APIO ✅"], ["ch", "→", "C/CH/CC", "Curved hook", "", "", "", "", ""], ["t", "→", "D/T", "No cross-stroke = D", "═══════", "FOLIO 1v (BELLADONNA)", "═══════", "═══════", "═══════"], ["o", "→", "E/O", "Core vowel (context)", "1v", "kchsy", "k-ch-s-y", "?-C-S-A", "CASCA?"], ["f", "→", "F", h."}, {"t": "p", "x": "Well light if it is now alas and it is about where there such a thing as light, if it is to place light for there is the Earth for then as from the Earth it is with the Sun and then as with or else as the Earth as by a circle around a star there is where the Earth is there for what there is well a round circle about a star in that place well it is for a jest well it is about the Earth it is by the Sun and the Earth it is a round circle about the star moreover as it is there where it is. Inner circle:"}, {"t": "p", "x": "The Sun as it is or else what the Sun hold from such like the Earth light it is a round circle about a star or else with the Sun as it is now I know it is now what it is about, then as with the Earth for there it is to favor the Earth, then as the world and it is to turn, more over it is for the Earth and well as the Earth it had a round circle about a star as thou knowest for it is true as the Sun is or it is more over there. The Earth as it is there as well. About then as well for it is. Spoke 1:"}, {"t": "p", "x": "He knoweth if now as a certain blazing star Spoke 2: the sun as it is a certain blazing star for Spoke 3: the Earth well as it was a round circle about a star Spoke 4: as there or if there is there round circle about a star as Spoke 5: it is for the Earth light and it is light the Sun is Spoke 6: in Greek secret mysteries if it is for the Earth and it is to as Spoke 7: or else it is as well whether if a round circle about a star Spoke 8: as it had there as for what. The combined spokes:"}, {"t": "p", "x": "He knoweth if now as a certain blazing star the sun as it is a certain blazing star for the Earth well as it was a round circle about a star as there or if there is there round circle about a star as it is for the Earth light and it is light the Sun is in Greek secret mysteries if it is for the Earth and it is to as or else it is as well whether if a round circle about a star as it had there as for what. Discuss uct of a fanciful imagination. The manuscript is over 550 years old. Illustrations from some contemporary and earlier medieval herbals are just as bizarre. I have written two articles attempting to identify the plants in these drawings(i)(ii) but have never felt confident that I identified all of them correctly."}, {"t": "p", "x": "This would require decoding the plant’s name in the accompanying text to establish identity with certainty. Figure 1 As this appeared to be an impossible task, I lost interest in the drawings until I read that the little used spice, Sumac, was popular in 15th century Italian cuisine and wondered whether it was one of the VM plants. I did not have to look further than folio 4r. On the second line of the folio’s text is the following: ccam, a part of the drawing, an upside down u and a mirror image s. Written in reverse, ccamus, reads sumac or sumach depending on whether cc represents a single c or a ch. Both spellings for sumac are correct. See Figure 1. This was a surreal moment. Decoding the plant names required the following information:"}, {"t": "p", "x": "The language used to write the manuscript The selected language’s names for medieval plants and herbs A comparison of the VM’s unique alphabet with our Latin alphabet The identity of the code A method for testing the validity of the above assumptions A daunting task. Language: Italian. Sergio Toresella, an expert on ancient herbals, suggested that the VM’s script and the style of the herbal drawings is consistent with documents from Northern Italy, written around the year 1460(iii). Plant names: My Oxford Italian dictionary was not very helpful in providing the common names of Italian plants and herbs. While searching for other Italian dictionaries, I had the good fortune to find Florio’s 1611 Italian dictionary(iv)."}, {"t": "p", "x": "This dictionary provided exactly what I required, even the Italian name for the various “worts” that the English used to name their herbs (e.g. bloodwort, lungwort, colewort etc.). The dictionary has the disadvantage of only having an Italian/English version. The identification of over 100 of VM’s botanical and some herbal drawings is the result of examining over 600 of the dictionaries pages for common Italian plant and herbal names. Alphabet: I was unable with EVA (European Voynich Alphabet) or similar alphabets(v), to decode many plant names in the herbal section of the VM. However, with the 8 symbols in EVA, that resembled lower case Latin letters, I was able to decode a few words in the herbal section of the VM(vi), Table 1."}, {"t": "table", "x": "a · e · o · ch · i · p · r · s", "head": ["Voynich", "0.087", "0.094", "0.05", "0.158"], "rows": [["Letter", "a", "e", "i", "o"], ["Italian", "0.109", "0.115", "0.102", "0.1"], ["English", "0.082", "0.127", "0.075", "0.07"], ["German", "0.063", "0.16", "0.028", "0.076"]]}, {"t": "table", "x": "Plant anagrams", "head": ["Transcribed", "ba", "baba"], "rows": [["Anagram", "ab", "abba"]]}, {"t": "p", "x": "Table 1: Eight symbols from the EVA alphabet which resemble Latin letters. Starting with the symbols in Table 1, I developed the alphabet in Table 4, dubbed AVA (American Voynich Alphabet). It includes the eight symbols from Table 1, additional symbols that also resemble lower case Roman letters and a few symbols whose identity was determined by trial and error. The AVA alphabet was basically derived as follows: Table 2 Table 2 shows the percentages for the vowels “a”, “e”, “i” and “o” calculated by combining the values given for Currier's A and B botanical folios(vii). These values are compared to the percentages of the same vowels for Italian, English and German. The percentages are closer to Italian than English or German where “e” has a higher percentage than the other vowels."}, {"t": "p", "x": "Voynich Words “ab” “abba” Florio’s 1611 Italian dictionary Table 3 The percentages for the two symbols on the right are 14.3% and 11.7% respectively. The “9”-shaped symbol is only found at the beginning or the end of a word. Trial and error indicated that it may also represent an “a” which combined with the 8.7% “a”-symbol percentage from Table 2 brings the total for the letter “a” to 24.0%. The “8”-shaped symbol represents the letter “b”, also determined by trial and error. Captain Prescott Currier subdivided the VM into A and B folios, suggesting that two different scribes wrote the VM in two different languages. This theory is based on observing that the combination of these two symbols occurs 8 times within 25 A pages and 554 times in 25 B pages(viii)."}, {"t": "p", "x": "Table 3 shows the decoding and translation of the two words “ba” and “baba” and indicates that the content of the text rather than two different scribes may account for the atypical presence of these two symbols on the B pages. Neither of the words, ab or abba, occur in a modern Italian dictionary. There appears to be a significant difference between modern Italian and the Italian used in the 16th century and earlier."}, {"t": "p", "x": "f · m · n · r"}, {"t": "p", "x": "Trial and error led me to conclude that most of the other symbols also represent the letters in the Latin alphabet that they most closely resemble. See Table 4 for additional examples."}, {"t": "p", "x": "ch or cc · p · v · l"}, {"t": "p", "x": "The symbols for “c”, “p” and “v” were determined by decoding anagrams for sumac, folio 4r; apio, wild parsley, folio 65r; and viola, folio 9v. The anagram for viola also established the symbol for “l”."}, {"t": "h2", "x": "Pharmacopoeia analysis"}, {"t": "table", "x": "", "head": ["Matrix Region", "VM Dangerous Plants", "Countries", "Matrix Traditions Affected", "Flying Ointment?", "1 Enoch Reference", "Babel Proximity"], "rows": [["Europe (Greek)", "Belladonna, Wolfsbane, Mandrake, Rue, Hellebore", "Greece, Italy", "Greek (#2), Roman (#3)", "✅ PRIMARY", "1 Enoch 8:1", "🟡 NEAR (3000km)"], ["Europe (Roman)", "Belladonna, Wolfsbane, Lovage, Weld, Alkan hape of the Pleiades constellation, featuring Stephen Bax’s famous target word \"doary\": Plaintext Locus 1: doary Locus 2: doar Locus 3: oary Locus 4: doary Locus 5: doar. oary. doary 4. Representative Pharmaceutical / Recipe Folios [Folio 82r] A representative page from the pharmaceutical/recipe section, featuring short paragraphs arranged next to rows of apothecary jars and recipe vessels:"}, {"t": "p", "x": "Plaintext Line 1: pshol. cthees. dchold. chody. opor. lkeey. dchold. chocthy. dpy- Line 2: deeo. lkey. dchold. sheey. dchold. dpyr. shol. opol. lkey- Line 3: tcory. dshol. chor. chold. sheey. dchody. dpolar. lkey. chody- Line 4: dchold. sheey. chol. odar. shody. dpy. keey. chody. opor. shey- Line 5: dshold. qoky. shey. rpeey. dchold. orey. lkey. dshor. shey- Line 6: kshol. ctheey. dchold. shody. opor. shey. dchold. dpy- Line 7: tcho. key. dchold. chody. okor. lkey. chody. opor. shey- Sources for transcriptions and transliteration structures: Description of the Voynich MS — Voynich.nu Quire 9 (Astronomy Folios) — Voynich.nu Unicamp.br Landini Interlinear Archive"}, {"t": "h2", "x": "EVA raw transcription"}, {"t": "p", "x": "<f67r1> {$I=A $Q=I $P=A} # # # # # # # # # # #"}, {"t": "h2", "x": "AVA mapping table"}, {"t": "p", "x": "| I have compiled Dr. Sherwood's complete character mapping table for you below. | |---| | To provide the other portion of your request, could you please clarify which specific folios you would like the full EVA (European Voynich Alphabet) transcription for? (For example: Folio 116v, Folio 68r1, Folio 68r2, Folio 99r, or specific botanical pages). Once you let me know, I can retrieve and format the exact transcriptions for you. | | Dr. Sherwood's AVA (American Voynich Alphabet) Mapping Table | | In her article The Voynich Botanical Plant Names Decoded, Dr. Sherwood and her daughter Erica established the AVA Alphabet—a phonetic 21-letter mapping system designed for 15th-century Italian."}, {"t": "p", "x": "It deliberately excludes modern English letters j, k, w, x, and y (following the dialect patterns of Dante's volgare and Florio's 1611 dictionary). | | Italian Roman Letter | | A | | A (Alternate) | | B | | C / CH / CC | | D / T | | E | | E (Alternate) | | F | | G | | H | | I | | I (Alternate) | | L | | M | | N | | O | | P | | R | | S | | T | | U / V | | TL | | Note: In her AVA model, decorative flourishes and ascending loops (the \"fancy\" parts of the script) are considered meaningless embellishments added by the scribe and should be ignored during decoding. | | Please let me know which folios you would like transcribed in EVA, and I will be happy to extract that data for you! |"}, {"t": "h2", "x": "Voynich information browser notes"}, {"t": "p", "x": "| VIB - Voynich information browser | |---| | Information | | Start | | Glossary | | Links | | Manuscript | | Overview | | Images | | Extractor | | Quick select | | f1r | | Page information on f103r | | Parsable information | | Illustration type: | | Quire: | | Page in quire: | | Currier language: | | Currier hand: | | Has non-Voynich text: | | Has key-like sequence: | | Has extraneous writing: | | Descriptive comments | | Last edited on 1998-10-09 05:16:56 by stolfi | | Identification | | Identification | | Title: | | Page: | | Folio: | | Panels: | | Bifolio: | | Quire: | | Attributes | | Attributes | | Language: | | Hand: | | Subsets: | | Subject: | | Colors: | | Description | | gathering mark 20 | | Transcriptions |"}, {"t": "h2", "x": "Article catalog"}, {"t": "table", "x": "", "head": ["Category", "Article Title", "URL", "Description / Summary"], "rows": [["Voynich Astronomy", "The Voynich Manuscript Astronomical Folio 68v2 (PDF)", "The Voynich Manuscript Astronomical Folio 68v2 (PDF)", "Discusses the Earth revolving around its diameter while the Sun provides light. Proposes heliocentrism 100 years before Galileo."], ["Voynich Astronomy", "The Voynich Manuscript Astronomical Folio 68v3 (PDF)", "The Voynich Manuscript Astronomical Folio 68v3 (PDF)", "Resembles an Armenian manuscript drawing; decodes hieroglyphs indicating the Earth orbits the Sun and the Moon orbits the Earth."], ["Voynich Astronomy", "The Voynich Manuscript Astronomical Folio 68v1 (PDF)", "The Voynich Manuscript Astronomical Folio 68v1 (PDF)", "States that the Sun is a star. Together with f.68v2 and f.68v3, these folios represent a heliocentric solar system 100 years before Galileo."], ["Voynich Authorship", "Voynich Manuscript Folio 116 Revisited", "Voynich Manuscript Folio 116 Revisited", "Translation of f.116 notes and decoded lines of f.1 suggest a ten-year-old Leonardo da Vinci began writing the Voynich Manuscript around 1462 after returning from Africa."], ["Voynich Astronomy", "The Voynich Manuscript's Star Folios. Part III", "The Voynich Manuscript's Star Folios. Part III", "Decodes f.68r1 star section, describing the Sun as a gold blazing star and the Earth revolving in a slow circular dance. Features warnings to keep these ideas secret."], ["Voynich Astronomy", "The Voynich Manuscript's Star Folios, Part II", "The Voynich Manuscript's Star Folios, Part II", "Decodes f.68r2 star section. Proposes that the Earth's rotation on its axis causes the apparent turning of the northern sky around the North Star and seasonal changes."], ["Voynich Authorship", "The Voynich Manuscript: Leonardo da Vinci's first codex?", "The Voynich Manuscript: Leonardo da Vinci's first codex?", "Highlights similarities in script, hatching, knot drawings, margins, phonetic spelling, birthday, and orthography, identifying the VM as Leonardo's first codex."], ["Voynich Astronomy", "The Voynich Sun and Moon Folios Partly Decoded", "The Voynich Sun and Moon Folios Partly Decoded", "Decodes astronomical folios f.68r1 and f.68r2 to outline the author's views of the heliocentric solar system."], ["Voynich Botany", "The Voynich Botanical Plant Names Decoded", "The Voynich Botanical Plant Names Decoded", "Outlines the AVA (American Voynich Alphabet) developed with Erica Sherwood, decoding over 111 plant names from single-word Italian anagrams using Florio's 1611 dictionary."], ["Voynich Science", "Radiocarbon Dating of the Voynich Manuscript", "Radiocarbon Dating of the Voynich Manuscript", "Analyzes the precision, accuracy, and systematic errors of the C14 dating of the VM vellum, interpolating the tree-ring curve data."], ["Voynich Language", "The Voynich Manuscript's Script and Code", "The Voynich Manuscript's Script and Code", "Proposes the author was left-handed and wrote using anagrams and a code based on a one-time pad substitution cipher and an Alberti disk."], ["Voynich Language", "The Voynich Manuscript Decoded?", "The Voynich Manuscript Decoded?", "Argues the VM's code is a series of Italian word anagrams written in a highly embellished, fancy script, making it simpler than commonly believed."], ["Voynich Language", "The Voynich Manuscript Decoded? – Part II", "The Voynich Manuscript Decoded? – Part II", "Deciphers the top paragraph of f.99r and the Michitonese page (f.116v) using the AVA alphabet, revealing details of botanical and astrological folios."], ["Voynich Authorship", "The Handwriting of Leonardo da Vinci and the Voynich Manuscript", "The Handwriting of Leonardo da Vinci and the Voynich Manuscript", "Compares Leonardo's earliest known handwriting sample (1473) with VM folio 87r text, finding striking similarities and loop decorations."], ["Historical Metallurgy", "The Composition of Ife Heads - A Numerical Analysis", "The Composition of Ife Heads - A Numerical Analysis", "Analyzes the composition of West African brass Ife heads, suggesting they were cast from a specific alloy combination rather than cementation of leaded zinc ores."], ["Voynich Botany", "The Voynich Botanical Plants 2.0", "The Voynich Botanical Plants 2.0", "Compares VM botanical drawings with 15th-century herbals (such as Peter Schoeffer's) and alpine plants, showing that about 19% are identical and 48% are very similar to contemporary illustrations."], ["Art History", "An Unidentified Painting by Leonardo da Vinci", "An Unidentified Painting by Leonardo da Vinci", "Analyzes a Madonna and Child painting in the Huntington collection, ascribed to Pinturicchio, and argues that it displays unmistakable characteristics of Leonardo."], ["Voynich Authorship", "The Voynich Manuscript: Full Circle", "The Voynich Manuscript: Full Circle", "Claims to find the author's name hidden directly among the roots and stems of several plants in the VM botanical illustrations."], ["Voynich Authorship", "Leonardo da Vinci and the Voynich Manuscript", "Leonardo da Vinci and the Voynich Manuscript", "Connects script similarities, signature representations, mirror writing, and a zodiac chart matching Leonardo's birthday to support childhood authorship."], ["Voynich Authorship", "Voynich Manuscript: was the author left-handed?", "Voynich Manuscript: was the author left-handed?", "Identifies left-handed hatching styles, explores Tarot card motifs as inspiration for astronomical folios, and traces bathing nymphs to 14th-century mythological manuscripts."], ["Voynich Botany", "The Voynich Botanical Plants", "The Voynich Botanical Plants", "Her primary botanical work comparing VM plant drawings with living plants, starting with a backyard creeper identified as Folio 32r."], ["Historical Authorship", "Leonardo da Vinci and Bartolomeo Marchionni", "Leonardo da Vinci and Bartolomeo Marchionni", "Proposes a lifelong connection between Leonardo and Bartolomeo Marchionni, a Florentine banker in Lisbon who financed early Portuguese voyages and the slave trade."], ["Historical Authorship", "Bartolomeo Marchionni and the Afro-Portuguese Ivories", "Bartolomeo Marchionni and the Afro-Portuguese Ivories", "Investigates Marchionni's role in licensing slave and tusk trades and training African artists from Sierra Leone and Benin to carve European-style ivory pieces."], ["Voynich Science", "Analysis of Radiocarbon Dating Statistics in Reference to the Voynich Manuscript", "Analysis of Radiocarbon Dating Statistics in Reference to the Voynich Manuscript", "Explores the statistical margin of error in C14 dating, suggesting uncertainties in the calibration curve could shift the calendar year estimate significantly."], ["Voynich Science", "Analysis of Radiocarbon Dating Statistics in Reference to the Voynich Manuscript – Part II", "Analysis of Radiocarbon Dating Statistics in Reference to the Voynich Manuscript – Part II", "Argues that standard error reporting for radiocarbon dating is over-simplified, justifying an expanded margin of error for the VM's calendar age."]]}, {"t": "h2", "x": "Figures index"}, {"t": "table", "x": "", "head": ["Tab/Origin Article", "Figure ID/Reference", "Title/Decoded Item", "Subject/Details"], "rows": [["Leonardo & VM Manuscript", "Figure 1", "Birthing Tubs", "Astrological/biological baths comparison"], ["Leonardo & VM Manuscript", "Figure 2", "Signature", "Hidden signature marks in VM text"], ["Leonardo & VM Manuscript", "Figure 3", "Signature Comparison", "Comparison with Leonardo's standard signatures"], ["Leonardo & VM Manuscript", "Figure 4", "Birthday", "Astrological chart matching Leonardo's birth details"], ["Leonardo & VM Manuscript", "Figure 5", "Childlike Drawings", "Analysis of drawing style indicating a precocious child"], ["Leonardo & VM Manuscript", "Figure 6", "Signs of the Zodiac", "Zodiac signs compared to Italian style"], ["Leonardo & VM Manuscript", "Figure 7", "Clockwise Astronomical Drawing", "Clockwise rotational markings"], ["Leonardo & VM Manuscript", "Figure 8", "The Cipher", "Introduction to the AVA phonetic symbols"], ["Voynich Manuscript Decoded?", "Words f99r/f88r", "Decoded Words", "Italian words decoded from botanical folios 99r and 88r"], ["Voynich Manuscript Decoded?", "Words f88v", "Decoded Words", "Italian words decoded from botanical folio 88v"], ["Voynich Manuscript Decoded?", "Words f102r", "Decoded Words", "Italian words decoded from botanical folio 102r"], ["Was Author Left-Handed?", "Figure 1", "Afro-Portuguese ivory horn", "Suns; moons; and stars motifs comparison"], ["Was Author Left-Handed?", "Figure 2", "Liber Chronicarum drawing of sun and moon", "Comparison with Nuremberg Chronicle designs"], ["Was Author Left-Handed?", "Figure 3", "Tarot card suns", "Inspirations for the sun folios from Italian Tarot"], ["Was Author Left-Handed?", "Figure 4", "Tarot card moons", "Inspirations for moon folios"], ["Was Author Left-Handed?", "Figure 5", "Tarot card stars", "Inspirations for star folios"], ["Was Author Left-Handed?", "Figure 6", "Tarot card Wheel of Fortune", "Wheel of Fortune matching the planetary wheels"], ["Was Author Left-Handed?", "Figure 7", "Dante's Divine Comedy Sun; Moon; and Star", "Tuscan literary influence and motifs"], ["Was Author Left-Handed?", "Figure 8", "Ovide Moralise drawing of Pallas and her Muses", "Bathing nymphs inspired by medieval mythological art"], ["Was Author Left-Handed?", "Figure 9", "Ovide Moralise drawing of Callisto", "Astrological details of Callisto"], ["Was Author Left-Handed?", "Figure 10", "Bottom to top hatching", "Hatching styles indicating left-handedness"], ["Was Author Left-Handed?", "Figure 11", "Leonardo's hatching", "Visual evidence of left-handed script from Leonardo's sketches"], ["Was Author Left-Handed?", "Figure 12", "Vinci Academy drawing", "Margins and knots alignment comparison"]]}, {"t": "h2", "x": "Sherwood directory"}, {"t": "table", "x": "", "head": ["Category / Symbol", "Decoding", "Details"], "rows": [["Vowels (A, E, I, O)", "Standard Vowels", "Matches the frequency of medieval Italian."], ["Letter 'a'", "Standard vowel + \"9\" shape", "Found at word boundaries (together accounting for ~24% frequency)."], ["Letter 'b'", "\"8\"-shaped symbol", "Represented by the \"8\"-shaped symbol."], ["Gallows symbols", "p', 'l', and 'tl'", "Represent the lower case letters 'p', 'l', and 'tl'."], ["Letters 'c', 'p', 'v'", "Anagrams", "Decoded from Italian anagrams like \"ccamus\" (sumac, f.4r), \"apio\" (parsley, f.65r), and \"viola\" (viola, f.9v)."], ["Orthography", "Phonetic Spelling", "Words are phonetically spelled, with prepositions/articles amalgamated into long anagrams (identical to Leonardo da Vinci's unique writing peculiarities)."]]}, {"t": "p", "x": "Edith Sherwood Website Archive & Directory Biography & Academic Background Edith Sherwood's major research theories encompass the Leonardo da Vinci authorship of the Voynich Manuscript, the AVA alphabet, botanical plant identifications, and astronomical folios showing heliocentrism 100 years before Galileo. Table of Contents Articles Catalog | A catalog of 25 main research papers, including summaries and URLs. Voynich Botanical Plants | A database of 124 visual and cryptographic plant identifications. Figures & Decoded Words | An index of all figures, diagrams, and decoded words mentioned in her articles. The AVA (American Voynich Alphabet) System Developed by Dr. Edith Sherwood and Erica Sherwood, the AVA replaces the standard EVA transcription. It is a 21-letter alphabet based on Dante's Italian dialect (volgare), omitting the modern English/Latin letters J, K, W, X, and Y."}, {"t": "h2", "x": "Leonardo connection"}, {"t": "table", "x": "", "head": ["Section", "Content", "Starting Row"], "rows": [["1", "Leonardo Quotes & Philosophy", "12"], ["2", "Bartolomeo the Turk — Leonardo's Notebooks", "31"], ["3", "VM History & Leonardo Authorship Evidence", "100"]]}, {"t": "p", "x": "🎨 LEONARDO DA VINCI & VOYNICH MANUSCRIPT CONNECTION Consolidated research from Dr. Edith Sherwood on Leonardo's authorship of the Voynich Manuscript §1. LEONARDO QUOTES & PHILOSOPHY There are three classes of people, those who see, those who see when they are shown, and those who do not see. — Leonardo da Vinci Iwas introduced to the Voynich Manuscript about thirteen years ago. My immediate reaction on viewing selected folios from the VM was that the script closely resembled the handwriting of Leonardo da Vinci, an observation also noted by the son of Robert S. Brumbaugh (The Most Mysterious Manuscript, ed R.S. Brumbaugh, Southern Illinois University Press 1978, p 117). This and other factors led me to formulate the hypothesis that the VM was written by a young Leonardo da Vinci."}, {"t": "p", "x": "Over the following years I wrote a number of articles supporting this hypothesis. Recently, I received an email from Tania Ocampo, who wrote that she considered that Leonardo and the author of the VM have very similar handwriting. She sent me a sample of Leonardo’s writing that provides additional proof that my hypothesis that Leonardo wrote the VM may be correct. I emailed Tania, suggesting that she either put this sample of Leonardo’s writing up on the internet or, if this was difficult for her to do, I would do it for her, giving her the credit for a very useful observation. This is the reason I am writing this article. The VM is written from left to right and from top to bottom by an individual writing with their right hand. It is very well known that Leonardo was left handed."}, {"t": "p", "x": "His notebooks were written from right to left using mirror image script. These books were private, written for his eyes only. He wrote in a conventional manner, from left to right, when he wished to communicate with other people. Leonardo celebrated the fact that he defied public convention, declaring ‘I o mancino’, I am left handed. Left-handed people were called southpaws and accused of practicing witchcraft. The Devil himself was considered to be a leftie. People writing from left to right, when using their left hand, tend to smudge the ink as their hand moves across the page. Left-handed children were forced to write with their right hand, a practice that continued until the beginning of the 20th century."}, {"t": "p", "x": "Leonardo would have been taught to write with his right hand and probably only rebelled against this convention when he became an adult. If you read my article ‘Was the Author of the Voynich Manuscript Left-handed’, I show that although the script is right-handed, the hatching in the drawings was done by a individual using his left hand. If Leonardo is to be accepted as the author of the VM, a comparison of his handwriting with the VM script is desirable. A comparison of the two scripts must be judged, taking into account the following observations: The VM uses a unique alphabet with over 30 different symbols, most of them unlike any other alphabet. A number of attempts have been made to transcribe of the VM alphabet, the one generally accepted is known as ‘The European Voynich Alphabet’"}, {"t": "p", "x": "EVA. An individual’s handwriting matures with age. There are no examples of Leonardo’s childhood handwriting. The earliest known example of his script is from 1473, when he was 21 years old. It was decorated with exaggerated curlicues and flourishes, similar to the embellishments found in the VM script. As he matured, these embellishments disappeared and his handwriting became utilitarian. Plate 1 is a comparison of a sample of Leonardo’s writing provided by Tania, with text from VM plant folio No. 87r. Plate 2 is a comparison of the mirror image of this sample with the same text. The scripts appear to be very similar. I am not a handwriting expert, but I have no difficulty in believing that Leonardo’s left hand wrote the example that Tania sent me and his right hand wrote the VM example."}, {"t": "p", "x": "Ihave been unable to determine the notebook Tania’s script came from, but it may be found on several web sites relating to Leonardo’s handwriting. Idedicate this article to my 10 year old grandson. One day recently, he was looking over my shoulder while I was reading an article on the VM. He exclaimed, “I didn’t know that you knew about the Voynich Manuscript.” and proceeded to tell me all about the manuscript, including naming the missing folios. He had read the children’s book ‘Trust No One’ by Linda Sue Parks, book 5 from the series, 39 Clues. Perhaps this book should be added to the inventory of books about the VM. §2. BARTOLOMEO THE TURK — LEONARDO'S NOTEBOOKS Leonardo da Vinci jotted down in one of his notebooks the following reminder:"}, {"t": "p", "x": "“Write to Bartolomeo the Turk as to the flow and ebb of the Black Sea, and whether he is aware if there is such a flow and ebb in the Hyreanean or Caspian Sea.”(i) According to Ritter, who was the original translator of Leonardo’s notebooks, the handwriting indicates that the note was written during the latter years of his life. I have checked many publications including recent ones relating to Leonardo and his life but no one appears to have identified Bartolomeo the Turk. Leonardo’s comment indicates that: Bartolomeo the Turk and Leonardo da Vinci lived in different towns. Bartolomeo the Turk was familiar with the Black Sea but not necessarily the Caspian Sea. The name Bartolomeo is a fairly common Latin name, but Leonardo’s spelling of the name is Italian."}, {"t": "p", "x": "The name is spelt Bartolome in Spanish and Bartolomeu in Portuguese. Although Leonardo did not pay too much attention to spelling, it is likely that the person he was referring to was Italian. Iwould like to propose, for the reasons given above, that Bartolomeo di Domenico Marchionni, scion of the Marchionni family,(ii) was Bartolomeo the Turk. Bartolomeo Marchionni had the patronym Domenico. Another of Leonardo’s friends, “Fioravante di Domenico at Florence is my most beloved friend, as though he were my brother”(iii) had the same patronym. Is this a coincidence or were Bartolomeo and Fiorvante brothers?"}, {"t": "p", "x": "This observation could possibly be confirmed by consulting the archives in Florence for a frame around 1470, to determine whether two brothers in the Mardhionni family had the names, Bartolomeo and Fiorvante. Bartolomeo Marchionni, who became the wealthiest banker in Lisbon, was a major trader in West African slaves and was known in Lisbon as Bartholomeu Florentim.(iv) From around 1360 his family were prominent traders in Kaffa (now known as Feodosia), the Genoese dominated city, on the Crimean peninsula on the Black Sea.(v) The economy of Kaffa was based on trading of slaves, musk, gold, ivory and spices. The Marchionni family imported slaves, mainly females, into northern Italy to work as domestic servants."}, {"t": "p", "x": "In this connection it is interesting to note that Alessandro Vezzosi, the director of the Museo Ideale Leonardo da Vinci, has concluded that da Vinci’s father was a minor nobleman or craftsman named Ser Piero da Vinci, while the artist’s mother was a Middle Eastern slave, known by the name Caterina. Leonardo was left-handed, but began all of his notebooks on the last page, which was customary for Arabs and Jews.(vi) Is it possible that the Marchionni family sold Caterina to Leonardo’s father? Constantinople fell to the Ottoman Turks in 1453. This did not prevent the Marchionni family from continuing their slave trading operations in Kaffa, as they still had at least one representative there in 1462.(vii) Kaffa came under Turkish rule in 1475, ending all European trade in the region."}, {"t": "p", "x": "This association with the Turkish conquest of Constantinople and the Black Sea and the slave trading activities of the Marchionni family in Kaffa could have earned Bartolomeo Marchionni the nickname “Bartolomeo the Turk.” Sergio Tognetti, a contributor to the book Black Africans in Renaissance Europe, has stated that prior to 1470, Bartolomeo Marchionni lived in Florence with his family who owned an apothecary shop that overlooked Brunelleschi’s Basilica of San Lorenzo (location #1).(viii) Spices were a valuable commodity in the 15th century, often worth their weight in gold, and were among the items obtainable from Kaffa on the Black Sea. Owning an apothecary shop/spice shop would be a logical addition to the slave trading activities of the Marchionni firm."}, {"t": "p", "x": "At the same time, Leonardo’s father was living on the Plaza Signoria (location #5) and had an office opposite the Bargello (location #4), both within a few blocks of the apothecary shop owned by the Marchionni family. Verrocchio’s bottegha, where Leonardo was an apprentice, was also close by.(ix) In 1470 Bartolomeo Marchionni was fifteen years old, two to three years younger than Leonardo da Vinci. The two teenage boys may have known each other. Judging by their addresses, both families were among the Florentine elite. The occupation of Kaffa by the Ottoman Turks ended the slave trading activities of the Marchionni family. Bartolomeo Marchionni left Florence in 1470 and went to Lisbon as an office boy to the Cambini family of merchant bankers and West African slave traders."}, {"t": "p", "x": "He probably intended to transfer the family business to Portugal where the West African slave trade was in its infancy. By 1482, about the same time as the bankruptcy of the Cambini Bank, Marchionni was well established as a merchant banker in Lisbon, with sugar plantations in Madeira. He was also becoming a major player in the West African slave trade.(x) The possible association of Bartolomeo Marchionni with Leonardo da Vinci extended to having mutual friends and colleagues in common. Marchionni worked with Benedetto Portinari in Lisbon and had a business relationship with Tommaso Portinari who managed a branch of the Medici bank in Bruge from 1473-1481."}, {"t": "p", "x": "In 1474 or 1475 Marchionni and the Portinari brothers used money from this bank to finance an unsuccessful voyage to obtain gold from West Africa.(xi) This was probably the ill-fated Flemish ship that in 1475 was wrecked off the West African coast on its return voyage to Bruge. The local inhabitants ate the crew and sold the gold to Portuguese traders the following year.(xii) Lorenzo de Medici and his bank absorbed all the financial losses resulting from the sinking of this ship. When the Medici Bank in Bruge went bankrupt in 1479, an audit of the books listed Bartolomeo Marchionni and Benedetto Portinari among its debtors. The bank was closed and Tommasso went to live in Milan.(xiii) Leonardo’s life in Florence in the 1470’s was fraught with difficulties."}, {"t": "p", "x": "He was twice accused of sodomy, and in 1481 he was not included among the painters selected to go the Vatican to assist in decorating the recently built Sistine chapel. Some time around 1482 to 1483 Leonardo left Florence for Milan. Here he met Tommasso and Benedetto Portinari who were both interested in painting, having had their portraits painted by Hans Memling, the Flemish painter. In his journal, Leonardo made the following notation: “Ask Benedetto Portinari how the people go on the ice in Flanders?”(xiv) Bruge was at that time part of Flanders. In 1487, Tommasso Portinari became an ambassador to Ludovico Sforza of Milan, representing Maximillian I of Austria. He may have helped Leonardo obtain work at the Sforza court."}, {"t": "p", "x": "Leonardo also had a close relationship with Benedetto Dei, a representative of the Portinari family, who in 1470 was the first white man to visit Timbukto. Leonardo wrote Benedetto Dei a lengthy letter about bringing him “news from the East” and of “a giant appearing from the Syrian Desert.”(xv) Dei is known to have been in Milan between 1484-87, but Leonardo may have met him earlier in Florence through his association with Paolo Toscanelli with whom Dei was very friendly.(xvi) Leonardo referred to Toscanelli as Maestro Paolo the physician.(xvii) It can also be shown that Marchionni knew Toscanelli, the renowned astronomer, physician, geographer."}, {"t": "p", "x": "The eulogy Marchionni gave to King Manual of Portugal credited Toscanelli with influencing Portugal’s nautical activities.(xviii) These mutual acquaintances may have helped maintain Leonardo’s and Bartolomeo Marchionni’s boyhood association, assuming they had one. With the impending invasion of Milan by the French and the subsequent downfall of Ludvico Sforza, Leonardo was forced to leave Milan during the last days of 1499. He was again confronted with adversity. Meanwhile Marchionni was going from strength to strength. He helped finance the Portuguese voyages to India and the Orient."}, {"t": "p", "x": "His caravel, the Santiago, sailed for India with Vasco da Gama’s fleet in 1497, returning in September 1499 with a cargo of spices.(xix) Isabella d’Este was aware of a letter Marchionni wrote to friends in Italy concerning this expedition. Around this time Leonardo visited Isabella d’Este in Mantua and made a half-length portrait drawing of her that now hangs in the Louvre. Perhaps he was present when this nautical triumph of da Gama was being discussed.(xx) In 1502, while in the services of Cesare Borgia, Leonardo apparently offered his services to Sultan Bejazer II to build a bridge at Constantinople over the Golden Horn. Needless to say the bridge was never built."}, {"t": "p", "x": "The note relating to Bartolomeo the Turk was apparently written during Leonardo’s later years and probably had nothing to do with Leonardo’s contact with the sultan.(xxi) Marchionni owned one of the ships that sailed with Cabral in 1501 that resulted in the accidental discovery of Brazil.(xxii) He probably engineered and financed the subsequent expedition to Brazil that included his friend and fellow Florentine trader and explorer, Amerigo Vespucci. Vespucci’s letters to his patrons, Lorenzo di Pierfrancesco de’ Medici (Lorenzo de’Medici’s cousin) and Piero Soderini (the governor of Florence) described his voyages to this New World. These letters convinced the Europeans that a new continent had been discovered."}, {"t": "p", "x": "Leonardo was acquainted with Amerigo Vespucci.(xxiii) and Vasari claims that there was a sketch of Amerigo Vespucci in Leonardo’s book of drawings.(xxiv) Leonardo returned to Milan in 1506, where he worked until the unrest in Milan again forced him to leave in 1511. From 1513 to 1516, Leonardo, now over sixty, worked for the first time in Rome under the patronage of Guliano de Medici, the youngest son of Lorenzo de Medici. While in Rome, Leonardo lived in an apartment at the Belvedere, a summer palace outside the Vatican and near the papal palace.(xxv) Hanno, the albino elephant from India, was living in the courtyard of this palace during Leonardo’s stay. This elephant was a present to Pope Leo X (Giovanni de Medici, the middle son of Lorenzo) from King Manuel of Portugal."}, {"t": "p", "x": "There appears to have been a good relationship between the two younger sons of Lorenzo and the Portuguese throne. Bartolomeo Marchionni was still sending representatives, generally Florentine associates, with the Portuguese on voyages to India.(xxvi) In 1515-16, Giovanni of Empoli, an employee of Marchionni and Andrea Corsali, a Florentine merchant and explorer, both sent letters to Guliano de Medici in Rome describing their travels. In a letter dated 1515, Corsali wrote the following:"}, {"t": "p", "x": "“a gentile people called Guzzarati who do not feed on anything that has blood, nor will they allow anyone to hurt any living thing, like our Leonardo da Vinci, they live on rice, milk and other inanimate foods.”(xxvii)(xxviii) Guliano de Medici died early in 1516 and Leonardo left Rome later that year, so it is not clear whether either of them actually saw these letters. Amap showing details of the Northern hemisphere, was found among Leonardo’s papers in the Windsor collection.(xxix) It was obviously drawn shortly after Ponce de Leon discovered the southeast side of Florida in 1513. Florida was initially, as this map indicates, assumed to be an island and only later was it realized that Florida was part of the North American continent."}, {"t": "p", "x": "Of particular interest are the details given on this map of the West African coastline, including the position of the fort at Elmina, or Mina, where the Portuguese had located gold. It has been established that someone other than Leonardo drew this map, someone familiar with Portuguese activities in Africa, India and the Orient. Richter comments: “Leonardo’s researches as to the structure of the earth and the sea were made at a time, when the extended voyages of the Spaniards and Portuguese had also excited a special interest in Italy.”(xxx) Leonardo was very interested in countries in the East, but never mentions the discovery of America.(xxxi) If he saw the letters from Giovanni of Empoli and Andrea Corsali then this map may have been used to illustrate their travels."}, {"t": "p", "x": "The above discussion indicates the following: The Marchionni family who ran a slave trading organization in Kaffa on the Black sea, may have sold Leonardo’s mother to his father. Bartolomeo Marchionni was a couple of years younger than Leonardo."}, {"t": "h2", "x": "African art and Portuguese trade"}, {"t": "table", "x": "", "head": ["Section", "Content", "Starting Row"], "rows": [["1", "Ife Brass Sculptures & African Renaissance Art", "11"], ["2", "Afro-Portuguese Ivory Trade", "128"]]}, {"t": "table", "x": "African art and Portuguese trade", "head": ["Head No.", "% Copper", "% Zinc", "% Lead", "% Tin", "% Iron", "Total"], "rows": [["1", "68.8", "11.6", "15.9", "0.9", "0.9", "98.1"], ["2", "71.2", "13.3", "11.8", "0.6", "0.7", "99.6"], ["7", "74", "15.3", "5.6", "1.2", "0.2", "96.3"], ["8", "71.8", "15", "11.1", "0.7", "0.6", "99.2"], ["9", "74.3", "9.6", "11.6", "1.3", "0.6", "99.2"], ["11", "74.1", "11.9", "11.3", "1.3", "0.8", "98.4"], ["12", "77.5", "9.3", "9.9", "1.1", "0.6", "98.4"], ["13", "73.4", "9.7", "14.5", "0", "0.9", "98.5"], ["14", "76.2", "11", "6.4", "1.7", "0.4", "98.6"], ["15", "79.8", "11.8", "4.4", "0.9", "0.6", "97.5"], ["16", "74.2", "12.3", "11", "1", "0.6", "99.1"], ["18", "73.4", "13.1", "11.4", "0.8", "0.6", "99.3"]]}, {"t": "table", "x": "African art and Portuguese trade", "head": ["Metal", "m.p. °C", "b.p. °C", "Density gm/cm3", "Source in Nature"], "rows": [["Copper", "1083", "2562", "8.92", "Free metal"], ["Zinc", "419.5", "907", "7.1", "Salts only"], ["Lead", "327.5", "1718", "11.3", "Free metal"], ["Brass", "900-940", "8.4-8.75", "–", ""]]}, {"t": "p", "x": "🌍 AFRICAN ART & PORTUGUESE TRADE CONNECTION Dr. Edith Sherwood's research on Ife brass sculptures, Afro-Portuguese ivories, and Renaissance connections §1. IFE BRASS SCULPTURES & AFRICAN RENAISSANCE ART Among the most famous of the West African brass sculptures are the eighteen naturalistic portrait heads discovered in Ife Nigeria, in 1938. Recently, an exhibit of these heads together with other brass, terracotta and stone artifacts from Ife, toured selected museums in the UK and USA(I). This exhibit caused many viewers to reconsider their opinion that African art is the work of a primitive people. These remarkable artifacts are equal in workmanship and artistry to sculpture made during the European Renaissance."}, {"t": "p", "x": "Ife tradition claims that brass casting began during the reign of the Oni Obalufon and that his craftsmen made the Obalufon mask(II). Archaeological excavations in Ife have not revealed any evidence of metal casting, not even the most primitive of metal objects. This has led to speculation among the African art historians as to the origin of the Ife heads. A number of theories have been advanced: Leo Frobenius, during an expedition to Nigeria from 1910-12, was shown the brass Olokun head, the Obalufon mask and various terracotta heads. He was astonished by the quality and artistry of the objects and questioned their African origin. He wondered whether he had found evidence of an African Atlantis(III)."}, {"t": "p", "x": "Frank Willett proposed that the Ife heads were used as funeral effigies for various deceased Onis of Ife, and were the product of different sculptors working over several centuries. This hypothesis is still accepted by many African art historians(IV). Kenneth Murray, suggested that “only one artist, working for a couple of years, made the majority of the heads.” His reason for this conclusion was based on the heads’ stylistic similarities(V). William Fagg pointed out that all the Ife heads had a couple of features in common; the mouth was displaced by about 6 millimeters from the midline of the face and the corners of each mouth ended in a depression or dimple. He considered that these “two artistic peculiarities are a mannerism of the artist rather than fidelity in portraiture.”"}, {"t": "p", "x": "Portraits painted by some Renaissance artists have the same artistic peculiarities(VI). Stefan Eisenhofer is of the opinion that the Ife heads can only be dated to some period before 1700 AD(VII). Thermoluminescent analysis of core samples taken from the interior of two of the heads gave the following approximate dates: 1440 +/-65 A.D and 1490 +/-85 A. D. possibly dating the Ife heads to the latter part of the 15th century(VIII). The Composition of the Heads The Ife heads fall into two groups; six were cast from almost pure copper (data not given), the remaining twelve from brass. Chemical analysis of the brass is presented in Table I(IX). The sample numbers are assigned by Underwood(X). Table I Composition of the Ife Brass Heads."}, {"t": "p", "x": "(Baker 1965) 1 | The analytical results do not add up to exactly 100%, indicating that some oxidation of the metal surface may have taken place. 2 | Head 7 contains 2.6% gold in addition to the other metals. Table II Physical Properties of the Metals 1 | Zinc, due to its low boiling point, is volatile and is readily oxidized to zinc oxide. The density of brass varies according to its composition. 2 | Zinc ores, although abundant in nature, only occur in the form of a salt like calamine (zinc carbonate). The free metal was isolated in Europe in the 18th century, but may have been made in India at an earlier date. 3 | Brass was fi
