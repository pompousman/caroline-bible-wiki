. It is named after the subcontinent of India (which in turn gets its name from the Indus River) because the ocean heavily surrounds and borders it. www.almanac.com Arctic Ocean: This name comes from the ancient Greek word arktikos, which means \"near the bear.\" oceanconservancy.org The \"bear\" in question isn't a polar bear, but rather the northern constellation Ursa Major (the Great Bear). Explorers used this constellation to locate Polaris, the North Star, to help them navigate the northern hemisphere. oceanconservancy.org+ 1 Ursa Major (The Great Bear). Source: Star Registration Southern Ocean: The newest ocean to be officially recognized (in 1999) has the most straightforward name."}, {"t": "p", "x": "It is named simply for its geographic location, completely surrounding the South Pole and Antarctica. www.almanac.com The \"Dry Sea\" of the Lost Ocean The dry sea you are thinking of is the Aral Sea, which has now largely become a newly formed desert known as the Aralkum Desert. westwards.de Where it is: It is located in Central Asia, situated directly across the border between Kazakhstan to the north and Uzbekistan to the south. www.volcanocafe.org Shipwrecks in the Aralkum Desert. Source: Mongabay India"}, {"t": "h2", "x": "Extinct oceans research"}, {"t": "p", "x": "What ocean no longer exist and why is it called what it’s called Throughout Earth's history, the continuous movement of tectonic plates has drastically reshaped the planet's surface, opening up new oceans and completely destroying old ones. Because of this, there are actually a few famous \"extinct\" oceans. Here are the three most well-known lost oceans, what happened to them, and how they got their names. The Tethys Ocean What it was: A massive body of water that existed during much of the Mesozoic Era (about 250 to 65 million years ago). It separated the ancient supercontinents of Laurasia in the north and Gondwana in the south. Why it no longer exists: As tectonic plates shifted, the African and Indian plates drifted northward and smashed into the Eurasian plate."}, {"t": "p", "x": "This massive, slow-motion collision essentially squeezed the ocean out of existence. The impact pushed the ancient sea floor up into the sky, creating the Himalayas and the Alps. Today, the Mediterranean, Black, and Caspian seas are the last remaining fragments of the Tethys. The name: In 1893, Austrian geologist Eduard Suess discovered evidence of this ancient sea and named it after Tethys, a sea goddess in Greek mythology. She was an aquatic Titan who was both the sister and wife of Oceanus (the god of the earth-encircling river). Panthalassa Supercontinent Pangaea with modern continental borders, Superocean Panthalassa, and Paleo-Tethys Ocean. Source: Getty Images Explore What it was:"}, {"t": "p", "x": "The vast, global \"superocean\" that completely surrounded the famous supercontinent Pangaea around 300 to 200 million years ago. Why it no longer exists: When Pangaea eventually broke apart, the newly formed continents drifted outward into Panthalassa, dividing it up and reshaping the globe. The modern Pacific Ocean is the central remnant of Panthalassa, while the Atlantic and Indian Oceans were formed in the new gaps created by the splitting landmasses. The name: The name is derived directly from ancient Greek. Pan means \"all,\" and thalassa means \"sea\" or \"ocean.\" It literally translates to \"all-sea,\" a perfect description for a single body of water that covered nearly 70% of the Earth's surface. The Iapetus Ocean What it was:"}, {"t": "p", "x": "An even older ocean that existed between 600 and 400 million years ago, situated between the ancient landmasses that would eventually become North America, Europe, and parts of Africa. Why it no longer exists: It closed up when these landmasses crashed together to form a new supercontinent, pushing up the Appalachian Mountains in the process. Millions of years later, when those landmasses split apart again, the rift created the modern Atlantic Ocean. The name: Because the Iapetus Ocean was situated geographically in the exact same place that the Atlantic Ocean is today, scientists looked to Greek mythology for a clever name. The Atlantic Ocean is named after the titan Atlas. In mythology, Iapetus was another Titan and the father of Atlas."}, {"t": "p", "x": "Therefore, the ancient \"father\" of the Atlantic Ocean was named after the father of Atlas. Interesting so what are all the oceans named after? I heard as a result of the lost ocean we also have a dry sea now. Where is that and what’s it called? The origins of our current ocean names are a mix of mythology, geography, and the personal experiences of early explorers. Here is how the five modern oceans got their names: Pacific Ocean: In 1520, Portuguese explorer Ferdinand Magellan navigated his fleet through the treacherous waters at the tip of South America. When he finally reached the vast ocean beyond, he found the waters incredibly calm and the winds favorable. He named it Mar Pacífico (Latin for \"peaceful sea\"). www.reddit.com+ 1 Atlantic Ocean:"}, {"t": "p", "x": "As mentioned with the Iapetus Ocean, this body of water is named after the Greek Titan Atlas, who was famously tasked with holding up the heavens. Early Greek poets referred to it as the \"Sea of Atlas.\" oceanconservancy.org Indian Ocean: This one is strictly geographic. It is named after the subcontinent of India (which in turn gets its name from the Indus River) because the ocean heavily surrounds and borders it. www.almanac.com Arctic Ocean: This name comes from the ancient Greek word arktikos, which means \"near the bear.\" oceanconservancy.org The \"bear\" in question isn't a polar bear, but rather the northern constellation Ursa Major (the Great Bear)."}, {"t": "p", "x": "Explorers used this constellation to locate Polaris, the North Star, to help them navigate the northern hemisphere. oceanconservancy.org+ 1 Ursa Major (The Great Bear). Source: Star Re nd D. Sinan in ‘The Hitherto Unpublished Columns of the Genesis Apocryphon’, Abr- Nabrain 33 (1995), 3—52. The beginning of the manuscript is missing."}, {"t": "p", "x": "But since the sheet starting with col. v is numbered by the Hebrew letter pe, col. x by sade, and col. XVII by qoph, i.e. the seventeenth, eighteenth and nineteenth letters of the Hebrew alphabet, it would seem that the surviving section was preceded by sixteen sheets of which only the end of the last one has been preserved (cf. M. Morgenstern, ‘A New Clue to the Original Length of the Genesis Apocryphon’, JJS 47/2 (1996), 345—7). If so, the story of Noah which begins the existing portion of the scroll must have been preceded by an extensive account of the creation, Adam and Eve, and the Genesis story up to Enoch and Noah."}, {"t": "p", "x": "Columns II—V narrate the miraculous birth of Noah (on Noah see also the minute fragments from 1Q19 and 19bis), whose father, Lamech, suspects that his wife has conceived by one of the fallen angels. Her denials fail to convince him and he asks his father, Methuselah, to travel to Paradise and obtain reassurance from his own father, Enoch. Columns VI—XV contain Noah’s first-person account of the Flood and of his journeys. Col. x describes Noah’s sacrifice after the Flood. Col. XI deals with the covenant between God and Noah with a mention of a ban on eating blood. Col. XII recounts the planting of a vineyard by Noah and his tasting of wine. The badly damaged cols. XIII—XV contain a vision concerning trees and its interpretation."}, {"t": "p", "x": "Two further columns (XVI— XVII) deal with the division of the earth among the sons of Noah. Col. XVIII is completely lost. Cols. XIX—XXII, corresponding to Gen. xii—xv, deal with Abraham’s journey to Egypt, his return to Canaan, the war against the invading Mesopotamian kings, and the renewal to him of a divine promise of a son. This lively and delightful narrative, largely devoid of sectarian bias, throws valuable light on inter-Testamental Bible interpretation. It is a mixture of Targum, Midrash, rewritten Bible and autobiography. Most scholars assign the manuscript to the late first century BCE or the first half of the first century CE. The composition itself is generally thought to originate from the second century BCE."}, {"t": "p", "x": "Its relationship to the mid-second-century Book of Jubilees is generally accepted, but views differ on whether it depends on Jubilees or vice versa. I slightly prefer the theory that in its pre- Qumran version the Genesis Apocryphon precedes Jubilees, which would postulate for the former a date at least as early as the first half of the second century BCE. ... II Behold, I thought then within my heart that conception was (due) to the Watchers and the Holy Ones... and to the Giants... and my heart was troubled within me because of this child. Then I, Lamech, approached Bathenosh [my] wife in haste and said to her, ‘... by the Most High, the Great Lord, the King of all the worlds and Ruler of the Sons of Heaven, until you tell me all things truthfully, if..."}, {"t": "p", "x": "Tell me [this truthfully] and not falsely... by the King of all the worlds until you tell me truthfully and not falsely.’ Then Bathenosh my wife spoke to me with much heat [and] ... said, ‘O my brother, O my lord, remember my pleasure... the lying together and my soul within its body. [And I tell you] all things truthfully.’ My heart was then greatly troubled within me, and when Bathenosh my wife saw that my countenance had changed... Then she mastered her anger and spoke to me saying, ‘O my lord, O my [brother, remember] my pleasure! I swear to you by the Holy Great One, the King of [the heavens] ... that this seed is yours and that [this] conception is from you."}, {"t": "p", "x": "This fruit was planted by you... and by no stranger or Watcher or Son of Heaven... [Why] is your countenance thus changed and dismayed, and why is your spirit thus distressed... I speak to you truthfully.’ Then I, Lamech, ran to Methuselah my father, and [I told] him all these things. [And I asked him to go to Enoch] his father for he would surely learn all things from him. For he was beloved, and he shared the lot [of the angels], who taught him all things. And when Methuselah heard [my words... he went to] Enoch his father to learn all things truthfully from him ... his will. He went at once to Parwain and he found him there... [and] he said to Enoch his father, ‘O my father, O my lord, to whom I... And I say to you, lest you be angry with me because I come here..."}, {"t": "p", "x": "VI [I abstained] from injustice and in the womb of her who conceived me I searched for truth. And when I emerged from my mother’s womb, I was planted for truth and I lived all my days in truth and walked in the paths of eternal truth. And the Holy One (was) with me ... on my pathways truth sped to warn me off the ... of lie which led to darkness ... and I girded my loins with the vision of truth and wisdom... paths of violence. vacat Then I, Noah, became a man and clung to truth and seized... and I took Amzara, his daughter as my wife. She conceived and bore me three sons [and daughters]."}, {"t": "p", "x": "Then I took wives for my sons from among my brother’s daughters, and I gave my daughters to my brother’s sons according to the law of the eternal precept which the Most High [ordained] to the sons of man. vacat And in my days, when according to my reckoning... ten jubilees had been completed, the (moment) came for my sons to take wives for themselves... heaven, I saw in a vision and was explained and made known the action of the sons of heaven and... the heavens. Then I hid this mystery in my heart and explained it to no man. vacat ... to me and a great and... and in a message of the Holy One... and he spoke to me in a vision and he stood before me ... ... and the message of the great Holy One called out to me:"}, {"t": "p", "x": "‘To you they say, O Noah, ...’ and I reckoned the whole conduct of the sons of the earth. I knew and explained all... two weeks. Then the blood which the Giants had spilled.... I was at ease and waited until... the holy ones with the daughters of man... [Then] I, Noah, found grace, greatness and truth ... ... till the gates of heaven... to men and cattle, and wild beasts and birds... VII ... on them; the earth and all that is on it, in the seas and on the mountains ... all the constellations of heaven, the sun, the moon and the stars and the Watchers... ... I shall reward you... vacat the great Holy One."}, {"t": "p", "x": "And I rejoiced in the words of the Lord of heaven and I shouted... it ... you all to your Master... the King of all the world for ever and ever until all eternity. vacat ... [until] the ark rested on one of the mountains of Ararat (HWRRT). And eternal fire... And I atoned for the whole earth, all of it. And the beginning of... and I burned the fat on the fire. Secondly, ... I poured out their blood on the base of the altar and I burned all their flesh on the altar. And thirdly the turtledoves... on the altar as an offering.... I put on it fine flour mixed with oil and with incense as a meal offering.... I put salt on all of them. And the smell of my offering rose up to heaven. vacat ..."}, {"t": "p", "x": "XI ... the mountains and the deserts... ... four... vacat [Then] I, Noah, went out and walked on the earth, through its length and breadth... delight on her in their leaves and in their fruit. And all the land was filled with grass and herbs and grain. Then I blessed the Lord of heaven who made splendid things. He is for ever and praise is his. And I repeated the blessing on account of his grace for the earth and on account of his removing and causing to perish from it all those who do violence and wickedness and lies and on account of his rescuing the righteous man ... vacat [God] was revealed to me and [the Lord] of heaven spoke to me and said to me: ‘Do not fear, Noah."}, {"t": "p", "x": "I shall be with you and with your sons who will be like you for ever... of the earth and rule over them... and over its deserts and its mountains and all that are on them. And behold, I give all of it to you and to your sons to eat the green things and the grass of the earth. But you shall not eat any blood. Your fear and awe... for ever.’... XII ... in the mountains of Ararat (HWRRT). And afterwards I descended... I and my sons and the sons [of my sons] ... for the destruction was great on the earth... after the Flood. To my first son [Shem] was born, to begin with, a son, Arpachshad, two years after the Flood. [And] all the sons of Shem, all of them, [were Ela]m, and Ashur, Arpachshad, Lud and Aram, and five daughters. [And the sons of Ham:"}, {"t": "p", "x": "Kush and Misrai]n and Put and Canaan, and seven daughters. And the sons of Japhet: Gomer and Magog and Media and Yavan [and Tu]bal and Mashok and Tiras, and four daughters. [And] I began, I and all my sons, to fill the land and I planted a big vineyard on Mount Lubar and in the fourth year it produced wine for me ... [And] when the first festival c[ame], on the first day of the first festival in the ... month... I opened this jar (?) and I began to drink on the first day of the fifth year ... On this day I summoned my sons, my grandsons and all our wives and their daughters, and we assembled together and we went... and I blessed the Lord of heaven, the Most High God, the Great Holy One who saved us from perdition..."}, {"t": "p", "x": "XIII... they were cuXIII... they were cutting gold and silver and stones and clay and taking part of them for themselves. I saw the gold and the silver ... iron, and they cut down every tree and took some for themselves. I saw the sun and the moon and the stars cutting and taking some for themselves. ... I turned to see the olive tree and behold, the olive tree was rising upwards and for many hours... many leaves... appeared in them. I observed this olive tree and beheld the abundance of its leaves... they tied to it. And I was greatly amazed by this olive tree and its leaves. I was amazed... the four winds of heaven were blowing powerfully and they damaged this olive tree, breaking off its branches and smashing them."}, {"t": "p", "x": "First [came] the westerly [wind] and struck it, and shook off its leaves and fruit, and scattered them in every direction. Then... XIV... listen and hear! You are the great cedar... standing before you in a dream on the top of mountains... ... truth. The willow that springs from it and rises towards the heights (these are) three sons... And that which you did see, (namely that) the first willow caught the stump of the cedar... and the wood from it ... will not separate from you all its days. And among its posterity... will be called... will spring a righteous plant... will stand for ever."}, {"t": "p", "x": "And that which you did see, (namely that) the willow caught the stump [of the cedar] ... ... the last willow... vacat... part of their branch entered (got entangled with?) the branch of the first (willow), two sons... And that which you did see, (namely that) part of their branch entered the branch of the first... I explained to him the mystery... XV ... And that you did see all of them ... they will go around, the majority of them will be wicked. And that which you did see, (namely that) a man came from the south of the land, with a sickle in his hand, and fire with him ... who will come from the south of the land ...And they will cast wickedness on the fire, all ... And he shall come between ... Four angels ... between all the nations.And all of them will worship and be confounded ..."}, {"t": "p", "x": "I will explain to you all, in truth. And thus it is written concerning you. And I, Noah, awoke from my sleep and the sun ... XVI ... until the river Tina ... and all the land of the north, all of it, until it reaches ... And this boundary passes by the waters of the Great Sea as f loud that night, I and my nephew Lot, because Sarai had been taken from me by force. I prayed that night and I begged and implored, and I said in my sorrow while my tears ran down: ‘Blessed art Thou, O Most High God, Lord of all the worlds, Thou who art Lord and king of all things and who rulest over all the kings of the earth and judgest them all! I cry now before Thee, my Lord, against Pharaoh of Zoan the king of Egypt, because of my wife who has been taken from me by force."}, {"t": "p", "x": "Judge him for me that I may see Thy mighty hand raised against him and against all his household, and that he may not be able to defile my wife this night (separating her) from me, and that they may know Thee, my Lord, that Thou art Lord of all the kings of the earth.’ And Iwept and was sorrowful. And during that night the Most High God sent a spirit to scourge him, an evil spirit to all his household; and it scourged him and all his household. And he was unable to approach her, and although he was with her for two years, he knew her not."}, {"t": "p", "x": "At the end of those two years the scourges and afflictions grew greater and more grievous upon him and all his household, so he sent for all [the sages] of Egypt, for all the magicians, together with all the healers of Egypt, that they might heal him and all his household of this scourge. But not one healer or magician or sage could stay to cure him, for the spirit scourged them all and they fled. Then Harkenosh came to me, beseeching me to go to the king and to pray for him and to lay my hands upon him that he might live, for the king had dreamt a dream ... But Lot said to him, ‘Abram my uncle cannot pray for the king while Sarai his wife is with him. Go, therefore, and tell the king to restore his wife to her husband; then he will pray for him and he shall live.’"}, {"t": "p", "x": "When Harkenosh had heard the words of Lot, he went to the king and said, ‘All these scourges and afflictions with which my lord the king tain of Bethel and it grieved me that my nephew Lot had departed from me."}, {"t": "p", "x": "And God appeared to me in a vision at night and said to me, ‘Go to Ramath Hazor which is north of Bethel, the place where you dwell, and lift up your eyes and look to the east and to the west and to the south and to the north; and behold all this land which I give to you and your seed for ever.’ The next morning, I went up to Ramath Hazor and from that high place I beheld the land from the River of Egypt to Lebanon and Senir, and from the Great Sea to Hauran, and all the land of Gebal as far as Kadesh, and all the Great Desert to the east of Hauran and Senir as far as the Euphrates. And He said to me, ‘I will give all this land to your seed and they shall possess it for ever."}, {"t": "p", "x": "And I will multiply your seed like the dust of the earth which no man can number; neither shall any man number your seed. Rise and go! Behold the length and breadth of the land, for it is yours; and after you, Iwill give it to your seed for ever.’ And I, Abram, departed to travel about and see the land. I began my journey at the river Gihon and travelled along the coast of the Sea until I came to the Mountain of the Bull (Taurus). Then I travelled from the coast of the Great Salt Sea and journeyed towards the east by the Mountain of the Bull, across the breadth of the land, until I came to the river Euphrates."}, {"t": "p", "x": "I journeyed along the Euphrates until I came to the Red Sea (Persian Gulf) in the east, and I travelled along the coast of the Red Sea until I came to the tongue of the Sea of Reeds (the modern Red Sea) which flows out from the Red Sea. Then I pursued my way in the south until I came to the river Gihon, and returning, I came to my house in peace and found all things prosperous there. Iwent to dwell at the Oaks of Mamre, which is at Hebron, north-east of Hebron; and I built an altar there, and laid on it a sacrifice and an oblation to the Most High God."}, {"t": "p", "x": "I ate and drank there, I and all the men of my household, and I sent for Mamre, Ornam and Eshkol, the three Amorite brothers, my friends, and they ate and drank with me.Before these days, Kedorlaomer king of Elam had set out with Amrafel king of Babylon, Ariok king of Kaptok, and Tidal king of the nations which lie between the rivers; and they had waged war against Bera king of Sodom, Birsha king of Gomorrah, Shinab king of Admah, Shemiabad king of Zeboim, and against the king of Bela. All these had made ready for battle in the valley of Siddim, and the king of Elam and the other kings with him had prevailed over the king of Sodom and his companions and had imposed a tribute upon them."}, {"t": "p", "x": "For twelve years they had paid their tribute to the king of Elam, but in the thirteenth year they rebelled against him. And in the fourteenth year, the king of Elam placed himself at the head of all his allies and went up by the Way of the Wilderness; and they smote and pillaged from the river Euphrates onward. They smote the Refaim who were atAshteroth Karnaim, the Zumzamim who were at Ammon, the Emim [who were at] Shaveh ha-Keriyyoth, and the Horites who were in the mountains of Gebal, until they came to El Paran which is in the Wilderness. And they returned ... at Hazazon Tamar."}, {"t": "p", "x": "The king of Sodom went out to meet them, together with the king [of Gomorrah], the king of Admah, the king of Zeboim, and the king of Bela, [and they fought] a battle in the valley [of Siddim] against Kedorlaomer [king of Elam and the kings] who were with him. But the king of Sodom was vanquished and fled, and the king of Gomorrah fell into the pits ... [And] the king of Elam [carried off] all the riches of Sodom and [Gomorrah] ... and they took Lot the nephew XXII ofAbram who dwelt with them in Sodom, together with all his possessions. Now one of the shepherds of the flocks which Abram had given to Lot escaped from captivity and came to Abram; at that u may have all the possessions.’ Then said Abram to the king of Sodom, ‘I raise my hand this day to the Most High God, Lord of heaven and earth! I will take nothing of yours, not even a shoe-lace or shoe-strap, lest you say, Abram’s riches come from my possessions!"}, {"t": "p", "x": "Iwill take nothing but that which the young men with me have eaten already, and the portion of the three men who have come with me. They shall decide whether they will give you their portion.’ And Abram returned all the possessions and all the captives and gave them to the king of Sodom; he freed all the capticaptives from this land who were with him, and sent them all back. After these things, God appeared to Abram in a vision and said to him, ‘Behold, ten years have passed since you departed from Haran. For two years you dwelt here and you spent seven years in Egypt, and one year has passed since you returned from Egypt. And now examine and count all you have, and see how it has grown to be double that which came out with you from Haran."}, {"t": "p", "x": "And now do not fear, I am with you; I am your help and your strength. I am a shield above you and a mighty safeguard round about you. Your wealth and possessions shall multiply greatly.’ But Abram said, ‘My Lord God, I have great wealth and possessions but what good shall they do to me? I shall die naked; childless shall I go hence. A child from my household shall inherit from me. Eliezer son ... shall inherit from me.’ And He said to him, ‘He shall not be your heir, but one who shall spring [from your body shall inherit from you].’"}, {"t": "h2", "x": "Jubilees chronology"}, {"t": "table", "x": "", "head": ["", "", "Year"], "rows": [["1", "And Noah made the ark in all respects as He commanded him, in the twenty-seventh jubilee of years, in the fifth week in the fifth year (on the new moon of the first month). [1307 A.M.]", "1307"], ["2", "And he entered in the sixth (year) thereof, [1308 A.M.] in the second month, on the new moon The conquering force; transition of power", "Era: Transitional"], ["Geopolitical", "Macedonia", "Represented by the \"Goat\" (Alexander the Great)", "Era: Hellenistic"], ["Geopolitical", "Rome", "The final, \"lawless\" beast; the ultimate oppressor", "Era: Final/Apocalyptic"], ["Zoomorphic", "Lion/Wolf", "Predators; symbols of destructive empire/power", "Symbolism: Predatory"], ["Zoomorphic", "Eagle", "Speed, far-reaching dominion, often Roman legions", "Symbolism: Dominion"], ["Zoomorphic", "Dragon", "Chaos, Satanic influence, or anti-divine forces", "Symbolism: Subversive"], ["Zoomorphic", "Sheep/Lambs", "The pious, the faithful, or the \"flock\"", "Symbolism: Vulnerable"]]}, {"t": "table", "x": "Sibylline Oracles", "head": ["Sibylline Theme", "Master Matrix \"Data Tag\"", "Project Integration"], "rows": [["Generational Cycles", "Timeline_Era_ID", "Use this to map historical \"Eras\" in your data."], ["Cataclysmic Signs", "Prophetic_Indicator", "A boolean column (True/False) for events that mirror Sibylline warnings."]]}, {"t": "p", "x": "I just skimmed quickly the sublime oracles. It has so much of what I’m tracking who wrote it and when. Is there any referent of it from the Bible It sounds like you are likely referring to the Sibylline Oracles, a fascinating and complex collection of ancient texts that often gets grouped alongside the other \"lost\" or non-canonical works you are tracking in your Master Matrix. Because the name \"Sublime Oracles\" is not a standard title in historical or biblical studies, it is very common for it to be a misremembered reference to the Sibylline Oracles—especially given how closely they parallel the apocalyptic and prophetic themes found in 1 Enoch and other pseudepigraphical works you are analyzing. Who Wrote Them and When?"}, {"t": "p", "x": "The Sibylline Oracles are not the work of a single author; they are pseudepigraphical, meaning they were written by various anonymous authors over many centuries, who attributed their writings to the ancient Greek prophetesses known as \"Sibyls\". The Origin: The practice of writing these oracles began with Hellenistic Jews in Alexandria around the 2nd century BCE. The Evolution: This tradition was later adopted and expanded by early Christians who wanted to use the \"prophetic\" authority of the Sibyls to validate their own message to the Greco-Roman world. The Timeline: The surviving collection spans roughly 1,000 years, from the 2nd century BCE to the 7th century CE. Are There Biblical Referents? To be clear: The Sibylline Oracles are not part of the Bible."}, {"t": "p", "x": "They are not considered canonical scripture by any major denomination. However, they share a deep, complex relationship with biblical traditions: Thematic Parallels: They borrow heavily from the Hebrew Bible and the New Testament. You will find descriptions of the Creation, the Flood (often blended with Greek myths), and the coming of a Messianic figure—elements that mirror the apocalyptic imagery in the Book of Revelation and the prophetic books of the Old Testament. Early Church Usage: While not \"scripture,\" early Church Fathers (such as Justin Martyr and Clement of Alexandria) were well aware of them."}, {"t": "p", "x": "They sometimes cited them in their writings, treating them almost as a \"pagan witness\" to the truth of God—an attempt to show that even ancient, non-Jewish cultures had glimpses of divine truth. The \"Co-production\" of Theology: These texts act as a historical bridge. Jewish authors used them to express their identity in a Greek world, and Christians later used them to articulate their faith as a universal religion. How This Fits Your Project If you are adding these to your \"Master Matrix,\" they serve as an excellent \"validation\" layer. Because they were written by multiple authors over centuries, they track the evolution of how these ancient traditions were understood—shifting from Jewish Messianic expectations to Christian fulfillment narratives."}, {"t": "p", "x": "Since you are already tracking Enoch and the 70 princes, the Sibylline Oracles provide a unique \"outside\" perspective that confirms how widespread these apocalyptic ideas were during the intertestamental and early Christian periods. Follow-up: Now that we have clarified the origins of these texts, would you like to build a data schema for them to integrate into your Master Matrix, or should we focus on reconciling your current Voynich/Enoch data first? Interesting. Yes that’s the book. Autocorrect happened when I first wrote it. Thank you so much for the background. So I heard about all the animals. And I also heard about countries. Can you map this out as I would like to do that? Ty It is excellent that you are digging into the specific imagery."}, {"t": "p", "x": "In the Sibylline Oracles, \"animals\" and \"countries\" are rarely mentioned just for the sake of description; they are the primary visual language for Apocalyptic Geopolitics. The authors used these symbols to encode the rise and fall of empires, mapping the historical timeline onto a theological framework. To integrate this into your Master Matrix, you should treat these as \"Symbolic Variables.\" I have mapped the recurring geopolitical entities and the common zoomorphic (animal) archetypes found in the Sibylline Oracles and their related apocalyptic counterparts below. Sibylline Apocalyptic Data Schema You can add this structure to your Excel master file under a new tab or as additional columns in your \"Master Matrix\" sheet."}, {"t": "p", "x": "Integration Strategy for Your Project To handle this in your codebase and Excel document: Add a \"Symbolism\" Column: In your Excel Master Matrix, add a column labeled Apocalyptic_Symbolism . Map every entry (e.g., Rome) to its corresponding zoomorphic archetype (e.g., The Beast/Eagle). Filter by \"Eras\": The Sibylline Oracles are obsessed with the \"Ten Generations\" framework. You should add a column Oracle_Timeline_Era to your data to align your 310 traditions with these specific historical-prophetic windows. Visualization (React): If you are building a graph or network map in your app, you can use these \"Animals\" as Node Labels or Category Icons."}, {"t": "p", "x": "For example, any country categorized as \"Rome\" or \"Hellenistic\" could be visually tagged with the corresponding animal icon you've defined in your schema. This approach transforms the \"lost\" text into a structured data layer that can be queried alongside your DNA and Wonders datasets. Follow-up: Now that you have this mapping, would you like me to help you draft the JSON schema for this \"Symbolism\" data so you can cleanly import it into your React components without further hardcoding? Not yet. Thank you so much so I also heard Benjamin and the wolf. So I was listening to an audio track, but I fell asleep too much of it. What else is in there?"}, {"t": "p", "x": "It is completely understandable that you drifted off—these ancient texts are dense, rhythmic, and often intentionally repetitive, which can be mesmerizing (and sleep-inducing!) when listening to audio. The \"Benjamin and the Wolf\" reference you likely heard is a fascinating intersection point. While the Sibylline Oracles use the \"wolf\" as a central image for predatory empires, the specific phrase \"Benjamin is a ravenous wolf\" is a famous biblical reference from the Blessing of Jacob in Genesis 49:27. In apocalyptic study, lecturers often bridge these two because the Sibylline Oracles heavily utilize biblical \"types\" to describe future events. Here is the distinction and a breakdown of what you likely missed in your audio track. 1. Clarifying \"Benjamin and the Wolf\" The Biblical Context:"}, {"t": "p", "x": "The reference to Benjamin as a \"ravenous wolf\" describes the tribe's martial prowess and history of conflict. The Sibylline Context: The Sibylline Oracles adopt this \"predatory\" language, but they broaden it to describe entire nations. When you hear \"wolf\" in the Oracles, the author is rarely talking about the Tribe of Benjamin; they are almost exclusively identifying a hostile empire (often Rome or an oppressive eastern power) that acts with the same \"devouring\" nature. 2. \"What Else Is In There?\" (The Missing Themes) If you fell asleep, you likely missed the broader \"Apocalyptic Arc\" that the Sibyls describe. These texts are structured as a historical roadmap that aims to convince the reader that the end is near. Here are the core pillars that define the rest of the content:"}, {"t": "p", "x": "The Ten Generations (The \"Timeline Era\"): The Sibylline Oracles are famous for dividing world history into distinct chronological periods. You likely missed the section detailing these \"generations,\" which categorize civilizations from the creation to the final judgment. The \"Messianic\" Coming: A significant portion of the text is dedicated to the arrival of a divine/messianic figure who defeats the \"dragons\" and \"wolves\" (the empires). This is the \"resolution\" to the geopolitical chaos they describe. Cataclysmic Signs: The authors list specific, terrifying signs that precede the end of an age: earthquakes, famine, the sea drying up, and celestial disturbances (the sun and moon failing). The \"Pagan Witness\" Defense:"}, {"t": "p", "x": "The Oracles frequently argue that even the Greek gods and ancient sages knew the truth about the one Creator. They use this to \"validate\" their apocalyptic claims to non-Jewish or non-Christian audiences. 3. Adding This to Your Master Matrix To capture these themes without manually re-listening to the audio, you can categorize them into your project framework as follows:"}, {"t": "h2", "x": "Summary: Sibylline oracles"}, {"t": "table", "x": "", "head": ["DANIEL 7 BEASTS = EMPIRES", "TRIBAL ANIMAL TOTEMS", "MESSIANIC TRANSFORMATION"], "rows": [["LION with Eagle Wings = Babylon", "BENJAMIN = Wolf (Gen 49:27)", "Isaiah 11:6-8 Prophecy:"]]}, {"t": "p", "x": "SIB 8."}, {"t": "p", "x": "Every particular Man of each Company, to take the same Chapter or Chapters, and having translated or amended them severally by himself, where he thinketh good, all to meet together, confer what they have done, and agree for their Parts what shall stand. 9. As any one Company hath dispatched any one Book in this Manner they shall send it to the rest, to be consider'd of seriously and judiciously, for His Majesty is very careful in this Point. 10. If any Company, upon the Review of the Book so sent, doubt or differ upon any Place, to send them Word thereof; note the Place, and withal send the Reasons, to which if they consent not, the Difference to be compounded at the General Meeting, which is to be of the chief Persons of each Company, at the end of the Work. 11."}, {"t": "p", "x": "When any Place of special Obscurity is doubted of, Letters to be directed by Authority, to send to any Learned Man in the Land, for his Judgement of such a Place. 12. Letters to be sent from every Bishop to the rest of his Clergy, admonishing them of this Translation in hand; and to move and charge as many as being skilful in the Tongues; and having taken Pains in that kind, to send his particular Observations to the Company, either at Westminster, Cambridge, or Oxford. 13. The Directors in each Company, to be the Deans of Westminster and Chester for that Place; and the King's Professors in the Hebrew or Greek in either University. 14. These translations to be used when they agree better with the Text than the Bishops Bible: Tyndale's, Matthew's, Coverdale's, Whitchurch's, Geneva. 15."}, {"t": "p", "x": "Besides the said Directors before mentioned, three or four of the most Ancient and Grave Divines, in either of the Universities, not employed in Translating, to be assigned by the vice-Chancellor, upon Conference with the rest of the Heads, to be Overseers of the Translations as well Hebrew as Greek, for the better Observation of the 4th Rule above specified. Look
