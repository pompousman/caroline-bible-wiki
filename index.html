ars and the Coming Nova Event"}, {"t": "h2", "x": "Related notes"}, {"t": "li", "x": "[[24 Watchers Enoch and the Seventy Princes]]"}], "words": 10147}, "master-ancient-texts": {"title": "Ancient Texts and Translations", "section": "Master Matrix", "sub": "DSS, Jubilees, Sibyllines, NETS extracts, KJV rules", "body": [{"t": "h2", "x": "Dead Sea Scrolls inventory"}, {"t": "p", "x": "The Genesis Apocryphon (IQapGen, IQ20) Found in Cave 1, and partly published by N. Avigad and Y. Yadin (A Genesis Apocryphon,Jerusalem, 1956), IQapGen is an incomplete manuscript with twenty-two surviving columns of Aramaic text (cf. also IQ20). Remains of a further column, ‘The Genesis Apocryphon Col. XII’, have since been edited by J. C. Green field and E. Qimron (Studies in Qumran Aramaic, Abr-Nabrain, Suppl. 3 (1992), 70-77). A preliminary transcription and translation of the rest of the unpublished material, deciphered with the help of advanced infra-red technology, has been issued by M. Morgenstern, E."}, {"t": "p", "x": "Qimron and D. Sinan in ‘The Hitherto Unpublished Columns of the Genesis Apocryphon’, Abr Nabrain 33 (1995), 3—52. The beginning of the manuscript is missing. But since the sheet starting with col. v is numbered by the Hebrew letter pe, col. x by sade, and col. XVII by qoph, i.e. the seventeenth, eighteenth and nineteenth letters of the Hebrew alphabet, it would seem that the surviving section was preceded by sixteen sheets of which only the end of the last one has been preserved (cf. M. Morgenstern, ‘A New Clue to the Original Length of the Genesis Apocryphon’, JJS 47/2 (1996), 345—7)."}, {"t": "p", "x": "If so, the story of Noah which begins the existing portion of the scroll must have been preceded by an extensive account of the creation, Adam and Eve, and the Genesis story up to Enoch and Noah. Columns II—V narrate the miraculous birth of Noah (on Noah see also the minute fragments from 1Q19 and 19bis), whose father, Lamech, suspects that his wife has conceived by one of the fallen angels. Her denials fail to convince him and he asks his father, Methuselah, to travel to Paradise and obtain reassurance from his own father, Enoch. Columns VI—XV contain Noah’s first-person account of the Flood and of his journeys."}, {"t": "p", "x": "Col. x describes Noah’s sacrifice after the Flood. Col. XI deals with the covenant between God and Noah with a mention of a ban on eating blood. Col. XII recounts the planting of a vineyard by Noah and his tasting of wine. The badly damaged cols. XIII—XV contain a vision concerning trees and its interpretation. Two further columns (XVI— XVII) deal with the division of the earth among the sons of Noah. Col. XVIII is completely lost. Cols."}, {"t": "p", "x": "XIX—XXII, corresponding to Gen. xii—xv, deal with Abraham’s journey to Egypt, his return to Canaan, the war against the invading Mesopotamian kings, and the renewal to him of a divine promise of a son. This lively and delightful narrative, largely devoid of sectarian bias, throws valuable light on inter-Testamental Bible interpretation. It is a mixture of Targum, Midrash, rewritten Bible and autobiography. Most scholars assign the manuscript to the late first century BCE or the first half of the first century CE. The composition itself is generally thought to originate from the second century BCE."}, {"t": "p", "x": "Its relationship to the mid-second-century Book of Jubilees is generally accepted, but views differ on whether it depends on Jubilees or vice versa. I slightly prefer the theory that in its Qumran version the Genesis Apocryphon precedes Jubilees, which would postulate for the former a date at least as early as the first half of the second century BCE.... II Behold, I thought then within my heart that conception was (due) to the Watchers and the Holy Ones... and to the Giants... and my heart was troubled within me because of this child."}, {"t": "p", "x": "Then I, Lamech, approached Bathenosh [my] wife in haste and said to her, ‘... by the Most High, the Great Lord, the King of all the worlds and Ruler of the Sons of Heaven, until you tell me all things truthfully, if... Tell me [this truthfully] and not falsely... by the King of all the worlds until you tell me truthfully and not falsely.’ Then Bathenosh my wife spoke to me with much heat [and]... said, ‘O my brother, O my lord, remember my pleasure... the lying together and my soul within its body. [And I tell you] all things truthfully.’"}, {"t": "p", "x": "My heart was then greatly troubled within me, and when Bathenosh my wife saw that my countenance had changed... Then she mastered her anger and spoke to me saying, ‘O my lord, O my [brother, remember] my pleasure! I swear to you by the Holy Great One, the King of [the heavens]... that this seed is yours and that [this] conception is from you. This fruit was planted by you... and by no stranger or Watcher or Son of Heaven... [Why] is your countenance thus changed and dismayed, and why is your spirit thus distressed... I speak to you truthfully.’"}, {"t": "p", "x": "Then I, Lamech, ran to Methuselah my father, and [I told] him all these things. [And I asked him to go to Enoch] his father for he would surely learn all things from him. For he was beloved, and he shared the lot [of the angels], who taught him all things. And when Methuselah heard [my words... he went to] Enoch his father to learn all things truthfully from him... his will. He went at once to Parwain and he found him there... [and] he said to Enoch his father, ‘O my father, O my lord, to whom I... And I say to you, lest you be angry with me because I come here..."}, {"t": "p", "x": "VI [I abstained] from injustice and in the womb of her who conceived me I searched for truth. And when I emerged from my mother’s womb, I was planted for truth and I lived all my days in truth and walked in the paths of eternal truth. And the Holy One (was) with me... on my pathways truth sped to warn me off the... of lie which led to darkness... and I girded my loins with the vision of truth and wisdom... paths of violence. vacat Then I, Noah, became a man and clung to truth and seized... and I took Amzara, his daughter as my wife. She conceived and bore me three sons [and daughters]."}, {"t": "p", "x": "Then I took wives for my sons from among my brother’s daughters, and I gave my daughters to my brother’s sons according to the law of the eternal precept which the Most High [ordained] to the sons of man. vacat And in my days, when according to my reckoning... ten jubilees had been completed, the (moment) came for my sons to take wives for themselves... heaven, I saw in a vision and was explained and made known the action of the sons of heaven and... the heavens."}, {"t": "p", "x": "Then I hid this mystery in my heart and explained it to no man. vacat... to me and a great and... and in a message of the Holy One... and he spoke to me in a vision and he stood before me...... and the message of the great Holy One called out to me: ‘To you they say, O Noah,...’ and I reckoned the whole conduct of the sons of the earth. I knew and explained all... two weeks. Then the blood which the Giants had spilled...."}, {"t": "p", "x": "I was at ease and waited until... the holy ones with the daughters of man... [Then] I, Noah, found grace, greatness and truth...... till the gates of heaven... to men and cattle, and wild beasts and birds... VII... on them; the earth and all that is on it, in the seas and on the mountains... all the constellations of heaven, the sun, the moon and the stars and the Watchers...... I shall reward you... vacat the great Holy One."}, {"t": "p", "x": "And I rejoiced in the words of the Lord of heaven and I shouted... it... you all to your Master... the King of all the world forever and ever until all eternity. vacat... [until] the ark rested on one of the mountains of Ararat (HWRRT). And eternal fire... And I atoned for the whole earth, all of it. And the beginning of... and I burned the fat on the fire. Secondly,... I poured out their blood on the base of the altar and I burned all their flesh on the altar. And thirdly the turtledoves... on the altar as an offering.... I put on it fine flour mixed with oil and with incense as a meal offering...."}, {"t": "p", "x": "I put salt on all of them. And the smell of my offering rose up to heaven. vacat... XI... the mountains and the deserts...... four... vacat [Then] I, Noah, went out and walked on the earth, through its length and breadth... delight on her in their leaves and in their fruit. And all the land was filled with grass and herbs and grain. Then I blessed the Lord of heaven who made splendid things. He is forever and praise is his."}, {"t": "p", "x": "And I repeated the blessing on account of his grace for the earth and on account of his removing and causing to perish from it all those who do violence and wickedness and lies and on account of his rescuing the righteous man... vacat [God] was revealed to me and [the Lord] of heaven spoke to me and said to me: ‘Do not fear, Noah. I shall be with you and with your sons who will be like you forever... of the earth and rule over them... and over its deserts and its mountains and all that are on them. And behold, I give all of it to you and to your sons to eat the green things and the grass of the earth."}, {"t": "p", "x": "But you shall not eat any blood. Your fear and awe... forever.’... XII... in the mountains of Ararat (HWRRT). And afterwards I descended... I and my sons and the sons [of my sons]... for the destruction was great on the earth... after the Flood. To my first son [Shem] was born, to begin with, a son, Arpachshad, two years after the Flood. [And] all the sons of Shem, all of them, [were Ela]m, and Ashur, Arpachshad, Lud and Aram, and five daughters. [And the sons of Ham: Kush and Misrai]n and Put and Canaan, and seven daughters. And the sons of Japhet:"}, {"t": "p", "x": "Gomer and Magog and Media and Yavan [and Tu]bal and Mashok and Tiras, and four daughters. [And] I began, I and all my sons, to fill the land and I planted a big vineyard on Mount Lubar and in the fourth year it produced wine for me... [And] when the first festival c[ame], on the first day of the first festival in the... month... I opened this jar (?) and I began to drink on the first day of the fifth year..."}, {"t": "p", "x": "On this day I summoned my sons, my grandsons and all our wives and their daughters, and we assembled together and we went... and I blessed the Lord of heaven, the Most High God, the Great Holy One who saved us from perdition... XIII... they were cuXIII... they were cutting gold and silver and stones and clay and taking part of them for themselves. I saw the gold and the silver... iron, and they cut down every tree and took some for themselves. I saw the sun and the moon and the stars cutting and taking some for themselves...."}, {"t": "p", "x": "I turned to see the olive tree and behold, the olive tree was rising upwards and for many hours... many leaves... appeared in them. I observed this olive tree and beheld the abundance of its leaves... they tied to it. And I was greatly amazed by this olive tree and its leaves. I was amazed... the four winds of heaven were blowing powerfully and they damaged this olive tree, breaking off its branches and smashing them. First [came] the westerly [wind] and struck it, and shook off its leaves and fruit, and scattered them in every direction. Then... XIV... listen and hear!"}, {"t": "p", "x": "You are the great cedar... standing before you in a dream on the top of mountains...... truth. The willow that springs from it and rises towards the heights (these are) three sons... And that which you did see, (namely that) the first willow caught the stump of the cedar... and the wood from it... will not separate from you all its days. And among its posterity... will be called... will spring a righteous plant... will stand forever."}, {"t": "p", "x": "And that which you did see, (namely that) the willow caught the stump [of the cedar]...... the last willow... vacat... part of their branch entered (got entangled with?) the branch of the first (willow), two sons... And that which you did see, (namely that) part of their branch entered the branch of the first... I explained to him the mystery... XV... And that you did see all of them... they will go around, the majority of them will be wicked."}, {"t": "p", "x": "And that which you did see, (namely that) a man came from the south of the land, with a sickle in his hand, and fire with him... who will come from the south of the land...And they will cast wickedness on the fire, all... And he shall come between... Four angels... between all the nations.And all of them will worship and be confounded... I will explain to you all, in truth. And thus it is written concerning you. And I, Noah, awoke from my sleep and the sun... XVI... until the river Tina... and all the land of the north, all of it, until it reaches..."}, {"t": "p", "x": "And this boundary passes by the waters of the Great Sea as far as... divided by lot to Japhet and his sons to inherit as an eternal inheritance. vacat The second lot came to Shem to inherit, he and his sons, as an eternal inheritance... the waters of the river Tina... as far as the river Tina... to the great Sea of Salt. And this boundary goes as a spring from this bay... to the east XVII...And Shem, my son, divided (his inheritance) among his sons."}, {"t": "p", "x": "And the first (lot) fell to Elam in the north, by the waters of the river Tigris as far as the Red Sea, whose source is in the north, and it turns to the west to Assyria as far as the Tigris..."}, {"t": "p", "x": "And after it to Aram, the land between the two rivers, as far as the top of the mountain of Ashur... [To]... fell this Mount of the Ox and the portion stretched and went westwards as far as Magog... east in the north... this bay which is at the head of three portions by this sea to Arpachshad to the boundary that turns towards the south, all the land watered by the Euphrates, and all... all the valleys and plains that are between them, and the island that is in the middle of the bay... to the sons of Gomer... and Amana as far as the Euphrates... the portion that his father Noah divided and gave him. vacat Japhet divided (his inheritance) between his sons."}, {"t": "p", "x": "He gave the first (lot) to Gomer in the north as far as the river Tina, and afterwards to Magog, and afterwards to Media, and afterwards to Yavan (the Greeks), all the islands that are by Lydia. And (the lot) which is between the bay of Lydia and the second bay, (he gave) to Tubal... in the land. And to Meshek the sea... to Tiras... which is by the portion of the sons of Ham... vacat... XVIII... XIX... And I said, ‘Thou art...’...‘... until now you have not come to the Holy Mountain.’"}, {"t": "p", "x": "And I (Abram) departed... and I travelled towards the south... until I came to Hebron [at the time when Hebron] was being built; and I dwelt there [two years]. Now there was famine in all this land, and hearing that there was prosperity in Egypt I went... to the land of Egypt... I [came to] the river Karmon, one of the branches of the River (Nile)... and I crossed the seven branches of the River... We passed through our land and entered the land of the sons of Ham, the land of Egypt."}, {"t": "p", "x": "And on the night of our entry into Egypt, I, Abram, dreamt a dream; [and behold], I saw in my dream a cedar tree and a palm tree... men came and they sought to cut down the cedar tree and to pull up its roots, leaving the palm tree (standing) alone. But the palm tree cried out saying, ‘Do not cut down this cedar tree, for cursed be he who shall fell [it].’ And the cedar tree was spared because of the palm tree and [was] not felled. And during the night I woke from my dream, and I said to Sarai my wife, ‘I have dreamt a dream... [and I am] fearful [because of] this dream.’"}, {"t": "p", "x": "She said to me, ‘Tell me your dream that I may know it.’ So I began to tell her this dream... [the interpretation] of the dream...‘... that they will seek to kill me, but will spare you... [Say to them] of me, “He is my brother”, and because of you I shall live, and because of you my life shall be saved... ’ And Sarai wept that night on account of my words... Then we journeyed towards Zoan, I and Sarai... by her life that none should see her..."}, {"t": "p", "x": "And when those five years had passed, three men from among the princes of Egypt [came at the command] of Pharaoh of Zoan to inquire after [my] business and after my wife and they gave... goodness, wisdom, and truth. And I exclaimed before them... because of the famine... And they came to ascertain... with much food and drink... the wine... (During the party, the Egyptians must have seen Sarai, and on their return they praised her to the king.) XX...‘... and beautiful is her face! Hfrom her, and I, Abram, was spared because of her and Iwas not slain."}, {"t": "p", "x": "And I, Abram, wept aloud that night, I and my nephew Lot, because Sarai had been taken from me by force. I prayed that night and I begged and implored, and I said in my sorrow while my tears ran down: ‘Blessed art Thou, O Most High God, Lord of all the worlds, Thou who art Lord and king of all things and who rulest over all the kings of the earth and judgest them all! I cry now before Thee, my Lord, against Pharaoh of Zoan the king of Egypt, because of my wife who has been taken from me by force."}, {"t": "p", "x": "Judge him for me that I may see Thy mighty hand raised against him and against all his household, and that he may not be able to defile my wife this night (separating her) from me, and that they may know Thee, my Lord, that Thou art Lord of all the kings of the earth.’ And Iwept and was sorrowful. And during that night the Most High Godsent a spirit to scourge him, an evil spirit to all his household; and it scourged him and all his household. And he was unable to approach her, and although he was with her for two years, he knew her not."}, {"t": "p", "x": "At the end of those two years the scourges and afflictions grew greater and more grievous upon him and all his household, so he sent for all [the sages] of Egypt, for all the magicians, together with all the healers of Egypt, that they might heal him and all his household of this scourge. But not one healer or magician or sage could stay to cure him, for the spirit scourged them all and they fled. Then Harkenosh came to me, beseeching me to go to the king and to pray for him and to lay my hands upon him that he might live, for the king had dreamt a dream..."}, {"t": "p", "x": "But Lot said to him, ‘Abram my uncle cannot pray for the king while Sarai his wife is with him. Go, therefore, and tell the king to restore his wife to her husband; then he will pray for him and he shall live.’ When Harkenosh had heard the words of Lot, he went to the king and said, ‘All these scourges and afflictions with which my lord the king is scourged and afflicted are because of Sarai the wife of Abram. Let Sarai be restored to Abram her husband, and this scourge and the spirit of festering shall vanish from you.’ And he called me and said, ‘What have you done to me with regard to [Sarai]?"}, {"t": "p", "x": "You said to me, She is my sister, whereas she is your wife; and I took her to be my wife. Behold your wife who is with me; depart and go hence from all the land of Egypt! And now pray for me and my house that this evil spirit may be expelled from it.’ So I prayed [for him]... and I laid my hands on his [head]; and the scourge departed from him and the evil [spirit] was expelled [from him], and he lived. And the king rose to tell me... and the king swore an oath to me that... and the king gave her much [silver and gold] and much raiment of fine linen and purple..."}, {"t": "p", "x": "And Hagar also... and he appointed men to lead [me] out [of all the land of Egypt]. And I, Abram, departed with very great flocks and with silver and gold, and I went up from [Egypt] together with my nephew [Lot]. Lot had great flocks also, and he took a wife for himself from among [the daughters of Egypt. I pitched my camp] XXI [in] every place in which I had formerly camped until I came to Bethel, the place where I had built an altar. And I built a second altar and laid on it a sacrifice, and an offering to the Most High God."}, {"t": "p", "x": "And there I called on the name of the Lord of worlds and praised the Name of God and blessed God, and I gave thanks before God for all the riches and favours which He had bestowed on me. For He had dealt kindly towards me and had led me back in peace into this land. After that day, Lot departed from me on account of the deeds of our shepherds. He went away and settled in the valley of the Jordan, together with all his flocks; and I myself added more to them. He kept his sheep and journeyed as far as Sodom, and he bought a house for himself in Sodom and dwelt in it."}, {"t": "p", "x": "But I dwelt on the mountain of Bethel and it grieved me that my nephew Lot had departed from me. And God appeared to me in a vision at night and said to me, ‘Go to Ramath Hazor which is north of Bethel, the place where you dwell, and lift up your eyes and look to the east and to the west and to the south and to the north; and behold all this land which I give to you and your seed forever.’"}, {"t": "p", "x": "The next morning, I went up to Ramath Hazor and from that high place I beheld the land from the River of Egypt to Lebanon and Senir, and from the Great Sea to Hauran, and all the land of Gebal as far as Kadesh, and all the Great Desert to the east of Hauran and Senir as far as the Euphrates. And He said to me, ‘I will give all this land to your seed and they shall possess it forever. And I will multiply your seedlike the dust of the earth which no man can number; neither shall any man number your seed. Rise and go!"}, {"t": "p", "x": "Behold the length and breadth of the land, for it is yours; and after you, I will give it to your seed forever.’ And I, Abram, departed to travel about and see the land. I began my journey at the river Gihon and travelled along the coast of the Sea until I came to the Mountain of the Bull (Taurus). Then I travelled from the coast of the Great Salt Sea and journeyed towards the east by the Mountain of the Bull, across the breadth of the land, until I came to the river Euphrates."}, {"t": "p", "x": "I journeyed along the Euphrates until I came to the Red Sea (Persian Gulf) in the east, and I travelled along the coast of the Red Sea until I came to the tongue of the Sea of Reeds (the modern Red Sea) which flows out from the Red Sea. Then I pursued my way in the south until I came to the river Gihon, and returning, I came to my house in peace and found all things prosperous there. Iwent to dwell at the Oaks of Mamre, which is at Hebron, north-east of Hebron; and I built an altar there, and laid on it a sacrifice and an oblation to the Most High God."}, {"t": "p", "x": "I ate and drank there, I and all the men of my household, and I sent for Mamre, Ornam and Eshkol, the three Amorite brothers, my friends, and they ate and drank with me.Before these days, Kedorlaomer king of Elam had set out with Amrafel king of Babylon, Ariok king of Kaptok, and Tidal king of the nations which lie between the rivers; and they had waged war against Beraking of Sodom, Birsha king of Gomorrah, Shinab king of Admah, Shemiabad king of Zeboim, and against the king of Bela."}, {"t": "p", "x": "All these had made ready for battle in the valley of Siddim, and the king of Elam and the other kings with him had prevailed over the king of Sodom and his companions and had imposed a tribute upon them. For twelve years they had paid their tribute to the king of Elam, but in the thirteenth year they rebelled against him. And in the fourteenth year, the king of Elam placed himself at the head of all his allies and went up by the Way of the Wilderness; and they smote and pillaged from the river Euphrates onward."}, {"t": "p", "x": "They smote the Refaim who were at Ashteroth Karnaim, the Zumzamim who were at Ammon, the Emim [who were at] Shaveh ha-Keriyyoth, and the Horites who were in the mountains of Gebal, until they came to El Paran which is in the Wilderness. And they returned... at Hazazon Tamar. The king of Sodom went out to meet them, together with the king [of Gomorrah], the king of Admah, the king of Zeboim, and the king of Bela, [and they fought] a battle in the valley [of Siddim] against Kedorlaomer [king of Elam and the kings] who were with him."}, {"t": "p", "x": "But the king of Sodom was vanquished and fled, and the king of Gomorrah fell into the pits... [And] the king of Elam [carried off] all the riches of Sodom and [Gomorrah]... and they took Lot the nephew XXII of Abram who dwelt with them in Sodom, together with all his possessions. Now one of the shepherds of the flocks which Abram had given to Lot escaped from captivity and came to Abram; at that time Abram dwelt in Hebron."}, {"t": "p", "x": "He told him that Lot his nephew had been taken, together with all his possessions, but that he had not been slain and that the kings had gone by the Way of the Great Valley (of the Jordan) in the direction of their land, taking captives and plundering and smiting and slaying, and that they were journeying towards the land of Damascus. Abram wept because of Lot his nephew. Then he braced himself; he rose up and chose from among his servants three hundred and eighteen fighting men trained for war, and Ornam and Eshkol and Mamre went with him also."}, {"t": "p", "x": "He pursued them until he came to Dan, and came on them while they were camped in the valley of Dan. He fell on them at night from four sides and during the night he slew them; he crushed them and put them to flight, and all of them fled before him until they came to Helbon which is north of Damascus. He rescued from them all their captives, and all their booty and possessions. He also delivered Lot his nephew, together with all his possessions, and he brought back all the captives which they had taken."}, {"t": "p", "x": "When the king of Sodom learned that Abram had brought back all the captives and all the booty, he came out to meet him; and he went to Salem, which is Jerusalem. Abram camped in the valley of Shaveh, which is the valley of the king, the valley of Beth-ha-Kerem; and Melchizedek king of Salem brought out food and drink to Abram and to all the men who were with him. He was the Priest of the Most High God. And he blessed Abram and said, ‘Blessed be Abram by the Most High God, Lord of heaven and earth! And blessed be the Most High God who has delivered your enemies into your hand!’"}, {"t": "p", "x": "And Abram gave him the tithe of all the possessions of the king of Elam and his companions. Then the king of Sodom approached and said to Abram, ‘My lord Abram, give me the souls which are mine, which you have delivered from the king of Elam and taken captive, and you may have all the possessions.’ Then said Abram to the king of Sodom, ‘I raise my hand this day to the Most High God, Lord of heaven and earth! I will take nothing of yours, not even a shoe-lace or shoe-strap, lest you say, Abram’s riches come from my possessions!"}, {"t": "p", "x": "I will take nothing but that which the young men with me have eaten already, and the portion of the three men who have come with me. They shall decide whether they will give you their portion.’ And Abram returned all the possessions and all the captives and gave them to the king of Sodom; he freed all the captives from this land who were with him, and sent them all back. After these things, God appeared to Abram in a vision and said to him, ‘Behold, ten years have passed since you departed from Haran."}, {"t": "p", "x": "For two years you dwelt here and you spent seven years in Egypt, and one year has passed since you returned from Egypt. And now examine and count all you have, and see how it has grown to be double that which came out with you from Haran. And now do not fear, I am with you; I am your help and your strength. I am a shield above you and a mighty safeguard round about you. Your wealth and possessions shall multiply greatly.’ But Abram said, ‘My Lord God, I have great wealth and possessions but what good shall they do to me? I shall die naked; childless shall I go hence."}, {"t": "p", "x": "A child from my household shall inherit from me. Eliezer son... shall inherit from me.’ And He said to him, ‘He shall not be your heir, but one who shall spring [from your body shall inherit from you].’"}, {"t": "h2", "x": "Jubilees chronology"}, {"t": "table", "x": "", "head": ["Item", "Note", "Year"], "rows": [["1", "And Noah made the ark in all respects as He commanded him, in the twenty-seventh jubilee of years, in the fifth week in the fifth year (on the new moon of the first month). [1307 A.M.]", "1307"], ["2", "And he entered in the sixth (year) thereof, [1308 A.M.] in the second month, on the new moon of the second month, till the sixteenth; and he entered, and all that we brought to him, into the ark, and the Lord closed it from without on the seventeenth evening.", "1308"], ["3", "And the Lord opened seven flood-gates of heaven", ""], ["", "And the mouths of the fountains of the great deep, seven mouths in number.", ""], ["4", "And the flood-gates began to pour down water from the heaven forty days and forty nights", ""], ["", "And the fountains of the deep also sent up waters, until the whole world was full of water.", ""], ["5", "And the waters increased upon the earth:", ""], ["", "Fifteen cubits did the waters rise above all the high mountains", ""], ["", "And the ark was lift up above the earth", ""], ["", "And it moved upon the face of the waters.", ""], ["6", "And the water prevailed on the face of the earth five months -one hundred and fifty days.", ""], ["7", "And the ark went and rested on the top of Lubar, one of the mountains of Ararat.", ""], ["8", "And (on the new moon) in the fourth month the fountains of the great deep were closed and the flood-gates of heaven were restrained; and on the new moon of the seventh month all the mouths of the abysses of the earth were opened, and the water began to descend into the deep below.", ""], ["9", "And on the new moon of the tenth month the tops of the mountains were seen, and on the new moon of the first month the earth became visible.", ""], ["10", "And the waters disappeared from above the earth in the fifth week in the seventh year [1309 A.M.] thereof, and on the seventeenth day in the second month the earth was dry.", "1309"], ["11", "And on the twenty-seventh thereof he opened the ark, and sent forth from it beasts, and cattle, and birds, and every moving thing.", ""], ["1", "And in the seventh week in the first year [1317 A.M.] thereof, in this jubilee, Noah planted vines on the mountain on which the ark had rested, named Lubar, one of the Ararat Mountains, and they produced fruit in the fourth year, [1320 A.M.] and he guarded their fruit, and gathered it in this year in the seventh month.", "1317"], ["2", "And he made wine there from and put it into a vessel, and kept it until the fifth year, [1321 A.M.] until the first day, on the new moon of the first month.", "1321"], ["1", "And these are the sons of Shem: Elam, and Asshur, and Arpachshad -this (son) was born two years after the flood- and Lud, and Aram.", ""], ["2", "The sons of Japheth: Gomer and Magog and Madai and Javan, Tubal and Meshech and Tiras: these are the sons of Noah.", ""], ["3", "And in the twenty-eighth jubilee [1324-1372 A.M.] Noah began to enjoin upon his sons' sons the ordinances and commandments, and all the judgments that he knew, and he exhorted his sons to observe righteousness, and to cover the shame of their flesh, and to bless their Creator, and honour father and mother, and love their neighbour, and guard their souls from fornication and uncleanness and all iniquity.", "1324"], ["4", "For owing to these three things came the flood upon the earth, namely, owing to the fornication wherein the Watchers against the law of their ordinances went a whoring after the daughters of men, and took themselves wives of all which they chose: and they made the beginning of uncleanness.", ""], ["5", "And they begat sons the Naphidim, and they were all unlike, and they devoured one another: and the Giants slew the Naphil, and the Naphil slew the Eljo, and the Eljo mankind, and one man another.", ""], ["6", "And every one sold himself to work iniquity and to shed much blood, and the earth was filled with iniquity.", ""], ["7", "And after this they sinned against the beasts and birds, and all that moves and walks on the earth: and much blood was shed on the earth, and every imagination and desire of men imagined vanity and evil continually.", ""], ["8", "And the Lord destroyed everything from off the face of the earth; because of the wickedness of their deeds, and because of the blood which they had shed in the midst of the earth He destroyed everything.", ""], ["", "And we were left, I and you, my sons, and everything that entered with us into the ark, and behold I see your works before me that ye do not walk in righteousness: for in the path of destruction ye have begun to walk, and ye are parting one from another, and are envious one of another, and (so it comes) that ye are not in harmony, my sons, each with his brother.", ""], ["9", "For I see, and behold the demons have begun (their) seductions against you and against your children and now I fear on your behalf, that after my death ye will shed the blood of men upon the earth, and that ye, too, will be destroyed from the face of the earth.", ""], ["10", "For whoso sheddeth man's blood, and whoso eateth the blood of any flesh, shall all be destroyed from the earth.", ""], ["12", "And there shall not be left any man that eateth blood, or that sheddeth the blood of man on the earth, Nor shall there be left to him any seed or descendants living under heaven; For into Sheol shall they go, And into the place of condemnation shall they descend, And into the darkness of the deep shall they all be removed by a violent death.", ""], ["1", "In the twenty-ninth jubilee, in the first week, [1373 A.M.] in the beginning thereof Arpachshad took to himself a wife and her name was Rasu'eja, the daughter of Susan, the daughter of Elam, and she bare him a son in the third year in this week, [1375 A.M.] and he called his name Kainam.", "1373"], ["2", "And the son grew, and his father taught him writing, and he went to seek for himself a place where he might seize for himself a city.", ""], ["3", "And he found a writing which former (generations) had carved on the rock, and he read what was thereon, and he transcribed it and sinned owing to it; for it contained the teaching of the Watchers in accordance with which they used to observe the omens of the sun and moon and stars in all the signs of heaven.", ""], ["4", "And he wrote it down and said nothing regarding it; for he was afraid to speak to Noah about it lest he should be angry with him on account of it.", ""], ["5", "And in the thirtieth jubilee, [1429 A.M.] in the second week, in the first year thereof, he took to himself a wife, and her name was Melka, the daughter of Madai, the son of Japheth, and in the fourth year [1432 A.M.] he begat a son, and called his name Shelah; for he said: 'Truly I have been sent.'", "1429"], ["6", "[And in the fourth year he was born], and Shelah grew up and took to himself a wife, and her name was Mu'ak, the daughter of Kesed, his father's brother, in the one and thirtieth jubilee, in the fifth week, in the first year [1499 A.M.] thereof.", "1499"], ["7", "And she bare him a son in the fifth year [1503 A.M.] thereof, and he called his name Eber: and he took unto himself a wife, and her name was 'Azûrâd, the daughter of Nebrod, in the thirty-second jubilee, in the seventh week, in the third year thereof. [1564 A.M.]", "1503"], ["8", "And in the sixth year [1567 A.M.] thereof, she bare him son, and he called his name Peleg; for in the days when he was born the children of Noah began to divide the earth amongst themselves: for this reason he called his name Peleg.", "1567"], ["9", "And they divided (it) secretly amongst themselves, and told it to Noah.", ""]]}, {"t": "p", "x": "Showing the first 80 of 275 rows; full sheet Dead Sea Scrolls.", "sub": true}, {"t": "p", "x": "And the flood-gates began to pour down water from the heaven forty days and forty nights"}, {"t": "p", "x": "And the fountains of the deep also sent up waters, until the whole world was full of water."}, {"t": "h2", "x": "Summary: Jubilees"}, {"t": "h3", "x": "THE BOOK OF JUBILEES: WATCHERS, FLOOD & TIMELINE"}, {"t": "table", "x": "Summary Jubilees", "head": ["Angels descended in days of Jared", "NOAHS WARNING IGNORED", "WHAT IS A JUBILEE?"], "rows": [["THE WATCHERS (Jub 5:1-10)", "THE FLOOD (Jub 5-6)", "THE JUBILEE SYSTEM"], ["Sent to instruct mankind", "Preached 120 years", "49 years (7 x 7)"], ["(Jub 5:1)", "PRECISE TIMELINE:", "Liberty proclaimed!"]]}, {"t": "p", "x": "Showing the first 40 of 122 rows; full sheet Jubilees.", "sub": true}, {"t": "table", "x": "", "head": ["Item", "Detail", "Detail"], "rows": [["Instead: FORNICATION with women", "", "50th year = Jubilee"], ["", "17th day, 2nd month - flood began", ""], ["They taught forbidden knowledge:", "40 days + 40 nights rain", "CREATION TO SINAI:"], ["- Weapons of War", "150 days waters prevailed", "50 Jubilees = 2450 years"], ["- Sorcery and enchantments", "1st day, 3rd month - land appeared", "KEY DATES IN JUBILEES:"], ["- Cutting of roots (drugs)", "17th day, 7th month - ark rested", "Adam created - Year 1"], ["- Astrology", "", "Seth born - Year 130"], ["", "NOAHS COVENANT (Jub 6:4-14)", "Flood - redator, devours prey", "Detail"], ["", "JUDAH = Lion (Gen 49:9)", "Benjamins fierceness pacified"], ["BEAR raised on one side = Medo-Persia", "Royal power, Messiah symbol", ""], ["Conquering Force - Transition", "Most cited: Lion of Judah", "Leopard lies with Kid"], ["Daniel 7:5", "", "Predator/prey enmity ends"], ["", "DAN = Serpent/Viper (Gen 49:17)", ""], ["LEOPARD with 4 wings = Macedonia", "Cunning, judges his people", "Lion eats chaff like cattle"], ["Alexander the Great - Swift", "", "Judahs power under Gods rule"], ["Daniel 7:6", "NAPHTALI = Deer (Gen 49:21)", ""], ["", "Swift, freedom, messenger", "Serpent sleeps with babies"], ["TERRIBLE BEAST iron teeth = Rome", "", "Dans cunning neutralized"], ["Final/Testing Era - Daniel 7:7", "JOSEPH = Bull/Ox (Deut 33:17)", "ALL TRIBES RESTORED!"], ["APOCALYPTIC SYMBOLS", "EMPIRE MAPPING", "DUAL PURPOSE"], ["DRAGON = Chaos/Satan", "ASSYRIA = First Kingdom", "PURPOSE 1: IDENTIFICATION"], ["Anti-divine forces", "Archetype of pride/tyranny", "Tribal totems identify each"], ["Chinese, Welsh, Revelation", "Pre-Exilic Era", "tribe by traditional symbol"], ["", "", "Wolf=Benjamin, Lion=Judah"], ["EAGLE = Dominion", "MEDIA/PERSIA = Transition", ""], ["Far-reaching power", "The conquering force", "PURPOSE 2: PROPHECY"], ["Roman, Aztec, American", "Bear in Daniel", "Animal trans format ions show"], ["", "", "tribal warfare pacified"], ["SHEEP/LAMB = The Faithful", "MACEDONIA = Hellenistic", "in Messianic Kingdom"], ["The pious flock, vulnerable", "Goat - Alexander the Great", ""], ["Hebrew and Christian", "Swift conquest", "Book 12: Gathered tribes"], ["", "", "All 12 restored under"], ["BULL = Patriarchs/Strength", "ROME = Final Beast", "Messiahs rule!"], ["Also Baal/Golden Calf idol", "The lawless oppressor", "War becomes peace!"], ["Key Sources: Daniel 7:1-8", "Genesis 49 (Jacob's Blessing)", "Deuteronomy 33 (Moses' Blessing)"]]}, {"t": "p", "x": "Showing the first 25 of 774 rows; full sheet NETS Daniel Extract.", "sub": true}, {"t": "p", "x": ". Map every entry (e.g., Rome) to its corresponding zoomorphic archetype (e.g., The Beast/Eagle)."}, {"t": "p", "x": "The \"Benjamin and the Wolf\" reference you likely heard is a fascinating intersection point. While the Sibylline Oracles use the \"wolf\" as a central image for predatory empires, the specific phrase \"Benjamin is a ravenous wolf\" is a famous biblical reference from the Blessing of Jacob in Genesis 49:27."}, {"t": "p", "x": "In apocalyptic study, lecturers often bridge these two because the Sibylline Oracles heavily utilize biblical \"types\" to describe future events. Here is the distinction and a breakdown of what you likely missed in your audio track."}, {"t": "h3", "x": "1. Clarifying \"Benjamin and the Wolf\""}, {"t": "p", "x": "The Biblical Context: The reference to Benjamin as a \"ravenous wolf\" describes the tribe's martial prowess and history of conflict."}, {"t": "p", "x": "The Sibylline Context: The Sibylline Oracles adopt this \"predatory\" language, but they broaden it to describe entire nations. When you hear \"wolf\" in the Oracles, the author is rarely talking about the Tribe of Benjamin; they are almost exclusively identifying a hostile empire (often Rome or an oppressive eastern power) that acts with the same \"devouring\" nature."}, {"t": "p", "x": "2. \"What Else Is In There?\" (The Missing Themes)"}, {"t": "p", "x": "If you fell asleep, you likely missed the broader \"Apocalyptic Arc\" that the Sibyls describe. These texts are structured as a historical roadmap that aims to convince the reader that the end is near. Here are the core pillars that define the rest of the content:"}, {"t": "p", "x": "The Ten Generations (The \"Timeline Era\"): The Sibylline Oracles are famous for dividing world history into distinct chronological periods. You likely missed the section detailing these \"generations,\" which categorize civilizations from the creation to the final judgment."}, {"t": "p", "x": "The \"Messianic\" Coming: A significant portion of the text is dedicated to the arrival of a divine/messianic figure who defeats the \"dragons\" and \"wolves\" (the empires). This is the \"resolution\" to the geopolitical chaos they describe."}, {"t": "p", "x": "Cataclysmic Signs: The authors list specific, terrifying signs that precede the end of an age: earthquakes, famine, the sea drying up, and celestial disturbances (the sun and moon failing)."}, {"t": "p", "x": "The \"Pagan Witness\" Defense: The Oracles frequently argue that even the Greek gods and ancient sages knew the truth about the one Creator. They use this to \"validate\" their apocalyptic claims to non-Jewish or non-Christian audiences."}, {"t": "table", "x": "", "head": ["Sibylline Theme", "Project Integration"], "rows": [["Cataclysmic Signs", "A boolean column (True/False) for events that mirror Sibylline warnings."], ["Predatory Empires", "Wolf, lion and eagle tags apply to these entities."]]}, {"t": "p", "x": "[Sibylline]"}, {"t": "h4", "x": "1. The \"Wolf\" Typology: The Transformer"}, {"t": "p", "x": "When the Sibylline Oracles and other apocalyptic texts use the \"wolf\" imagery, they are invoking a archetype of volatile, martial, and often predatory power."}, {"t": "p", "x": "Saul (The King): He starts as the chosen protector but ends as a \"wolf\" in his own right, consumed by jealousy and instability."}, {"t": "p", "x": "Paul (The Apostle): He is the ultimate subversion of this archetype. As a Pharisee (and Benjamite), he acted as a \"wolf\" devouring the early Church. His conversion is the most famous example of a \"predatory beast\" being tamed and transformed into a shepherd."}, {"t": "h4", "x": "[Archetype: The Transformed Wolf]"}, {"t": "h4", "x": "2. The \"Biblical Numbers\" (Structural Markers)"}, {"t": "p", "x": "The numbers you heard (3, 40, 300) are the \"load-bearing beams\" of ancient apocalyptic literature. They aren't mystical code; they are markers of completion and testing."}, {"t": "table", "x": "", "head": ["Category", "Entity / Symbol", "Historical/Prophetic Meaning"], "rows": [["Number", "Biblical/Apocalyptic Meaning", "Application in the matrix"], ["3", "Divine Completion / Resurrection: Represents the fullness of the Godhead or the cycle of life/death/rebirth.", ""], ["40", "The Period of Testing/Purification: Think of the 40 days of rain (Flood), 40 years in the wilderness, 40 days of temptation.", ""]]}, {"t": "p", "x": "Because the name \"Sublime Oracles\" is not a standard title in historical or biblical studies, it is very common for it to be a misremembered reference to the Sibylline Oracles—especially given how closely they parallel the apocalyptic and prophetic themes found in 1 Enoch and other pseudepigraphical works you are analyzing. Who Wrote Them and When? The Sibylline Oracles are not the work of a single author; they are pseudepigraphical, meaning they were written by various anonymous authors over many centuries, who attributed their writings to the ancient Greek prophetesses known as \"Sibyls\". The Origin:"}, {"t": "p", "x": "The practice of writing these oracles began with Hellenistic Jews in Alexandria around the 2nd century BCE."}, {"t": "h2", "x": "Summary: Sibylline oracles"}, {"t": "p", "x": "BENJAMIN = Wolf (Gen 49:27): Isaiah 11:6-8 Prophecy:"}, {"t": "p", "x": "The same animals that represent tribal identity and empire power will be TRANSFORMED in the Messianic age - predators become peaceful!"}, {"t": "p", "x": "Cross-referenced with Daniel 7, Isaiah 11, Genesis 49 - Tribal Animals & Messianic Peace"}, {"t": "h2", "x": "King James translator rules"}, {"t": "table", "x": "KJV Trans Notes", "head": ["Strong’s", "Greek", "Meaning", "Occurrences", "Key Texts", "Research Note"], "rows": [["", "ῥαπίζω (rhapizō)", "To slap / strike with the palm", "2x in NT", "Matt 5:39; Matt 26:67", "Used for both “turn the other cheek” and Jesus being struck during abuse/trial."], ["", "ῥάπισμα (rhapisma)", "A slap / blow with the hand", "3x in NT", "Mark 14:65; John 18:22; John 19:3", "Trial-abuse noun; all three occurrences cluster around Jesus being mocked/struck."], ["", "ῥαφίς (rhaphis)", "A needle", "Synoptic proverb", "Matt 19:24; Mark 10:25; Luke 18:25 textual note", "“Eye of a needle” proverb. Luke may use βελόνη (belonē) in some critical texts, fitting his medical vocabulary."], ["Matthew 19:24 / Mark 10:25 / Luke 18:25", "It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God.", "", "", "", "The Greek “needle” term ties the proverb to impossibility imagery, not merely difficulty. Track rhaphis vs belonē in Luke."], ["Manuscript", "Date", "Contents", "Location / Discovery", "Key Feature", "Research Note"], ["Papyrus Rylands 458", "2nd century BCE", "Fragments of Deuteronomy 23–28", "John Rylands Library, Manchester", "Often cited as oldest surviving Greek OT manuscript", "Important pre-Christian LXX witness."], ["Papyrus Fouad 266", "1st century BCE", "Genesis and Deuteronomy fragments", "Egypt", "Divine name preserved in Hebrew/Aramaic square letters instead of Greek Kurios", "Major evidence for early handling of the divine name inside Greek biblical manuscripts."], ["Dead Sea Scroll Greek fragments", "1st century BCE – 1st century CE", "Greek fragments including Leviticus, Numbers, Exodus", "Qumran caves 4 and 7", "Shows Greek biblical texts among the Dead Sea Scrolls", "Includes 4Q119 / 4Q120 and other Greek witnesses."], ["Greek Minor Prophets Scroll", "1st century CE", "Minor Prophets", "Nahal Hever, Judean desert", "Heavily revised Greek text", "Important for studying LXX revision toward Hebrew text traditions."], ["Codex", "Date", "Contents", "Current Location", "Key Feature", "Research Note"], ["Codex Vaticanus", "Early 4th century CE", "Greek Old and New Testaments", "Vatican Library", "One of the most authoritative early Greek Bible witnesses", "Very important for LXX and NT textual comparison."], ["Codex Sinaiticus", "Mid 4th centu of afflicting them; and he said unto the people of Egypt: 13. \" Behold the people of the children of Israel have increased and multiplied more than we."}, {"t": "p", "x": "Come and let us deal wisely with them before they become too many, and let us afflict them with slavery before war come upon us and before they too fight against us; else they will join themselves unto our enemies and get them up out of our land, for their hearts and faces are towards the land of Canaan.\" 14. And he set over them taskmasters to afflict them with slavery; and they built strong2 cities for ^Pharaoh, Pithom and Raamses, and they built all -the walls and all the fortifications which had fallen in the cities of Egypt. 15."}, {"t": "p", "x": "And they mado them serve with rigour, and the more they dealt evilly with them, the more they increased and multiplied. 16. And the people of Egypt abominated the children of Israel. The Birth and Early Years oi Moses (xlvii. 1-12; cf. Exod. ii.). XLVII. And in the seventh week, in the seventh 2303 am year, in the forty-seventh jubilee, thy father 3 went forth from the land of Canaan, and thou wast born in the fourth week, in the sixth year thereof, in the 2330 am forty-eighth jubilee; this was the time of tribulation on the children of Israel. 2."}, {"t": "p", "x": "And Pharaoh, king of Egypt, issued a command regarding them that they 1 This interesting statement apparently implies that some of the Hebrew tribes were already in Canaan before the Exodus. Or is it a reminiscence of the fact that the tribe of Judah absorbed some South Canaanitish tribes which were never in Egypt? Cf. Burncy in Journal of Theological Studies, 1908, p-352. 2 So LXX (Exod. i. 11); MT =? store cities.\" * i. e. Moses* father, Amram. should cast all their male children which were born into the river. 3. And they cast them in for seven months until the day that thou wast born."}, {"t": "p", "x": "And thy mother hid thee tor three months, and they told regarding her. 4. And she made an ark for thee, and covered it with pitch and asphalt, and placed it in the flags on the bank of the river, and she placed thee in it seven days, and thy mother came by night and suckled thee, and by day Miriam, thy sister, guarded thee from the birds. 5. And in those days Tharmuth,1 the daughter of Pharaoh, came to bathe in the river, and she heard thv voice crying, and she told her maidens to bring thee forth, and they brought thee unto her. 6. And she took thee out of the ark, and she had compassion on thee. 7."}, {"t": "p", "x": "And thy sister said unto her: \" Sl^all I go and call unto thee one of the Hebrew women to nurse and suckle this babe for thee?,\" And she said (unto her): \" Go.\" 8. And she went and called thy mother Jochebed,2 and she gave her wages, and she nursed thee. 9. And afterwards, when thou wast grownup, they brought thee unto the daughter of Pharaoh, and thou didst become her son, and Amram thy father taught thee writing,3 and after thou hadst completed three weeks they brought thee into the royal court. 10."}, {"t": "p", "x": "And thou 2351-2372 wast three weeks of years at court until the time a.m. when thou didst go forth from the royal court and didst see an Egyptian smiting thy friend who was of the children of Israel, and thou didst slay him and hide him in the sand. 11. And on the second day thou didst find two of the children of Israel striving together, and thou didst say to him who was doing the wrong: \" Why dost thou smite thy brother? ' 12. And he was angry and indignant, and said: \" Who made thee a prince and a judge over us? Thinkest thou to kill me as thou killedst the Egyptian yesterday? \""}, {"t": "p", "x": "And thou didst fear and flee on account of these words. 1 Thcrmuthis (Josephus, Ant. ii. 9, 5, 7). a Cf. Exod. vi. 20; Num.xxvi.59. 3 Contrast Acts vii. 22. From the Flight of Moses to the Exodus (xlviii. 1-19; cf. Exod. ii. 15 if., iv. 19-24, vii.-xiv.). XLVIII. And in the sixtli year of the third week
